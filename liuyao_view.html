<script id="xinggui-ly-mobile-overview-toggle-v2">
(function(){'use strict';
 function init(){
  const panel=document.getElementById('liuyao-tab-panel');
  if(!panel)return;
  const attach=()=>{
   const table=panel.querySelector('.am-prof');if(!table)return;
   const scroll=table.closest('.am-scroll')||table.parentElement;
   if(!scroll||scroll.querySelector('.ly-mobile-zoom'))return;
   const btn=document.createElement('button');btn.type='button';btn.className='ly-mobile-zoom';
   btn.textContent='放大阅读（可左右滑动）';
   btn.addEventListener('click',()=>{
    const expanded=table.classList.toggle('am-mobile-expanded');
    btn.textContent=expanded?'恢复六爻同屏':'放大阅读（可左右滑动）';
   });
   scroll.insertBefore(btn,table);
  };
  new MutationObserver(attach).observe(panel,{childList:true,subtree:true});
  attach();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>

function liuyaoDraftKey(){return 'xinggui_liuyao_draft_'+signedInId}
function validDraft(x){return x&&Array.isArray(x.yaos)&&x.yaos.length===6&&x.yaos.every(v=>[6,7,8,9].includes(v))}
function openLiuyaoDraft(index){
 const x=historyLocal('liuyao')[index];if(!validDraft(x)){alert('草稿数据不完整，无法开启');return}

document.addEventListener('DOMContentLoaded',async()=>{if(!await initAccount())return;const d=new Date();document.getElementById('when').value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);document.getElementById('toss').onclick=()=>{if(yaos.length>=6){alert('六爻已完成，请重新起卦');return}yaos.push(toss());draw()};document.getElementById('random').onclick=()=>{yaos=Array.from({length:6},toss);draw()};document.getElementById('clear').onclick=()=>{yaos=[];draw()};document.getElementById('mode').onchange=updateMode;document.getElementById('day-stem').onchange=drawNajia;document.getElementById('save').onclick=()=>{if(yaos.length!==6){alert('请先完成六爻');return}saveLocal('liuyao',{question:document.getElementById('question').value,when:document.getElementById('when').value,yongshen:document.getElementById('yongshen').value,yaos:[...yaos],dayStem:document.getElementById('day-stem').value,dayPillar:document.getElementById('liuyao-day-pillar')?.value||'',monthBranch:document.getElementById('liuyao-month-branch')?.value||'',calendarSnapshot:window.XingguiLiuyaoCalendarSnapshot?.()||null});history()};draw();history()});

/* 独立 UI 增量：不改变 yaos 数据结构、排盘函数、登录和数据库。 */
(function(){
 'use strict';
 const manual=document.getElementById('manual');
 if(!manual)return;
 function refresh(){
   const box=manual.querySelector('.manual-live-preview');if(!box)return;
   const rows=[...manual.querySelectorAll('select[data-index]')].sort((a,b)=>Number(b.dataset.index)-Number(a.dataset.index));
   box.querySelector('.manual-preview-lines').innerHTML=rows.map(sel=>{
     const v=Number(sel.value),yang=v%2===1,moving=v===6||v===9;
     return '<div class="manual-preview-line'+(moving?' moving':'')+'" aria-label="'+(Number(sel.dataset.index)+1)+'爻 '+(yang?'阳':'阴')+(moving?'动':'静')+'">'+
       '<div class="manual-preview-glyph '+(yang?'yang':'yin')+'"><span></span>'+(yang?'':'<span></span>')+'</div>'+
       '<span class="manual-preview-mark">'+(v===9?'○':v===6?'×':'')+'</span></div>';
   }).join('');
 }
 function mount(){
   if(!manual.querySelector('select[data-index]')||manual.querySelector('.manual-live-preview'))return;
   const panel=document.createElement('aside');panel.className='manual-live-preview';panel.setAttribute('aria-label','实时六爻预览');
   panel.innerHTML='<div class="manual-preview-title">六爻实时预览</div><div class="manual-preview-lines"></div><div class="manual-preview-foot">上爻 ↑　初爻 ↓<br>金色为动爻</div>';
   manual.appendChild(panel);refresh();
 }
 manual.addEventListener('change',e=>{if(e.target.matches('select[data-index]'))refresh()});
 new MutationObserver(()=>mount()).observe(manual,{childList:true});
 mount();
})();

window.XingguiLiuyaoClassics={"乾为天":{"number":1,"guaci":"乾：元亨。利贞。","tuan":"大哉乾元，万物资始，乃统天。云行雨施，品物流形，大明终始，六位时成。时乘六龙以御天，乾道变化，各正性命，保合大和，乃利贞。首出庶物，万国咸宁。","xiang":"天行健，君子以自强不息。","lines":["初九：潜龙勿用。","九二：见龙在田，利见大人。","九三：君子终日乾乾，夕惕若；厉，无咎。","九四：或跃在渊，无咎。","九五：飞龙在天，利见大人。","上九：亢龙，有悔。"],"line_xiang":["潜龙勿用，阳在下也。","见龙在田，德施普也。","终日乾乾，反复道也。","或跃在渊，进无咎也。","飞龙在天，大人造也。","亢龙有悔，盈不可久也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E4%B9%BE","revision":"2404991","extra":"用九：见群龙无首，吉。"},"天泽履":{"number":10,"guaci":"履虎尾，不咥人，亨。","tuan":"履，柔履刚也。说而应乎干，是以履虎尾，不咥人，亨。刚中正，履帝位而不疚，光明也。","xiang":"上天下泽，履；君子以辨上下，定民志。","lines":["初九：素履，往无咎。","九二：履道坦坦，幽人贞吉。","六三：眇能视，跛能履，履虎尾，咥人，凶。武人为于大君。","九四：履虎尾，愬愬终吉。","九五：夬履，贞厉。","上九：视履考祥，其旋元吉。"],"line_xiang":["素履之往，独行愿也。","幽人贞吉，中不自乱也。","眇能视，不足以有明也。跛能履，不足以与行也。咥人之凶，位不当也。武人为于大君，志刚也。","愬愬终吉，志行也。","夬履贞厉，位正当也。","元吉在上，大有庆也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%B1%A5","revision":"2494097"},"天火同人":{"number":13,"guaci":"同人于野，亨。 利涉大川，利君子贞。","tuan":"同人，柔得位得中，而应乎干，曰同人。同人曰，同人于野，亨。利涉大川，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。","xiang":"天与火，同人；君子以类族辨物。","lines":["初九：同人于门，无咎。","六二：同人于宗，吝。","九三：伏戎于莽，升其高陵，三岁不兴。","九四：乘其墉，弗克，攻吉。","九五：同人，先号啕而后笑。大师克相遇。","上九：同人于郊，无悔。"],"line_xiang":["出门同人，又谁咎也。","同人于宗，吝道也。","伏戎于莽，敌刚也。三岁不兴，安行也。","乘其墉，义弗克也，其吉，则困而反则也。","同人之先，以中直也。大师相遇，言相克也。","同人于郊，志未得也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%90%8C%E4%BA%BA","revision":"2106140"},"天雷无妄":{"number":25,"guaci":"无妄：元亨。利贞。其匪正有眚，不利有攸往。","tuan":"无妄，刚自外来，而为主于内。动而健，刚中而应，大亨以正，天之命也。其匪正有眚，不利有攸往。无妄之往，何之矣？天命不佑，行矣哉？","xiang":"天下雷行，物与无妄；先王以茂对时，育万物。","lines":["初九：无妄，往吉。","六二：不耕获，不菑畬，则利有攸往。","六三：无妄之灾，或系之牛，行人之得，邑人之灾。","九四：可贞，无咎。","九五：无妄之疾，勿药有喜。","上九：无妄，行有眚，无攸利。"],"line_xiang":["无妄之往，得志也。","不耕获，未富也。","行人得牛，邑人灾也。","可贞无咎，固有之也。","无妄之药，不可试也。","无妄之行，穷之灾也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E6%97%A0%E5%A6%84","revision":"2527352"},"天风姤":{"number":44,"guaci":"姤：女壮，勿用取女。","tuan":"姤，遇也，柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉！","xiang":"天下有风，姤；后以施命诰四方。","lines":["初六：系于金柅，贞吉，有攸往，见凶，羸豕孚踟躅。","九二：包有鱼，无咎，不利宾。","九三：臀无肤，其行次且，厉，无大咎。","九四：包无鱼，起凶。","九五：以杞包瓜，含章，有陨自天。","上九：姤其角，吝，无咎。"],"line_xiang":["系于金柅，柔道牵也。","包有鱼，义不及宾也。","其行次且，行未牵也。","无鱼之凶，远民也。","九五含章，中正也。有陨自天，志不舍命也。","姤其角，上穷吝也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%A7%A4","revision":"2437487"},"天水讼":{"number":6,"guaci":"讼：有孚，窒，惕，中吉，终凶。利见大人，不利涉大川。","tuan":"讼，上刚下险，险而健，讼。讼，有孚，窒，惕，中吉，刚来而得中也。终凶，讼不可成也。利见大人，尚中正也。不利涉大川，入于渊也。","xiang":"天与水违行，讼；君子以作事谋始。","lines":["初六：不永所事，小有言，终吉。","九二：不克讼，归而逋，其邑人三百户无眚。","六三：食旧德，贞厉，终吉。或从王事，无成。","九四：不克讼，复即命渝，安贞吉。","九五：讼，元吉。","上九：或锡之鞶带，终朝三褫之。"],"line_xiang":["不永所事，讼不可长也。虽小有言，其辩明也。","不克讼，归逋窜也。自下讼上，患至掇也。","食旧德，从上吉也。","复即命渝，安贞，不失也。","讼，元吉，以中正也。","以讼受服，亦不足敬也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E8%A8%9F","revision":"2405032"},"天山遁":{"number":33,"guaci":"遁：亨。小利贞。","tuan":"遁亨，遁而亨也。刚当位而应，与时行也。小利贞，浸而长也。遁之时义大矣哉！","xiang":"天下有山，遁；君子以远小人，不恶而严。","lines":["初六：遁尾，厉，勿用有攸往。","六二：执之用黄牛之革，莫之胜说。","九三：系遁，有疾厉，畜臣妾吉。","九四：好遁君子吉，小人否。","九五：嘉遁，贞吉。","上九：肥遁，无不利。"],"line_xiang":["遁尾之厉，不往何灾也。","执用黄牛，固志也。","系遁之厉，有疾惫也。畜臣妾吉，不可大事也。","君子好遁，小人否也。","嘉遁贞吉，以正志也。","肥遁，无不利；无所疑也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E9%81%AF","revision":"2405037"},"天地否":{"number":12,"guaci":"否之匪人，不利君子贞，大往小来。","tuan":"否之匪人，不利君子贞，大往小来。则是天地不交而万物不通也，上下不交而天下无邦也。内阴而外阳，内柔而外刚，内小人而外君子，小人道长，君子道消也。","xiang":"天地不交，否；君子以俭德辟难，不可荣以禄。","lines":["初六，拔茅茹以其汇，贞吉。亨。","六二，包承，小人吉，大人否。亨。","六三，包羞。","九四，有命，无咎，畴离祉。","九五，休否，大人吉。其亡其亡，系于苞桑。","上九，倾否，先否后喜。"],"line_xiang":["拔茅贞吉，志在君也。","大人否，亨。不乱群也。","包羞，位不当也。","有命无咎，志行也。","大人之吉，位正当也。","否终则倾，何可长也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%90%A6","revision":"2106139"},"泽天夬":{"number":43,"guaci":"夬：扬于王庭，孚号，有厉，告自邑，不利即戎，利有攸往。","tuan":"夬，决也，刚决柔也。健而说，决而和，扬于王庭，柔乘五刚也。孚号有厉，其危乃光也。告自邑，不利即戎，所尚乃穷也。利有攸往，刚长乃终也。","xiang":"泽上于天，夬；君子以施禄及下，居德则忌。","lines":["初九：壮于前趾，往不胜为咎。","九二：惕号，莫夜有戎，勿恤。","九三：壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。","九四：臀无肤，其行次且。牵羊悔亡，闻言不信。","九五：苋陆夬夬，中行无咎。","上六：无号，终有凶。"],"line_xiang":["不胜而往，咎也。","莫夜有戎，得中道也。","君子夬夬，终无咎也。","其行次且，位不当也。闻言不信，聪不明也。","中行无咎，中未光也。","无号之凶，终不可长也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%A4%AC","revision":"2405003"},"兑为泽":{"number":58,"guaci":"兑：亨。利贞。","tuan":"兑，说也。刚中而柔外，说以利贞，是以顺乎天，而应乎人。说以先民，民忘其劳；说以犯难，民忘其死；说之大，民劝矣哉！","xiang":"丽泽，兑；君子以朋友讲习。","lines":["初九：和兑，吉。","九二：孚兑，吉，悔亡。","六三：来兑，凶。","九四：商兑，未宁，介疾有喜。","九五：孚于剥，有厉。","上六：引兑。"],"line_xiang":["和兑之吉，行未疑也。","孚兑之吉，信志也。","来兑之凶，位不当也。","九四之喜，有庆也。","孚于剥，位正当也。","上六引兑，未光也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%85%8C","revision":"2404993"},"泽火革":{"number":49,"guaci":"革：巳日乃孚，元亨。利贞。悔亡。","tuan":"革，水火相息，二女同居，其志不相得，曰革。巳日乃孚；革而信也。文明以说，大亨以正，革而当，其悔乃亡。天地革而四时成，汤武革命，顺乎天而应乎人，革之时义大矣哉！","xiang":"泽中有火，革；君子以治历明时。","lines":["初九：巩用黄牛之革。","六二：巳日乃革之，征吉，无咎。","九三：征凶，贞厉，革言三就，有孚。","九四：悔亡，有孚改命，吉。","九五：大人虎变，未占有孚。","上六：君子豹变，小人革面，征凶，居贞吉。"],"line_xiang":["巩用黄牛，不可以有为也。","巳日革之，行有嘉也。","革言三就，又何之矣。","改命之吉，信志也。","大人虎变，其文炳也。","君子豹变，其文蔚也。小人革面，顺以从君也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E9%9D%A9","revision":"2674393"},"泽雷随":{"number":17,"guaci":"随：元亨。利贞。无咎。","tuan":"随，刚来而下柔，动而说，随。大亨贞，无咎，而天下随时，随之时义大矣哉！","xiang":"泽中有雷，随；君子以向晦入宴息。","lines":["初九：官有渝，贞吉。出门交有功。","六二：系小子，失丈夫。","六三：系丈夫，失小子。随，有求得利，居贞。","九四：随有获，贞凶。有孚在道，以明，何咎。","九五：孚于嘉，吉。","上六：拘系之，乃从维之。王用亨于西山。"],"line_xiang":["官有渝，从正吉也。出门交有功，不失也。","系小子，弗兼与也。","系丈夫，志舍下也。","随有获，其义凶也。有孚在道，明功也。","孚于嘉，吉；位正中也。","拘系之，上穷也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E9%9A%A8","revision":"2497157"},"泽风大过":{"number":28,"guaci":"大过：栋桡，利有攸往，亨。","tuan":"大过，大者过也。栋桡，本末弱也。刚过而中，巽而说行，利有攸往，乃亨。大过之时义大矣哉！","xiang":"泽灭木，大过。君子以独立不惧，遁世无闷。","lines":["初六：藉用白茅，无咎。","九二：枯杨生稊，老夫得其女妻，无不利。","九三：栋桡，凶。","九四：栋隆，吉。有它吝。","九五：枯杨生华，老妇得其士夫，无咎无誉。","上六：过涉灭顶，凶，无咎。"],"line_xiang":["藉用白茅，柔在下也。","老夫女妻，过以相与也。","栋桡之凶，不可以有辅也。","栋隆之吉，不桡乎下也。","枯杨生华，何可久也。老妇士夫，亦可丑也。","过涉之凶，不可咎也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%A4%A7%E9%81%8E","revision":"2405002"},"泽水困":{"number":47,"guaci":"困：亨，贞大人吉，无咎，有言不信。","tuan":"困，刚掩也。险以说，困而不失其所，亨；其唯君子乎？贞大人吉，以刚中也。有言不信，尚口乃穷也。","xiang":"泽无水，困；君子以致命遂志。","lines":["初六：臀困于株木，入于幽谷，三岁不觌。","九二：困于酒食，朱绂方来，利用亨祀，征凶，无咎。","六三：困于石，据于蒺藜，入于其宫，不见其妻，凶。","九四：来徐徐，困于金车，吝，有终。","九五：劓刖，困于赤绂，乃徐有说，利用祭祀。","上六：困于葛藟，于臲卼，曰动悔。有悔，征吉。"],"line_xiang":["入于幽谷，幽不明也。","困于酒食，中有庆也。","据于蒺藜，乘刚也。入于其宫，不见其妻，不祥也。","来徐徐，志在下也。虽不当位，有与也。","劓刖，志未得也。乃徐有说，以中直也。利用祭祀，受福也。","困于葛藟，未当也。动悔，有悔，吉行也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%9B%B0","revision":"2502714"},"泽山咸":{"number":31,"guaci":"咸：亨。利贞。取女吉。","tuan":"咸，感也。柔上而刚下，二气感应以相与，止而说，男下女，是以亨利贞，取女吉也。天地感而万物化生，圣人感人心而天下和平；观其所感，而天地万物之情可见矣！","xiang":"山上有泽，咸；君子以虚受人。","lines":["初六：咸其拇。","六二：咸其腓，凶，居吉。","九三：咸其股，执其随，往吝。","九四：贞吉悔亡，憧憧往来，朋从尔思。","九五：咸其脢，无悔。","上六：咸其辅，颊，舌。"],"line_xiang":["咸其拇，志在外也。","虽凶，居吉，顺不害也。","咸其股，亦不处也。志在随人，所执下也。","贞吉悔亡，未感害也。憧憧往来，未光大也。","咸其脢，志末也。","咸其辅，颊，舌，滕口说也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%92%B8","revision":"2404996"},"泽地萃":{"number":45,"guaci":"萃：亨。王假有庙，利见大人，亨。利贞。用大牲吉，利有攸往。","tuan":"萃，聚也；顺以说，刚中而应，故聚也。王假有庙，致孝享也。利见大人亨，聚以正也。用大牲吉，利有攸往，顺天命也。观其所聚，而天地万物之情可见矣。","xiang":"泽上于地，萃；君子以除戎器，戒不虞。","lines":["初六：有孚不终，乃乱乃萃，若号一握为笑，勿恤，往无咎。","六二：引吉，无咎，孚乃利用禴。","六三：萃如，嗟如，无攸利，往无咎，小吝。","九四：大吉，无咎。","九五：萃有位，无咎。匪孚，元永贞，悔亡。","上六：赍咨涕洟，无咎。"],"line_xiang":["乃乱乃萃，其志乱也。","引吉无咎，中未变也。","往无咎，上巽也。","大吉无咎，位不当也。","萃有位，志未光也。","赍咨涕洟，未安上也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E8%90%83","revision":"2535017"},"火天大有":{"number":14,"guaci":"大有：元亨。","tuan":"大有，柔得尊位，大中而上下应之，曰大有。其德刚健而文明，应乎天而时行，是以元亨。","xiang":"火在天上，大有；君子以遏恶扬善，顺天休命。","lines":["初九：无交害，匪咎，艰则无咎。","九二：大车以载，有攸往，无咎。","九三：公用亨于天子，小人弗克。","九四：匪其彭，无咎。","六五：厥孚交如，威如；吉。","上九：自天佑之，吉无不利。"],"line_xiang":["大有初九，无交害也。","大车以载，积中不败也。","公用亨于天子，小人害也。","匪其彭，无咎；明辨晰也。","厥孚交如，信以发志也。威如之吉，易而无备也。","大有上吉，自天佑也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%A4%A7%E6%9C%89","revision":"2494004"},"火泽睽":{"number":38,"guaci":"睽：小事吉。","tuan":"睽，火动而上，泽动而下；二女同居，其志不同行；说而丽乎明，柔进而上行，得中而应乎刚；是以小事吉。天地睽，而其事同也；男女睽，而其志通也；万物睽，而其事类也；睽之时用大矣哉！","xiang":"上火下泽，睽；君子以同而异。","lines":["初九：悔亡，丧马勿逐，自复；见恶人无咎。","九二：遇主于巷，无咎。","六三：见舆曳，其牛掣，其人天且劓，无初有终。","九四：睽孤，遇元夫，交孚，厉无咎。","六五：悔亡，厥宗噬肤，往何咎。","上九：睽孤， 见豕负涂，载鬼一车， 先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。"],"line_xiang":["见恶人，以辟咎也。","遇主于巷，未失道也。","见舆曳，位不当也。无初有终，遇刚也。","交孚无咎，志行也。","厥宗噬肤，往有庆也。","遇雨之吉，群疑亡也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E7%9D%BD","revision":"2531978"},"离为火":{"number":30,"guaci":"离：利贞。亨。畜牝牛，吉。","tuan":"离，丽也；日月丽乎天，百谷草木丽乎土，重明以丽乎正，乃化成天下。柔丽乎中正，故亨；是以畜牝牛吉也。","xiang":"明两作离，大人以继明照于四方。","lines":["初九：履错然，敬之无咎。","六二：黄离，元吉。","九三：日昃之离，不鼓缶而歌，则大耋之嗟，凶。","九四：突如其来如，焚如，死如，弃如。","六五：出涕沱若，戚嗟若，吉。","上九：王用出征，有嘉折首，获匪其丑，无咎。"],"line_xiang":["履错之敬，以辟咎也。","黄离元吉，得中道也。","日昃之离，何可久也。","突如其来如，无所容也。","六五之吉，离王公也。","王用出征，以正邦也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E9%9B%A2","revision":"2528049"},"火雷噬嗑":{"number":21,"guaci":"噬嗑：亨。利用狱。","tuan":"颐中有物，曰噬嗑，噬嗑而亨。刚柔分，动而明，雷电合而章。柔得中而上行，虽不当位，利用狱也。","xiang":"雷电噬嗑；先王以明罚敕法。","lines":["初九：屦校灭趾，无咎。","六二：噬肤灭鼻，无咎。","六三：噬腊肉，遇毒；小吝，无咎。","九四：噬干胏，得金矢，利艰贞，吉。","六五：噬干肉，得黄金，贞厉，无咎。","上九：何校灭耳，凶。"],"line_xiang":["屦校灭趾，不行也。","噬肤灭鼻，乘刚也。","遇毒，位不当也。","利艰贞吉，未光也。","贞厉无咎，得当也。","何校灭耳，聪不明也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%99%AC%E5%97%91","revision":"2404997"},"火风鼎":{"number":50,"guaci":"鼎：元吉，亨。","tuan":"鼎，象也。以木巽火，亨饪也。圣人亨以享上帝，而大亨以养圣贤。巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨。","xiang":"木上有火，鼎；君子以正位凝命。","lines":["初六：鼎颠趾，利出否，得妾以其子，无咎。","九二：鼎有实，我仇有疾，不我能即，吉。","九三：鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。","九四：鼎折足，覆公𫗧，其形渥，凶。","六五：鼎黄耳金铉，利贞。","上九：鼎玉铉，大吉，无不利。"],"line_xiang":["鼎颠趾，未悖也。利出否，以从贵也。","鼎有实，慎所之也。我仇有疾，终无尤也。","鼎耳革，失其义也。","覆公𫗧，信如何也。","鼎黄耳，中以为实也。","玉铉在上，刚柔节也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E9%BC%8E","revision":"2106200"},"火水未济":{"number":64,"guaci":"未济：亨。小狐汔济，濡其尾，无攸利。","tuan":"未济，亨；柔得中也。小狐汔济，未出中也。濡其尾，无攸利；不续终也。虽不当位，刚柔应也。","xiang":"火在水上，未济；君子以慎辨物居方。","lines":["初六：濡其尾，吝。","九二：曳其轮，贞吉。","六三：未济，征凶，利涉大川。","九四：贞吉，悔亡，震用伐鬼方，三年有赏于大国。","六五：贞吉，无悔，君子之光，有孚，吉。","上九：有孚于饮酒，无咎，濡其首，有孚失是。"],"line_xiang":["濡其尾，亦不知极也。","九二贞吉，中以行正也。","未济征凶，位不当也。","贞吉悔亡，志行也。","君子之光，其晖吉也。","饮酒濡首，亦不知节也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E6%9C%AA%E6%BF%9F","revision":"2405020"},"火山旅":{"number":56,"guaci":"旅：小亨，旅贞吉。","tuan":"旅，小亨，柔得中乎外，而顺乎刚，止而丽乎明，是以小亨，旅贞吉也。旅之时义大矣哉！","xiang":"山上有火，旅；君子以明慎用刑，而不留狱。","lines":["初六：旅琐琐，斯其所取灾。","六二：旅即次，怀其资，得童仆贞。","九三：旅焚其次，丧其童仆，贞厉。","九四：旅于处，得其资斧，我心不快。","六五：射雉一矢亡，终以誉命。","上九：鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。"],"line_xiang":["旅琐琐，志穷灾也。","得童仆贞，终无尤也。","旅焚其次，亦以伤矣。以旅与下，其义丧也。","旅于处，未得位也。得其资斧，心未快也。","终以誉命，上逮也。","以旅在上，其义焚也。丧牛于易，终莫之闻也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E6%97%85","revision":"2560781"},"火地晋":{"number":35,"guaci":"晋：康侯用锡马蕃庶，昼日三接。","tuan":"晋，进也。明出地上，顺而丽乎大明，柔进而上行。是以康侯用锡马蕃庶，昼日三接也。","xiang":"明出地上，晋；君子以自昭明德。","lines":["初六：晋如，摧如，贞吉。罔孚，裕无咎。","六二：晋如，愁如，贞吉。受兹介福，于其王母。","六三：众允，悔亡。","九四：晋如鼫鼠，贞厉。","六五：悔亡，失得勿恤，往吉无不利。","上九：晋其角，维用伐邑，厉吉无咎，贞吝。"],"line_xiang":["晋如，摧如；独行正也。裕无咎；未受命也。","受兹介福，以中正也。","众允之志，上行也。","鼫鼠贞厉，位不当也。","失得勿恤，往有庆也。","维用伐邑，道未光也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E6%99%89","revision":"2584802"},"雷天大壮":{"number":34,"guaci":"大壮：利贞。","tuan":"大壮，大者壮也。刚以动，故壮。大壮利贞；大者正也。正大而天地之情可见矣！","xiang":"雷在天上，大壮；君子以非礼弗履。","lines":["初九：壮于趾，征凶，有孚。","九二：贞吉。","九三：小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。","九四：贞吉悔亡，藩决不羸，壮于大舆之輹。","六五：丧羊于易，无悔。","上六：羝羊触藩，不能退，不能遂，无攸利，艰则吉。"],"line_xiang":["壮于趾，其孚穷也。","九二贞吉，以中也。","小人用壮，君子罔也。","藩决不羸，尚往也。","丧羊于易，位不当也。","不能退，不能遂，不详也。艰则吉，咎不长也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%A4%A7%E5%A3%AF","revision":"2531745"},"雷泽归妹":{"number":54,"guaci":"归妹：征凶，无攸利。","tuan":"归妹，天地之大义也。天地不交，而万物不兴，归妹人之终始也。说以动，所归妹也。征凶，位不当也。无攸利，柔乘刚也。","xiang":"泽上有雷，归妹；君子以永终知敝。","lines":["初九：归妹以娣，跛能履，征吉。","九二：眇能视，利幽人之贞。","六三：归妹以须，反归以娣。","九四：归妹愆期，迟归有时。","六五：帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉。","上六：女承筐无实，士刲羊无血，无攸利。"],"line_xiang":["归妹以娣，以恒也。跛能履吉，相承也。","利幽人之贞，未变常也。","归妹以须，未当也。","愆期之志，有待而行也。","帝乙归妹，不如其娣之袂良也。其位在中，以贵行也。","上六无实，承虚筐也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E6%AD%B8%E5%A6%B9","revision":"2511521"},"雷火丰":{"number":55,"guaci":"丰：亨。王假之，勿忧，宜日中。","tuan":"丰，大也。明以动，故丰。王假之，尚大也。勿忧宜日中，宜照天下也。日中则昃，月盈则食，天地盈虚，与时消息，而况于人乎？况于鬼神乎？","xiang":"雷电皆至，丰；君子以折狱致刑。","lines":["初九：遇其配主，虽旬无咎，往有尚。","六二：丰其蔀，日中见斗，往得疑疾，有孚发若，吉。","九三：丰其沛，日中见沫，折其右肱，无咎。","九四：丰其蔀，日中见斗，遇其夷主，吉。","六五：来章，有庆誉，吉。","上六：丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。"],"line_xiang":["虽旬无咎，过旬灾也。","有孚发若，信以发志也。","丰其沛，不可大事也。折其右肱，终不可用也。","丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主，吉；行也。","六五之吉，有庆也。","丰其屋，天际翔也。窥其户，阒其无人，自藏也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E8%B1%90","revision":"2560608"},"震为雷":{"number":51,"guaci":"震：亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。","tuan":"震，亨。震来虩虩，恐致福也。笑言哑哑，后有则也。震惊百里，惊远而惧迩也。出可以守宗庙社稷，以为祭主也。","xiang":"洊雷，震；君子以恐惧修省。","lines":["初九：震来虩虩，后笑言哑哑，吉。","六二：震来厉，亿丧贝，跻于九陵，勿逐，七日得。","六三：震苏苏，震行无眚。","九四：震遂泥。","六五：震往来厉，亿无丧，有事。","上六：震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。"],"line_xiang":["震来虩虩，恐致福也。笑言哑哑，后有则也。","震来厉，乘刚也。","震苏苏，位不当也。","震遂泥，未光也。","震往来厉，危行也。其事在中，大无丧也。","震索索，中未得也。虽凶无咎，畏邻戒也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E9%9C%87","revision":"2560429"},"雷风恒":{"number":32,"guaci":"恒：亨，无咎。利贞，利有攸往。","tuan":"恒，久也。刚上而柔下，雷风相与，巽而动，刚柔皆应，恒。恒亨无咎，利贞；久于其道也，天地之道，恒久而不已也。利有攸往，终则有始也。日月得天，而能久照，四时变化，而能久成，圣人久于其道，而天下化成；观其所恒，而天地万物之情可见矣！","xiang":"雷风，恒；君子以立不易方。","lines":["初六：浚恒，贞凶，无攸利。","九二：悔亡。","九三：不恒其德，或承之羞，贞吝。","九四：田无禽。","六五：恒其德，贞，妇人吉，夫子凶。","上六：振恒，凶。"],"line_xiang":["浚恒之凶，始求深也。","九二悔亡，能久中也。","不恒其德，无所容也。","久非其位，安得禽也。","妇人贞吉，从一而终也。夫子制义，从妇凶也。","振恒在上，大无功也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E6%81%92","revision":"2530043"},"雷水解":{"number":40,"guaci":"解：利西南，无所往，其来复吉。有攸往，夙吉。","tuan":"解，险以动，动而免乎险，解。解利西南，往得众也。其来复吉，乃得中也。有攸往夙吉，往有功也。天地解，而雷雨作，雷雨作，而百果草木皆甲坼，解之时义大矣哉！","xiang":"雷雨作，解；君子以赦过宥罪。","lines":["初六：无咎。","九二：田获三狐，得黄矢，贞吉。","六三：负且乘，致寇至，贞吝。","九四：解而拇，朋至斯孚。","六五：君子维有解，吉；有孚于小人。","上六：公用射隼，于高墉之上，获之，无不利。"],"line_xiang":["刚柔之际，义无咎也。","九二贞吉，得中道也。","负且乘，亦可丑也，自我致戎，又谁咎也。","解而拇，未当位也。","君子有解，小人退也。","公用射隼，以解悖也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E8%A7%A3","revision":"2405031"},"雷山小过":{"number":62,"guaci":"小过：亨。利贞。可小事，不可大事。飞鸟遗之音，不宜上宜下，大吉。","tuan":"小过，小者过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。刚失位而不中，是以不可大事也。有飞鸟之象焉，有飞鸟遗之音，不宜上宜下，大吉；上逆而下顺也。","xiang":"山上有雷，小过；君子以行过乎恭，丧过乎哀，用过乎俭。","lines":["初六：飞鸟以凶。","六二：过其祖，遇其妣；不及其君，遇其臣；无咎。","九三：弗过防之，从或戕之，凶。","九四：无咎，弗过遇之。往厉必戒，勿用永贞。","六五：密云不雨，自我西郊，公弋取彼在穴。","上六：弗遇过之，飞鸟离之，凶，是谓灾眚。"],"line_xiang":["飞鸟以凶，不可如何也。","不及其君，臣不可过也。","从或戕之，凶如何也。","弗过遇之，位不当也。往厉必戒，终不可长也。","密云不雨，已上也。","弗遇过之，已亢也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%B0%8F%E9%81%8E","revision":"2405007"},"雷地豫":{"number":16,"guaci":"豫：利建侯行师。","tuan":"豫，刚应而志行，顺以动，豫。豫，顺以动，故天地如之，而况建侯行师乎？天地以顺动，故日月不过，而四时不忒；圣人以顺动，则刑罚清而民服。豫之时义大矣哉！","xiang":"雷出地奋，豫。先王以作乐崇德，殷荐之上帝，以配祖考。","lines":["初六：鸣豫，凶。","六二：介于石，不终日，贞吉。","六三：盱豫，悔。迟有悔。","九四：由豫，大有得。勿疑。朋盍簪。","六五：贞疾，恒不死。","上六：冥豫，成有渝，无咎。"],"line_xiang":["初六鸣豫，志穷凶也。","不终日，贞吉；以中正也。","盱豫有悔，位不当也。","由豫，大有得；志大行也。","六五贞疾，乘刚也。恒不死，中未亡也。","冥豫在上，何可长也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E8%B1%AB","revision":"2106143"},"风天小畜":{"number":9,"guaci":"小畜：亨。密云不雨，自我西郊。","tuan":"小畜，柔得位而上下应之，曰小畜。健而巽，刚中而志行，乃亨。密云不雨，尚往也。自我西郊，施未行也。","xiang":"风行天上，小畜，君子以懿文德。","lines":["初九：复自道，何其咎，吉。","九二：牵复，吉。","九三：舆说辐，夫妻反目。","六四：有孚，血去惕出，无咎。","九五：有孚挛如，富以其邻。","上九：既雨既处，尚德载，妇贞厉，月几望，君子征凶。"],"line_xiang":["复自道，其义吉也。","牵复在中，亦不自失也。","夫妻反目，不能正室也。","有孚。惕出。上合志也。","有孚挛如，不独富也。","既雨既处，德积载也。君子征凶，有所疑也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%B0%8F%E7%95%9C","revision":"2405006"},"风泽中孚":{"number":61,"guaci":"中孚：豚鱼吉，利涉大川，利贞。","tuan":"中孚，柔在内而刚得中。说而巽，孚，乃化邦也。豚鱼吉，信及豚鱼也。利涉大川，乘木舟虚也。中孚以利贞，乃应乎天也。","xiang":"泽上有风，中孚；君子以议狱缓死。","lines":["初九：虞吉，有他不燕。","九二：鸣鹤在阴，其子和之，我有好爵，吾与尔靡之。","六三：得敌，或鼓或罢，或泣或歌。","六四：月几望，马匹亡，无咎。","九五：有孚挛如，无咎。","上九：翰音登于天，贞凶。"],"line_xiang":["初九虞吉，志未变也。","其子和之，中心愿也。","可鼓或罢，位不当也。","马匹亡，绝类上也。","有孚挛如，位正当也。","翰音登于天，何可长也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E4%B8%AD%E5%AD%9A","revision":"2404990"},"风火家人":{"number":37,"guaci":"家人：利女贞。","tuan":"家人，女正位乎内，男正位乎外，男女正，天地之大义也。家人有严君焉，父母之谓也。父父，子子，兄兄，弟弟，夫夫，妇妇，而家道正；正家而天下定矣。","xiang":"风自火出，家人；君子以言有物，而行有恒。","lines":["初九：闲有家，悔亡。","六二：无攸遂，在中馈，贞吉。","九三：家人嗃嗃，悔厉吉；妇子嘻嘻，终吝。","六四：富家，大吉。","九五：王假有家，勿恤。吉。","上九：有孚威如，终吉。"],"line_xiang":["闲有家，志未变也。","六二之吉，顺以巽也。","家人嗃嗃，未失也；妇子嘻嘻，失家节也。","富家大吉，顺在位也。","王假有家，交相爱也。","威如之吉，反身之谓也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%AE%B6%E4%BA%BA","revision":"2405005"},"风雷益":{"number":42,"guaci":"益：利有攸往。利涉大川。","tuan":"益，损上益下，民说无疆，自上下下，其道大光。利有攸往，中正有庆。利涉大川，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行。","xiang":"风雷，益；君子以见善则迁，有过则改。","lines":["初九：利用为大作，元吉，无咎。","六二：或益之，十朋之龟弗克违，永贞吉。王用享于帝，吉。","六三：益之用凶事，无咎。有孚中行，告公用圭。","六四：中行，告公从。利用为依迁国。","九五：有孚惠心，勿问元吉。有孚惠我德。","上九：莫益之，或击之，立心勿恒，凶。"],"line_xiang":["元吉无咎，下不厚事也。","或益之，自外来也。","益用凶事，固有之也。","告公从，以益志也。","有孚惠心，勿问之矣。惠我德，大得志也。","莫益之，偏辞也。或击之，自外来也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E7%9B%8A","revision":"2405025"},"巽为风":{"number":57,"guaci":"巽：小亨。利有攸往。利见大人。","tuan":"重巽以申命，刚巽乎中正而志行。柔皆顺乎刚，是以小亨，利有攸往，利见大人。","xiang":"随风，巽；君子以申命行事。","lines":["初六：进退，利武人之贞。","九二：巽在床下，用史巫纷若，吉无咎。","九三：频巽，吝。","六四：悔亡，田获三品。","九五：贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。","上九：巽在床下，丧其资斧，贞凶。"],"line_xiang":["进退，志疑也。利武人之贞，志治也。","纷若之吉，得中也。","频巽之吝，志穷也。","田获三品，有功也。","九五之吉，位正中也。","巽在床下，上穷也。丧其资斧，正乎凶也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%B7%BD","revision":"2441563"},"风水涣":{"number":59,"guaci":"涣：亨。王假有庙，利涉大川，利贞。","tuan":"涣，亨。刚来而不穷，柔得位乎外而上同。王假有庙，王乃在中也。利涉大川，乘木有功也。","xiang":"风行水上，涣；先王以享于帝立庙。","lines":["初六：用拯马壮，吉。","九二：涣奔其机，悔亡。","六三：涣其躬，无悔。","六四：涣其群，元吉。涣有丘，匪夷所思。","九五：涣汗其大号，涣王居，无咎。","上九：涣其血，去逖出，无咎。"],"line_xiang":["初六之吉，顺也。","涣奔其机，得愿也。","涣其躬，志在外也。","涣其群，元吉；光大也。","王居无咎，正位也。","涣其血，远害也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E6%B8%99","revision":"2405023"},"风山渐":{"number":53,"guaci":"渐：女归吉，利贞。","tuan":"渐之进也，女归吉也。进得位，往有功也。进以正，可以正邦也。其位刚，得中也。止而巽，动不穷也。","xiang":"山上有木，渐；君子以居贤德，善俗。","lines":["初六：鸿渐于干，小子厉，有言，无咎。","六二：鸿渐于磐，饮食衎衎，吉。","九三：鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。","六四：鸿渐于木，或得其桷，无咎。","九五：鸿渐于陵，妇三岁不孕，终莫之胜，吉。","上九：鸿渐于陆，其羽可用为仪，吉。"],"line_xiang":["小子之厉，义无咎也。","饮食衎衎，不素饱也。","夫征不复，离群丑也。妇孕不育，失其道也。利用御寇，顺相保也。","或得其桷，顺以巽也。","终莫之胜，吉；得所愿也。","其羽可用为仪，吉；不可乱也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E6%BC%B8","revision":"2560535"},"风地观":{"number":20,"guaci":"观：盥而不荐，有孚颙若。","tuan":"大观在上，顺而巽，中正以观天下。观，盥而不荐，有孚颙若，下观而化也。观天之神道，而四时不忒，圣人以神道设教，而天下服矣。","xiang":"风行地上，观；先王以省方，观民设教。","lines":["初六：童观，小人无咎，君子吝。","六二：窥观，利女贞。","六三：观我生，进退。","六四：观国之光，利用宾于王。","九五：观我生，君子无咎。","上九：观其生，君子无咎。"],"line_xiang":["初六童观，小人道也。","窥观女贞，亦可丑也。","观我生，进退；未失道也。","观国之光，尚宾也。","观我生，观民也。","观其生，志未平也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E8%A7%80","revision":"2106147"},"水天需":{"number":5,"guaci":"需：有孚，光亨。贞吉，利涉大川。","tuan":"需，须也，险在前也；刚健而不陷，其义不困穷矣。需，有孚，光亨，贞吉，位乎天位，以正中也。利涉大川，往有功也。","xiang":"云上于天，需；君子以饮食宴乐。","lines":["初九：需于郊，利用恒，无咎。","九二：需于沙，小有言，终吉。","九三：需于泥，致寇至。","六四：需于血，出自穴。","九五：需于酒食，贞吉。","上六：入于穴，有不速之客三人来，敬之终吉。"],"line_xiang":["需于郊，不犯难行也。利用恒，无咎，未失常也。","需于沙，衍在中也。虽小有言，以终吉也。","需于泥，灾在外也。自我致寇，敬慎不败也。","需于血，顺以听也。","酒食，贞吉，以中正也。","不速之客来，敬之终吉。虽不当位，未大失也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E9%9C%80","revision":"2405039"},"水泽节":{"number":60,"guaci":"节：亨。苦节不可贞。","tuan":"节，亨，刚柔分，而刚得中。苦节不可贞，其道穷也。说以行险，当位以节，中正以通。天地节而四时成，节以制度，不伤财，不害民。","xiang":"泽上有水，节；君子以制数度，议德行。","lines":["初九：不出户庭，无咎。","九二：不出门庭，凶。","六三：不节若，则嗟若，无咎。","六四：安节，亨。","九五：甘节，吉；往有尚。","上六：苦节，贞凶，悔亡。"],"line_xiang":["不出户庭，知通塞也。","不出门庭，失时极也。","不节之嗟，又谁咎也。","安节之亨，承上道也。","甘节之吉，居位中也。","苦节贞凶，其道穷也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E7%AF%80","revision":"2405027"},"水火既济":{"number":63,"guaci":"既济：亨小。利贞。初吉终乱。","tuan":"既济，亨，小者亨也。利贞，刚柔正而位当也。初吉，柔得中也。终止则乱，其道穷也。","xiang":"水在火上，既济；君子以思患而豫防之。","lines":["初九：曳其轮，濡其尾，无咎。","六二：妇丧其茀，勿逐，七日得。","九三：高宗伐鬼方，三年克之，小人勿用。","六四：𦈡有衣袽，终日戒。","九五：东邻杀牛，不如西邻之禴祭，实受其福。","上六：濡其首，厉。"],"line_xiang":["曳其轮，义无咎也。","七日得，以中道也。","三年克之，惫也。","终日戒，有所疑也。","东邻杀牛，不如西邻之时也；实受其福，吉大来也。","濡其首厉，何可久也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E6%97%A2%E6%BF%9F","revision":"2572417"},"水雷屯":{"number":3,"guaci":"屯：元亨，利贞。勿用有攸往，利建侯。","tuan":"屯，刚柔始交而难生，动乎险中，大亨贞。雷雨之动满盈，天造草昧，宜建侯而不宁。","xiang":"云雷，屯；君子以经纶。","lines":["初九：磐桓，利居贞，利建侯。","六二：屯如邅如，乘马班如，匪寇婚媾，女子贞不字，十年乃字。","六三：即鹿无虞，惟入于林中，君子几不如舍，往吝。","六四：乘马班如，求婚媾，往，吉无不利。","九五：屯其膏；小贞吉，大贞凶。","上六：乘马班如，泣血涟如。"],"line_xiang":["虽磐桓，志行正也。以贵下贱，大得民也。","六二之难，乘刚也。十年乃字，反常也。","即鹿无虞，以从禽也。君子舍之，往吝穷也。","求而往，明也。","屯其膏，施未光也。","泣血涟如，何可长也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%B1%AF","revision":"2527353"},"水风井":{"number":48,"guaci":"井：改邑不改井，无丧无得，往来井井。汔至亦未繘井。羸其瓶，凶。","tuan":"巽乎水而上水，井；井养而不穷也。改邑不改井，乃以刚中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也。","xiang":"木上有水，井；君子以劳民劝相。","lines":["初六：井泥不食，旧井无禽。","九二：井谷射鲋，瓮敝漏。","九三：井渫不食，为我心恻，可用汲，王明，并受其福。","六四：井甃，无咎。","九五：井冽，寒泉食。","上六：井收勿幕，有孚元吉。"],"line_xiang":["井泥不食，下也。旧井无禽，时舍也。","井谷射鲋，无与也。","井渫不食，行恻也。求王明，受福也。","井甃无咎，修井也。","寒泉之食，中正也。","元吉在上，大成也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E4%BA%95","revision":"2404992"},"坎为水":{"number":29,"guaci":"习坎：有孚，维心亨。行有尚。","tuan":"习坎，重险也。水流而不盈，行险而不失其信。维心亨，乃以刚中也。行有尚，往有功也。天险不可升也，地险山川丘陵也，王公设险以守其国，坎之时用大矣哉！","xiang":"水洊至，习坎；君子以常德行，习教事。","lines":["初六：习坎，入于坎窞，凶。","九二：坎有险，求小得。","六三：来之坎坎，险且枕，入于坎窞，勿用。","六四：樽酒簋贰，用缶，纳约自牖，终无咎。","九五：坎不盈，祗既平，无咎。","上六：系用徽𬙊，寘于丛棘，三岁不得，凶。"],"line_xiang":["习坎入坎，失道凶也。","求小得，未出中也。","来之坎坎，终无功也。","樽酒簋贰，刚柔济也。","坎不盈，中未大也。","上六失道，凶三岁也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%9D%8E","revision":"2502716"},"水山蹇":{"number":39,"guaci":"蹇：利西南，不利东北；利见大人，贞吉。","tuan":"蹇，难也，险在前也。见险而能止，知矣哉！蹇利西南，往得中也；不利东北，其道穷也。利见大人，往有功也。当位贞吉，以正邦也。蹇之时用大矣哉！","xiang":"山上有水，蹇；君子以反身修德。","lines":["初六：往蹇，来誉。","六二：王臣蹇蹇，匪躬之故。","九三：往蹇来反。","六四：往蹇来连。","九五：大蹇朋来。","上六：往蹇来硕，吉；利见大人。"],"line_xiang":["往蹇来誉，宜待也。","王臣蹇蹇，终无尤也。","往蹇来反，内喜之也。","往蹇来连，当位实也。","大蹇朋来，以中节也。","往蹇来硕，志在内也。利见大人，以从贵也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E8%B9%87","revision":"2405036"},"水地比":{"number":8,"guaci":"比：吉。原筮元永贞，无咎。不宁方来，后夫凶。","tuan":"比，吉也。比，辅也，下顺从也。原筮，元永贞，无咎，以刚中也。不宁方来，上下应也。后夫凶，其道穷也。","xiang":"地上有水，比；先王以建万国，亲诸侯。","lines":["初六：有孚，比之，无咎。有孚盈缶，终来有它，吉。","六二：比之自内，贞吉。","六三：比之匪人。","六四：外比之，贞吉。","九五：显比。王用三驱，失前禽，邑人不诫，吉。","上六：比之无首，凶。"],"line_xiang":["比之初六，有它吉也。","比之自内，不自失也。","比之匪人，不亦伤乎！","外比于贤，以从上也。","显比之吉，位正中也。舍逆取顺，失前禽也。邑人不诫，上使中也。","比之无首，无所终也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E6%AF%94","revision":"2405022"},"山天大畜":{"number":26,"guaci":"大畜：利贞，不家食吉，利涉大川。","tuan":"大畜，刚健笃实辉光，日新其德，刚上而尚贤。能止健，大正也。不家食吉，养贤也。利涉大川，应乎天也。","xiang":"天在山中，大畜；君子以多识前言往行，以畜其德。","lines":["初九：有厉利已。","九二：舆说輹。","九三：良马逐，利艰贞。曰闲舆卫，利有攸往。","六四：童牛之牿，元吉。","六五：豮豕之牙，吉。","上九：何天之衢，亨。"],"line_xiang":["有厉利已，不犯灾也。","舆说輹，中无尤也。","利有攸往，上合志也。","六四元吉，有喜也。","六五之吉，有庆也。","何天之衢，道大行也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%A4%A7%E7%95%9C","revision":"2405001"},"山泽损":{"number":41,"guaci":"损：有孚，元吉。无咎，可贞，利有攸往。曷之用？二簋可用享。","tuan":"损，损下益上，其道上行。损而有孚，元吉，无咎，可贞，利有攸往。曷之用？二簋可用享；二簋应有时。损刚益柔有时，损益盈虚，与时偕行。","xiang":"山下有泽，损；君子以惩忿窒欲。","lines":["初九：已事遄往，无咎，酌损之。","九二：利贞，征凶，弗损益之。","六三：三人行，则损一人；一人行，则得其友。","六四：损其疾，使遄有喜，无咎。","六五：或益之，十朋之龟弗克违，元吉。","上九：弗损益之，无咎，贞吉，利有攸往，得臣无家。"],"line_xiang":["已事遄往，尚合志也。","九二利贞，中以为志也。","一人行，三则疑也。","损其疾，亦可喜也。","六五元吉，自上佑也。","弗损益之，大得志也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E6%90%8D","revision":"2405014"},"山火贲":{"number":22,"guaci":"贲：亨。小利有攸往。","tuan":"贲，亨；柔来而文刚，故亨。分刚上而文柔，故小利有攸往。刚柔交错，天文也；文明以止，人文也。观乎天文，以察时变；观乎人文，以化成天下。","xiang":"山下有火，贲；君子以明庶政，无敢折狱。","lines":["初九：贲其趾，舍车而徒。","六二：贲其须。","九三：贲如濡如，永贞吉。","六四：贲如皤如，白马翰如，匪寇婚媾。","六五：贲于丘园，束帛戋戋，吝，终吉。","上九：白贲，无咎。"],"line_xiang":["舍车而徒，义弗乘也。","贲其须，与上兴也。","永贞之吉，终莫之陵也。","六四，当位疑也。匪寇婚媾，终无尤也。","六五之吉，有喜也。","白贲无咎，上得志也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E8%B3%81","revision":"2405035"},"山雷颐":{"number":27,"guaci":"颐：贞吉。观颐，自求口实。","tuan":"颐贞吉，养正则吉也。观颐，观其所养也；自求口实，观其自养也。天地养万物，圣人养贤，以及万民；颐之时义大矣哉！","xiang":"山下有雷，颐；君子以慎言语，节饮食。","lines":["初九：舍尔灵龟，观我朵颐，凶。","六二：颠颐，拂经，于丘颐，征凶。","六三：拂颐，贞凶，十年勿用，无攸利。","六四：颠颐吉，虎视眈眈，其欲逐逐，无咎。","六五：拂经，居贞吉，不可涉大川。","上九：由颐，厉吉，利涉大川。"],"line_xiang":["观我朵颐，亦不足贵也。","六二征凶，行失类也。","十年勿用，道大悖也。","颠颐之吉，上施光也。","居贞之吉，顺以从上也。","由颐厉吉，大有庆也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E9%A0%A4","revision":"2405042"},"山风蛊":{"number":18,"guaci":"蛊：元亨。利涉大川。先甲三日，后甲三日。","tuan":"蛊，刚上而柔下，巽而止，蛊。蛊，元亨，而天下治也。利涉大川，往有事也。先甲三日，后甲三日，终则有始，天行也。","xiang":"山下有风，蛊；君子以振民育德。","lines":["初六：干父之蛊，有子考，无咎，厉终吉。","九二：干母之蛊，不可贞。","九三：干父之蛊，小有悔，无大咎。","六四：裕父之蛊，往见吝。","六五：干父之蛊，用誉。","上九：不事王侯，高尚其事。"],"line_xiang":["干父之蛊，意承考也。","干母之蛊，得中道也。","干父之蛊，终无咎也。","裕父之蛊，往未得也。","干父用誉，承以德也。","不事王侯，志可则也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E8%A0%B1","revision":"2106145"},"山水蒙":{"number":4,"guaci":"蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。","tuan":"蒙，山下有险，险而止，蒙。蒙亨，以亨行，时中也。匪我求童蒙，童蒙求我，志应也。初筮告，以刚中也。再三渎，渎则不告，渎蒙也。蒙以养正，圣功也。","xiang":"山下出泉，蒙；君子以果行育德。","lines":["初六：发蒙，利用刑人，用说桎梏，以往吝。","九二：包蒙吉，纳妇吉，子克家。","六三：勿用取女，见金夫，不有躬，无攸利。","六四：困蒙，吝。","六五：童蒙，吉。","上九：击蒙，不利为寇，利御寇。"],"line_xiang":["利用刑人，以正法也。","子克家，刚柔接也。","勿用取女，行不顺也。","困蒙之吝，独远实也。","童蒙之吉，顺以巽也。","利御寇，上下顺也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E8%92%99","revision":"2601829"},"艮为山":{"number":52,"guaci":"艮：艮其背，不获其身，行其庭，不见其人，无咎。","tuan":"艮，止也。时止则止，时行则行，动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也。","xiang":"兼山，艮；君子以思不出其位。","lines":["初六：艮其趾，无咎，利永贞。","六二：艮其腓，不拯其随，其心不快。","九三：艮其限，列其夤，厉熏心。","六四：艮其身，无咎。","六五：艮其辅，言有序，悔亡。","上九：敦艮，吉。"],"line_xiang":["艮其趾，未失正也。","不拯其随，未退听也。","艮其限，危熏心也。","艮其身，止诸躬也。","艮其辅，以中正也。","敦艮之吉，以厚终也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E8%89%AE","revision":"2405028"},"山地剥":{"number":23,"guaci":"剥：不利。有攸往。","tuan":"剥，剥也，柔变刚也。不利有攸往，小人长也。顺而止之，观象也。君子尚消息盈虚，天行也。","xiang":"山附地上，剥；上以厚下，安宅。","lines":["初六：剥床以足，蔑贞凶。","六二：剥床以辨，蔑贞凶。","六三：剥之，无咎。","六四：剥床以肤，凶。","六五：贯鱼，以宫人宠，无不利。","上九：硕果不食，君子得舆，小人剥庐。"],"line_xiang":["剥床以足，以灭下也。","剥床以辨，未有与也。","剥之无咎，失上下也。","剥床以肤，切近灾也。","以宫人宠，终无尤也。","君子得舆，民所载也。小人剥庐，终不可用也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%89%9D","revision":"2404994"},"地天泰":{"number":11,"guaci":"泰：小往大来，吉亨。","tuan":"泰，小往大来，吉亨。则是天地交而万物通也，上下交而其志同也。内阳而外阴，内健而外顺，内君子而外小人，君子道长，小人道消也。","xiang":"天地交，泰；后以财成天地之道，辅相天地之宜，以左右民。","lines":["初九：拔茅茹以其汇，征吉。","九二：包荒。用冯河，不遐遗；朋亡。得尚于中行。","九三：无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。","六四：翩翩，不富以其邻；不戒以孚。","六五：帝乙归妹，以祉，元吉。","上六：城复于隍，勿用师，自邑告命，贞吝。"],"line_xiang":["拔茅征吉，志在外也。","包荒，得尚于中行，以光大也。","无往不复，天地际也。","翩翩不富，皆失实也。不戒以孚，中心愿也。","以祉，元吉。中以行愿也。","城复于隍，其命乱也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E6%B3%B0","revision":"2106138"},"地泽临":{"number":19,"guaci":"临：元亨。利贞。至于八月有凶。","tuan":"临，刚浸而长。说而顺，刚中而应，大亨以正，天之道也。至于八月有凶，消不久也。","xiang":"泽上有地，临；君子以教思无穷，容保民无疆。","lines":["初九：咸临，贞吉。","九二：咸临，吉无不利。","六三：甘临，无攸利。既忧之，无咎。","六四：至临，无咎。","六五：知临，大君之宜，吉。","上六：敦临，吉无咎。"],"line_xiang":["咸临贞吉，志行正也。","咸临，吉无不利；未顺命也。","甘临，位不当也。既忧之，咎不长也。","至临无咎，位当也。","大君之宜，行中之谓也。","敦临之吉，志在内也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E8%87%A8","revision":"2106146"},"地火明夷":{"number":36,"guaci":"明夷：利艰贞。","tuan":"明入地中，明夷。内文明而外柔顺，以蒙大难，文王以之。利艰贞，晦其明也，内难而能正其志，箕子以之。","xiang":"明入地中，明夷；君子以莅众，用晦而明。","lines":["初九：明夷于飞，垂其翼。君子于行，三日不食，有攸往，主人有言。","六二：明夷，夷于左股，用拯马壮，吉。","九三：明夷于南狩，得其大首，不可疾贞。","六四：入于左腹，获明夷之心，于出门庭。","六五：箕子之明夷，利贞。","上六：不明晦，初登于天，后入于地。"],"line_xiang":["君子于行，义不食也。","六二之吉，顺以则也。","南狩之志，乃大得也。","入于左腹，获心意也。","箕子之贞，明不可息也。","初登于天，照四国也。后入于地，失则也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E6%98%8E%E5%A4%B7","revision":"2531747"},"地雷复":{"number":24,"guaci":"复：亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。","tuan":"复亨；刚反，动而以顺行，是以出入无疾，朋来无咎。反复其道，七日来复，天行也。利有攸往，刚长也。复其见天地之心乎？","xiang":"雷在地中，复；先王以至日闭关，商旅不行，后不省方。","lines":["初九：不复远，无袛悔，元吉。","六二：休复，吉。","六三：频复，厉无咎。","六四：中行独复。","六五：敦复，无悔。","上六：迷复，凶，有灾眚。用行师，终有大败，以其国君，凶；至于十年，不克征。"],"line_xiang":["不远之复，以修身也。","休复之吉，以下仁也。","频复之厉，义无咎也。","中行独复，以从道也。","敦复无悔，中以自考也。","迷复之凶，反君道也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%BE%A9","revision":"2497162"},"地风升":{"number":46,"guaci":"升：元亨，用见大人，勿恤，南征吉。","tuan":"柔以时升，巽而顺，刚中而应，是以大亨。用见大人，勿恤；有庆也。南征吉，志行也。","xiang":"地中生木，升；君子以顺德，积小以高大。","lines":["初六：允升，大吉。","九二：孚乃利用禴，无咎。","九三：升虚邑。","六四：王用亨于岐山，吉无咎。","六五：贞吉，升阶。","上六：冥升，利于不息之贞。"],"line_xiang":["允升大吉，上合志也。","九二之孚，有喜也。","升虚邑，无所疑也。","王用亨于岐山，顺事也。","贞吉升阶，大得志也。","冥升在上，消不富也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%8D%87","revision":"2404995"},"地水师":{"number":7,"guaci":"师：贞丈人吉，无咎。","tuan":"师，众也。贞，正也。能以众正，可以王矣。刚中而应，行险而顺，以此毒天下，而民从之，吉又何咎矣。","xiang":"地中有水，师；君子以容民畜众。","lines":["初六：师出以律，否臧，凶。","九二：在师中吉，无咎；王三锡命。","六三：师或舆尸，凶。","六四：师左次，无咎。","六五：田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。","上六：大君有命，开国承家，小人勿用。"],"line_xiang":["师出以律；失律，凶也。","在师中吉，承天宠也。王三锡命，怀万邦也。","师或舆尸，大无功也。","左次无咎，未失常也。","长子帅师，以中行也。弟子舆尸，使不当也。","大君有命，以正功也。小人勿用，必乱邦也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%B8%AB","revision":"2405011"},"地山谦":{"number":15,"guaci":"谦：亨，君子有终。","tuan":"谦，亨，天道下济而光明，地道卑而上行。天道亏盈而益谦，地道变盈而流谦，鬼神害盈而福谦，人道恶盈而好谦。谦尊而光，卑而不可逾，君子之终也。","xiang":"地中有山，谦；君子以裒多益寡，称物平施。","lines":["初六：谦谦君子，用涉大川，吉。","六二：鸣谦，贞吉。","九三：劳谦君子，有终吉。","六四：无不利，㧑谦。","六五：不富，以其邻，利用侵伐，无不利。","上六：鸣谦，利用行师，征邑国。"],"line_xiang":["谦谦君子，卑以自牧也。","鸣谦贞吉，中心得也。","劳谦君子，万民服也。","无不利㧑谦；不违则也。","利用侵伐，征不服也。","鸣谦，志未得也。可用行师，征邑国也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E8%AC%99","revision":"2106142"},"坤为地":{"number":2,"guaci":"坤：元亨。利牝马之贞。君子有攸往，先迷后得主。利西南得朋，东北丧朋。安贞，吉。","tuan":"至哉坤元，万物资生，乃顺承天。坤厚载物，德合无疆；含弘光大，品物咸亨。牝马地类，行地无疆，柔顺利贞。君子攸行，先迷失道，后顺得常。西南得朋，乃与类行，东北丧朋，乃终有庆。安贞之吉，应地无疆。","xiang":"地势坤，君子以厚德载物。","lines":["初六：履霜，坚冰至。","六二：直方大，不习无不利。","六三：含章，可贞。或从王事，无成有终。","六四：括囊，无咎无誉。","六五：黄裳，元吉。","上六：龙战于野，其血玄黄。"],"line_xiang":["履霜坚冰，阴始凝也。驯致其道，至坚冰也。","六二之动，直以方也。不习无不利，地道光也。","含章可贞，以时发也。或从王事，知光大也。","括囊无咎，慎不害也。","黄裳元吉，文在中也。","龙战于野，其道穷也。"],"source":"https://zh.wikisource.org/zh-hans/%E5%91%A8%E6%98%93/%E5%9D%A4","revision":"2404999","extra":"用六：利永贞。"}};

window.XingguiLiuyaoLineExplanations={"乾为天":[{"line_index":0,"plain":"潜藏的龙暂时不宜施展力量。","symbolism":"初九位居最下，阳刚之才尚在潜伏阶段；小象强调时位未到。","guidance":"宜积累实力、观察环境，不宜急于公开推进。","editorial_status":"初稿待人工校对","original_line":"初九：潜龙勿用。","original_xiang":"潜龙勿用，阳在下也。"},{"line_index":1,"plain":"龙已出现在田野，适宜与有德有能的人相见。","symbolism":"九二得中，才能开始显露，并能惠及周围。","guidance":"适合寻求良师、伙伴或支持，但仍须踏实建立信誉。","editorial_status":"初稿待人工校对","original_line":"九二：见龙在田，利见大人。","original_xiang":"见龙在田，德施普也。"},{"line_index":2,"plain":"君子整日勤勉不懈，夜间仍保持警惕；虽有危险，可以避免过失。","symbolism":"九三处上下转换之际，进取与戒惧必须并行。","guidance":"事务进入关键阶段，宜加强风险管理与自我检视。","editorial_status":"初稿待人工校对","original_line":"九三：君子终日乾乾，夕惕若；厉，无咎。","original_xiang":"终日乾乾，反复道也。"},{"line_index":3,"plain":"或向上跃进，或暂留深渊；审时而动便可无咎。","symbolism":"九四临近高位，处在可进可退的试探阶段。","guidance":"可小规模尝试新方向，同时保留调整空间。","editorial_status":"初稿待人工校对","original_line":"九四：或跃在渊，无咎。","original_xiang":"或跃在渊，进无咎也。"},{"line_index":4,"plain":"龙飞翔在天空，适宜与有德有能的人相见。","symbolism":"九五居尊位而中正，象征才能与位置相称。","guidance":"适合承担领导责任、广纳贤才，并以公正维持成果。","editorial_status":"初稿待人工校对","original_line":"九五：飞龙在天，利见大人。","original_xiang":"飞龙在天，大人造也。"},{"line_index":5,"plain":"飞得过高的龙会有悔恨。","symbolism":"上九阳刚至极，小象提醒盛极不可久。","guidance":"成功后宜适度收敛、留有余地，防止过度扩张。","editorial_status":"初稿待人工校对","original_line":"上九：亢龙，有悔。","original_xiang":"亢龙有悔，盈不可久也。"}],"坤为地":[{"line_index":0,"plain":"脚下出现霜，意味着坚冰将逐渐形成。","symbolism":"初六象征变化初起；小象强调细微迹象会逐步累积。","guidance":"及早辨识风险苗头，不要等问题扩大才应对。","editorial_status":"初稿待人工校对","original_line":"初六：履霜，坚冰至。","original_xiang":"履霜坚冰，阴始凝也。驯致其道，至坚冰也。"},{"line_index":1,"plain":"正直、方正而宽厚，即使不刻意修饰也无不利。","symbolism":"六二居中得正，体现坤德的自然与稳定。","guidance":"以诚信、规范和稳定执行为基础，避免过度包装。","editorial_status":"初稿待人工校对","original_line":"六二：直方大，不习无不利。","original_xiang":"六二之动，直以方也。不习无不利，地道光也。"},{"line_index":2,"plain":"内含美德而不急于显露，可以守正；辅佐他人做事，不居功也能善终。","symbolism":"六三有才而能含蓄，适时发挥并成就整体。","guidance":"适合幕后协作、完成交付，不必执着个人名声。","editorial_status":"初稿待人工校对","original_line":"六三：含章，可贞。或从王事，无成有终。","original_xiang":"含章可贞，以时发也。或从王事，知光大也。"},{"line_index":3,"plain":"像束紧袋口一样谨慎收敛，可免于过失，也未必得到赞誉。","symbolism":"六四近于敏感位置，小象强调谨慎可免伤害。","guidance":"在信息不明或局势敏感时，宜谨言慎行。","editorial_status":"初稿待人工校对","original_line":"六四：括囊，无咎无誉。","original_xiang":"括囊无咎，慎不害也。"},{"line_index":4,"plain":"穿着黄色下裳，大为吉祥。","symbolism":"六五以中和谦逊为美，虽居高位仍能守分。","guidance":"身处重要岗位时，以谦和稳重赢得信任。","editorial_status":"初稿待人工校对","original_line":"六五：黄裳，元吉。","original_xiang":"黄裳元吉，文在中也。"},{"line_index":5,"plain":"两龙在郊野交战，血色玄黄。","symbolism":"上六阴势至极而相争，小象指出其道已穷。","guidance":"警惕长期对立升级；宜寻求调解，避免两败俱伤。","editorial_status":"初稿待人工校对","original_line":"上六：龙战于野，其血玄黄。","original_xiang":"龙战于野，其道穷也。"}],"水雷屯":[{"line_index":0,"plain":"起步艰难，宜暂缓躁进、守正安处，并建立能够协助推进事务的组织或支持力量。","symbolism":"初九阳爻居下，虽有行动之志，却处屯难之始；《小象》强调守正及礼贤下士。","guidance":"先稳住基础、明确职责，争取可信赖的伙伴支持，再逐步行动。","editorial_status":"初稿待人工校对","original_line":"初九：磐桓，利居贞，利建侯。","original_xiang":"虽磐桓，志行正也。以贵下贱，大得民也。"},{"line_index":1,"plain":"进退艰难，骑马徘徊不前；来者并非强盗，而是求婚之人。女子坚守不嫁，经过漫长等待才成婚。","symbolism":"六二与初九相邻而受牵制，虽有相应关系，仍须经历时间与条件的磨合。","guidance":"面对看似有利的邀约，先辨清动机与条件；不必为短期压力仓促承诺。","editorial_status":"初稿待人工校对","original_line":"六二：屯如邅如，乘马班如，匪寇婚媾，女子贞不字，十年乃字。","original_xiang":"六二之难，乘刚也。十年乃字，反常也。"},{"line_index":2,"plain":"没有向导便追逐鹿，只会误入森林；明智的人察觉不利就停止，执意前往将有遗憾。","symbolism":"六三失去正确引导而逐利，《小象》以盲目追逐说明进退失据。","guidance":"资讯不足或缺少专业指引时，宜停止冒进，先补足判断依据。","editorial_status":"初稿待人工校对","original_line":"六三：即鹿无虞，惟入于林中，君子几不如舍，往吝。","original_xiang":"即鹿无虞，以从禽也。君子舍之，往吝穷也。"},{"line_index":3,"plain":"骑马徘徊，若为正当结合而主动求合，前往则吉，无所不利。","symbolism":"六四处进退之间，与初九有应；《小象》强调识明时机后主动求合。","guidance":"适合主动沟通、寻求合作，但应确认目标与彼此责任一致。","editorial_status":"初稿待人工校对","original_line":"六四：乘马班如，求婚媾，往，吉无不利。","original_xiang":"求而往，明也。"},{"line_index":4,"plain":"恩泽或资源积聚而未能广施；小范围坚持正道尚吉，贸然推动大事则凶。","symbolism":"九五虽居尊位，施惠未能普及，《小象》指出其影响尚未充分彰显。","guidance":"先处理资源分配与执行瓶颈，宜小步推进，不宜过早扩大规模。","editorial_status":"初稿待人工校对","original_line":"九五：屯其膏；小贞吉，大贞凶。","original_xiang":"屯其膏，施未光也。"},{"line_index":5,"plain":"骑马盘桓不进，悲伤到泪血涟涟，困境已至极点。","symbolism":"上六居屯难终点，仍陷无路可进之势；《小象》指出这种状态难以长久。","guidance":"应及时寻求援助、重新评估方向，避免在无解的局面里持续消耗。","editorial_status":"初稿待人工校对","original_line":"上六：乘马班如，泣血涟如。","original_xiang":"泣血涟如，何可长也。"}],"山水蒙":[{"line_index":0,"plain":"启发蒙昧时需要建立纪律与规则，并解除不必要的束缚；若只凭强制一路推进，容易留下遗憾。","symbolism":"初六处蒙昧之初，《小象》着重“正法”，说明规范的目的在于教导与纠偏。","guidance":"明确基本规则、纠正偏差，同时保留学习和改进的空间。","editorial_status":"初稿待人工校对","original_line":"初六：发蒙，利用刑人，用说桎梏，以往吝。","original_xiang":"利用刑人，以正法也。"},{"line_index":1,"plain":"能包容尚未开悟的人是吉；接纳并善于经营关系是吉，子辈也能承担家事。","symbolism":"九二阳刚得中，能够承接并教导阴柔之蒙，《小象》强调刚柔相接。","guidance":"适合承担辅导与管理责任，用包容和清晰标准培养他人的能力。","editorial_status":"初稿待人工校对","original_line":"九二：包蒙吉，纳妇吉，子克家。","original_xiang":"子克家，刚柔接也。"},{"line_index":2,"plain":"不宜娶这样的女子：她见到有财势的人便失去自持，难有长远利益。","symbolism":"六三阴柔失正，《小象》强调行为失序；此处为古代婚姻语境下的比喻。","guidance":"选择合作或承诺对象时，重视独立判断与诚信，不宜只看眼前利益。","editorial_status":"初稿待人工校对","original_line":"六三：勿用取女，见金夫，不有躬，无攸利。","original_xiang":"勿用取女，行不顺也。"},{"line_index":3,"plain":"受困于蒙昧之中，令人遗憾。","symbolism":"六四远离能够启蒙的阳爻，《小象》以“独远实”说明缺少切实指导。","guidance":"主动寻找可靠信息、导师或反馈，避免封闭环境使认知停滞。","editorial_status":"初稿待人工校对","original_line":"六四：困蒙，吝。","original_xiang":"困蒙之吝，独远实也。"},{"line_index":4,"plain":"以孩童般虚心求教的态度面对未知，是吉利的。","symbolism":"六五居尊位却能柔顺受教，《小象》强调谦逊、顺从正当教导。","guidance":"即使身居主导位置，也应承认未知、倾听专业意见。","editorial_status":"初稿待人工校对","original_line":"六五：童蒙，吉。","original_xiang":"童蒙之吉，顺以巽也。"},{"line_index":5,"plain":"纠正蒙昧时，不宜主动侵害别人；以防御不当侵害为宜。","symbolism":"上九以刚制蒙，《小象》指出强硬应以防卫与维护秩序为限。","guidance":"设立必要边界、及时制止伤害，但避免以惩戒为名过度施压。","editorial_status":"初稿待人工校对","original_line":"上九：击蒙，不利为寇，利御寇。","original_xiang":"利御寇，上下顺也。"}],"水天需":[{"line_index":0,"plain":"在郊外等待，保持恒常的态度与行动准则，没有过失。","symbolism":"初九处需卦之始，距离险境尚远；小象强调不冒险及不失常道。","guidance":"条件尚未成熟时保持耐心，维持日常准备，不必急于进入风险区域。","editorial_status":"初稿待人工校对","original_line":"初九：需于郊，利用恒，无咎。","original_xiang":"需于郊，不犯难行也。利用恒，无咎，未失常也。"},{"line_index":1,"plain":"在沙地等待，虽有一些议论或口舌，最终仍吉。","symbolism":"九二渐近险境，但得中守度；小象指出小有言而终吉。","guidance":"面对批评或分歧先核实事实、稳定节奏，不因杂音而仓促决定。","editorial_status":"初稿待人工校对","original_line":"九二：需于沙，小有言，终吉。","original_xiang":"需于沙，衍在中也。虽小有言，以终吉也。"},{"line_index":2,"plain":"在泥地等待，可能招致盗寇前来。","symbolism":"九三靠近险境，处境易受侵扰；小象提醒灾在外，须敬慎防范。","guidance":"识别自己可能招来的风险，减少暴露并提前制定应对方案。","editorial_status":"初稿待人工校对","original_line":"九三：需于泥，致寇至。","original_xiang":"需于泥，灾在外也。自我致寇，敬慎不败也。"},{"line_index":3,"plain":"等待之处已见血险，最终从洞穴般的险境中脱出。","symbolism":"六四身处险境，以柔顺审势求出；小象以顺从适当形势为关键。","guidance":"出现实际损失或危险时，优先脱离风险，听取可信建议而非硬撑。","editorial_status":"初稿待人工校对","original_line":"六四：需于血，出自穴。","original_xiang":"需于血，顺以听也。"},{"line_index":4,"plain":"在饮食安适之中等待，坚守正道则吉。","symbolism":"九五居中得正，能够以稳定资源和秩序从容待时。","guidance":"保持资源储备与稳健决策，在有利条件出现前不必强求进展。","editorial_status":"初稿待人工校对","original_line":"九五：需于酒食，贞吉。","original_xiang":"酒食，贞吉，以中正也。"},{"line_index":5,"plain":"进入洞穴，有三位不请自来的客人到来，恭敬相待最终吉。","symbolism":"上六处需之终，来客虽出意料，恭敬应对可免重大失误。","guidance":"对突发合作、访客或变化先保持礼貌与审慎，再判断其真实意图。","editorial_status":"初稿待人工校对","original_line":"上六：入于穴，有不速之客三人来，敬之终吉。","original_xiang":"不速之客来，敬之终吉。虽不当位，未大失也。"}],"天水讼":[{"line_index":0,"plain":"不要让争执长期延续，虽有少量议论，最终可得吉。","symbolism":"初六位于争讼之初，小象指出争讼不可长久，澄清事实便能止争。","guidance":"尽早沟通并留下记录，优先以合理方式化解小纠纷。","editorial_status":"初稿待人工校对","original_line":"初六：不永所事，小有言，终吉。","original_xiang":"不永所事，讼不可长也。虽小有言，其辩明也。"},{"line_index":1,"plain":"诉讼未能取胜，退回并避让，使自己所属的小邑免于灾祸。","symbolism":"九二与强势者相争不利，小象强调以下讼上易招致祸患。","guidance":"评估争议成本与力量差距，必要时适度退让以保护团队和家人。","editorial_status":"初稿待人工校对","original_line":"九二：不克讼，归而逋，其邑人三百户无眚。","original_xiang":"不克讼，归逋窜也。自下讼上，患至掇也。"},{"line_index":2,"plain":"依靠原有德业维生，虽有危险，坚持正道最终吉；参与王事也不居功。","symbolism":"六三守旧德而不争功，小象强调顺从正当秩序可得吉。","guidance":"守住既有信誉与职责，合作时重成果而非争夺功劳。","editorial_status":"初稿待人工校对","original_line":"六三：食旧德，贞厉，终吉。或从王事，无成。","original_xiang":"食旧德，从上吉也。"},{"line_index":3,"plain":"争讼不胜，回到应遵循的原则，改变争执方向，安守正道则吉。","symbolism":"九四能在争讼受挫后转而安于正道，小象强调知变而不失本分。","guidance":"发现立场难以成立时及时调整，采用合规、可持续的解决方案。","editorial_status":"初稿待人工校对","original_line":"九四：不克讼，复即命渝，安贞吉。","original_xiang":"复即命渝，安贞，不失也。"},{"line_index":4,"plain":"争讼得公正裁决，大吉。","symbolism":"九五居中得正，小象以中正说明妥善处理争讼的条件。","guidance":"处理争议时重视公平、证据与程序，避免仅凭个人好恶裁断。","editorial_status":"初稿待人工校对","original_line":"九五：讼，元吉。","original_xiang":"讼，元吉，以中正也。"},{"line_index":5,"plain":"即使因争讼获得华贵腰带，也可能在一天内被多次夺回。","symbolism":"上九争讼至极，所得荣誉并不稳固；小象指出以争讼得来的服饰不足为敬。","guidance":"不要为短期胜负牺牲长期信誉，重视结果是否稳定且令人信服。","editorial_status":"初稿待人工校对","original_line":"上九：或锡之鞶带，终朝三褫之。","original_xiang":"以讼受服，亦不足敬也。"}],"地水师":[{"line_index":0,"plain":"出师必须遵守纪律；若军纪与行动不善，便有凶险。","symbolism":"初六居师之始，爻辞与小象均以「律」为行动根本，失律易致败。","guidance":"开始集体行动前明确规则、权限与责任，避免无序推进。","editorial_status":"初稿待人工校对","original_line":"初六：师出以律，否臧，凶。","original_xiang":"师出以律；失律，凶也。"},{"line_index":1,"plain":"在军中居中主持事务，吉祥且无过失；君王多次颁赐命令。","symbolism":"九二居中，小象以受宠任与怀柔众邦说明统领得当的重要。","guidance":"领导者宜守中、公正协调，并以清楚授权维持团队信任。","editorial_status":"初稿待人工校对","original_line":"九二：在师中吉，无咎；王三锡命。","original_xiang":"在师中吉，承天宠也。王三锡命，怀万邦也。"},{"line_index":2,"plain":"军队可能载尸而归，凶险。","symbolism":"六三处位不当，象征用兵失策、徒有伤亡而难获成果。","guidance":"遇重大风险时审查指挥能力与执行方案，勿以冒进换取表面成绩。","editorial_status":"初稿待人工校对","original_line":"六三：师或舆尸，凶。","original_xiang":"师或舆尸，大无功也。"},{"line_index":3,"plain":"军队退驻左方，暂缓前进，没有过失。","symbolism":"六四以退守、整顿代替强攻；小象指出这并未违背用兵常道。","guidance":"形势不利时主动调整部署，保留实力并不等于失败。","editorial_status":"初稿待人工校对","original_line":"六四：师左次，无咎。","original_xiang":"左次无咎，未失常也。"},{"line_index":4,"plain":"田野有禽兽，适宜据实采取行动，无过失；由能胜任的长者统军，若任用不当者则有败亡之险。","symbolism":"六五强调出师须有正当理由，也须任用合适的统帅；小象重在「使不当」。","guidance":"行动须有事实依据，关键任务交由胜任者负责，避免任人唯亲。","editorial_status":"初稿待人工校对","original_line":"六五：田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。","original_xiang":"长子帅师，以中行也。弟子舆尸，使不当也。"},{"line_index":5,"plain":"君主颁命论功，封建邦国、建立家业；不可任用品行不正之人。","symbolism":"上六在事成之后，小象强调公正论功与防止小人扰乱秩序。","guidance":"项目完成后公平分配责任与奖励，并审慎选择长期治理者。","editorial_status":"初稿待人工校对","original_line":"上六：大君有命，开国承家，小人勿用。","original_xiang":"大君有命，以正功也。小人勿用，必乱邦也。"}],"水地比":[{"line_index":0,"plain":"怀着诚信与人亲近，没有过失；诚意充盈如满缶，最终还会得到额外的吉庆。","symbolism":"初六以「孚」为亲比的基础，小象说明诚实结交能带来后续善缘。","guidance":"建立合作关系先以诚信履约，不宜只追求眼前利益。","editorial_status":"初稿待人工校对","original_line":"初六：有孚，比之，无咎。有孚盈缶，终来有它，吉。","original_xiang":"比之初六，有它吉也。"},{"line_index":1,"plain":"从内部、由衷地亲近团结，守正则吉。","symbolism":"六二重在发自内心的归附；小象强调如此不会失去自身原则。","guidance":"合作应建立在真实认同上，保持独立判断与正当立场。","editorial_status":"初稿待人工校对","original_line":"六二：比之自内，贞吉。","original_xiang":"比之自内，不自失也。"},{"line_index":2,"plain":"亲近了不适合的人。","symbolism":"六三以「匪人」警示错误的结盟对象；小象指出其中有伤害。","guidance":"评估合作方的品行、能力与利益冲突，避免盲目站队。","editorial_status":"初稿待人工校对","original_line":"六三：比之匪人。","original_xiang":"比之匪人，不亦伤乎！"},{"line_index":3,"plain":"向外亲近值得依附的人，坚守正道则吉。","symbolism":"六四外比贤者，小象以顺从有德者说明择善而从。","guidance":"对外合作宜选择可靠、有原则的伙伴，并保持透明。","editorial_status":"初稿待人工校对","original_line":"六四：外比之，贞吉。","original_xiang":"外比于贤，以从上也。"},{"line_index":4,"plain":"公开、公正地亲比；君王围猎三面驱赶，放走前方禽兽，百姓不受惊扰，吉。","symbolism":"九五居中得正，以留有余地的围猎之象说明不强迫归附。","guidance":"领导者应公开规则、尊重选择，以包容而非强制争取支持。","editorial_status":"初稿待人工校对","original_line":"九五：显比。王用三驱，失前禽，邑人不诫，吉。","original_xiang":"显比之吉，位正中也。舍逆取顺，失前禽也。邑人不诫，上使中也。"},{"line_index":5,"plain":"亲比却没有好的开端或领头者，凶。","symbolism":"上六「无首」象征结盟失去主导和方向，小象说其难有善终。","guidance":"合作前先明确共同目标、主责与决策机制，防止组织失序。","editorial_status":"初稿待人工校对","original_line":"上六：比之无首，凶。","original_xiang":"比之无首，无所终也。"}],"风天小畜":[{"line_index":0,"original_line":"初九：复自道，何其咎，吉。","original_xiang":"复自道，其义吉也。","plain":"沿着本来的正当道路返回，哪里会有过失？吉。","symbolism":"初九处蓄止之始，能及时回归正道；小象肯定其返归合义。","guidance":"事情受阻时先核对方向，必要时及时调整而非强行突破。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：牵复，吉。","original_xiang":"牵复在中，亦不自失也。","plain":"受到牵引而一同返回，吉。","symbolism":"九二居中，随同回归正途而不失自我，小象重在守中。","guidance":"借助可信伙伴修正方向，同时保持自己的原则。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：舆说辐，夫妻反目。","original_xiang":"夫妻反目，不能正室也。","plain":"车轮辐条脱落，夫妻反目。","symbolism":"九三进取受阻，借车辆失用与家庭失和比喻配合失调。","guidance":"先排除协作与沟通故障，避免带着矛盾继续推进。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：有孚，血去惕出，无咎。","original_xiang":"有孚。惕出。上合志也。","plain":"怀有诚信，流血之险消退，忧惧解除，没有过失。","symbolism":"六四以诚意协调上下，小象指出志向相合有助化解险惧。","guidance":"以坦诚沟通化解紧张，但仍需处理现实风险。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：有孚挛如，富以其邻。","original_xiang":"有孚挛如，不独富也。","plain":"诚信使彼此紧密相连，并将富足分享给邻近伙伴。","symbolism":"九五居尊位而不独占所得，小象强调共享与互信。","guidance":"在合作中建立互信，并公平分享成果。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：既雨既处，尚德载，妇贞厉，月几望，君子征凶。","original_xiang":"既雨既处，德积载也。君子征凶，有所疑也。","plain":"雨已降下，局势暂定，德行积累已有成果；仍有守正之险，月近圆满，君子若再出征则凶。","symbolism":"上九处小畜之终，积蓄将满而过度推进易生疑惧。","guidance":"取得阶段成果后适度收束，不宜因接近成功而冒进。","editorial_status":"初稿待人工校对"}],"天泽履":[{"line_index":0,"original_line":"初九：素履，往无咎。","original_xiang":"素履之往，独行愿也。","plain":"以朴素本分的态度行事，前往没有过失。","symbolism":"初九从下位起步，重在不矫饰、依本愿而行。","guidance":"从基本原则与实际能力出发，避免刻意逞强。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：履道坦坦，幽人贞吉。","original_xiang":"幽人贞吉，中不自乱也。","plain":"道路平坦宽广，安静自守的人守正可得吉。","symbolism":"九二居中而不乱，外界变化不易扰乱其内心。","guidance":"稳步前行，保持独立判断与平常心。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：眇能视，跛能履，履虎尾，咥人，凶。武人为于大君。","original_xiang":"眇能视，不足以有明也。跛能履，不足以与行也。咥人之凶，位不当也。武人为于大君，志刚也。","plain":"视力弱却勉强看，腿脚不便却勉强走；踩到虎尾被咬，凶；又有武人欲效力君王之象。","symbolism":"六三位不当，能力与行动不匹配而强行涉险，小象指出其志刚而位失。","guidance":"评估自身条件与风险，切忌凭意气承担超出能力的任务。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：履虎尾，愬愬终吉。","original_xiang":"愬愬终吉，志行也。","plain":"踩在虎尾旁，心怀戒惧，最终得吉。","symbolism":"九四虽处险境，但以谨慎自持而能践行志向。","guidance":"面对高风险事项保持警觉、遵守边界。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：夬履，贞厉。","original_xiang":"夬履贞厉，位正当也。","plain":"果断行事，即使守正也仍有危险。","symbolism":"九五居尊位，决断虽有位置优势，却不可忽略刚决之险。","guidance":"作重大决定时保留复核机制，防止过度自信。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：视履考祥，其旋元吉。","original_xiang":"元吉在上，大有庆也。","plain":"回顾所走的道路、考察吉凶征兆，周全回归则大吉。","symbolism":"上九至履之终，以反省全过程检验行为得失。","guidance":"完成阶段行动后复盘过程与结果，修正下一轮做法。","editorial_status":"初稿待人工校对"}],"地天泰":[{"line_index":0,"original_line":"初九：拔茅茹以其汇，征吉。","original_xiang":"拔茅征吉，志在外也。","plain":"拔起茅草连带根部同类一起拔起，出行吉。","symbolism":"初九阳气上进，同道相连，小象强调志向在外。","guidance":"良好时机中可与志同道合者共同推进。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：包荒。用冯河，不遐遗；朋亡。得尚于中行。","original_xiang":"包荒，得尚于中行，以光大也。","plain":"包容荒远之人，敢于渡河涉险，不遗弃远方，也不结党偏私，合乎中道。","symbolism":"九二居中，以宽广包容与果断行动体现中正。","guidance":"兼顾不同群体与长远利益，避免小圈子决策。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。","original_xiang":"无往不复，天地际也。","plain":"平地终有坡，离去终会返回；在艰难中守正无过，不必忧虑诚信，饮食有福。","symbolism":"九三处天地交界，提醒通泰也会循环转变。","guidance":"顺境时预作风险准备，坚持原则以应对波动。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：翩翩，不富以其邻；不戒以孚。","original_xiang":"翩翩不富，皆失实也。不戒以孚，中心愿也。","plain":"轻快往来，不倚仗财富与邻人相交，彼此无需戒备而互信。","symbolism":"六四由上而下相应，小象强调内心愿意亲近。","guidance":"建立超越短期利益的合作，重视真诚沟通。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：帝乙归妹，以祉，元吉。","original_xiang":"以祉，元吉。中以行愿也。","plain":"帝乙嫁妹，以此得福，大吉。","symbolism":"六五柔中而下应，借婚嫁比喻谦和成就和合。","guidance":"在有利地位仍宜谦逊协调，促成互利安排。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：城复于隍，勿用师，自邑告命，贞吝。","original_xiang":"城复于隍，其命乱也。","plain":"城墙倒回护城河，不宜兴师；应从本邑发布命令，守正仍有遗憾。","symbolism":"上六处泰极转否，旧有秩序可能松动。","guidance":"繁荣衰退时优先稳住基础，避免以强硬扩张应对。","editorial_status":"初稿待人工校对"}],"天地否":[{"line_index":0,"original_line":"初六，拔茅茹以其汇，贞吉。亨。","original_xiang":"拔茅贞吉，志在君也。","plain":"拔茅草时同类相连，守正则吉而亨通。","symbolism":"初六在闭塞之始，与同道相连，重在持守正志。","guidance":"环境不顺时凝聚可信同伴，坚持底线。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二，包承，小人吉，大人否。亨。","original_xiang":"大人否，亨。不乱群也。","plain":"包容承受，小人可得其吉；君子面对闭塞而守道，终能通达。","symbolism":"六二强调不同身份处境下的选择，小象重在不随波逐流。","guidance":"不要为眼前便利放弃原则，区分短期得失与长期信誉。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三，包羞。","original_xiang":"包羞，位不当也。","plain":"包藏羞辱或羞耻。","symbolism":"六三位不当，闭塞之中进退失据，易生羞愧。","guidance":"检视不合宜的行为，及时止损并承担责任。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四，有命，无咎，畴离祉。","original_xiang":"有命无咎，志行也。","plain":"承受正当使命而行动，没有过失，同伴也分享福祉。","symbolism":"九四否势将转，奉命而行、志向得伸。","guidance":"局面改善时按授权推进，让团队共同受益。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五，休否，大人吉。其亡其亡，系于苞桑。","original_xiang":"大人之吉，位正当也。","plain":"闭塞得到休止，大人吉；时时警惕“会不会失去”，如系于坚固的桑树根。","symbolism":"九五居中正，转危为安仍强调戒惧与根基。","guidance":"危机缓解后巩固制度与资源，不可因转好而松懈。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九，倾否，先否后喜。","original_xiang":"否终则倾，何可长也。","plain":"闭塞局面倾覆，先有阻塞，后有喜悦。","symbolism":"上九处否之终，困局并非永远不变。","guidance":"把握转机，但要以实际改善证据判断局势。","editorial_status":"初稿待人工校对"}],"天火同人":[{"line_index":0,"original_line":"初九：同人于门，无咎。","original_xiang":"出门同人，又谁咎也。","plain":"走出门与人同心合作，没有过失。","symbolism":"初九不拘于私门，向外建立开放联系。","guidance":"扩大协作范围，以共同目标为基础。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：同人于宗，吝。","original_xiang":"同人于宗，吝道也。","plain":"只在宗族内部求同，令人遗憾。","symbolism":"六二虽有相应，却因局限亲近圈子而失去广泛同心。","guidance":"避免排他性结盟，兼顾外部伙伴与公平。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：伏戎于莽，升其高陵，三岁不兴。","original_xiang":"伏戎于莽，敌刚也。三岁不兴，安行也。","plain":"将兵伏于草莽，登高戒备，多年不能发动。","symbolism":"九三刚强而与人相争，力量对峙导致长期停滞。","guidance":"面对竞争先评估代价，避免长期消耗性对抗。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：乘其墉，弗克，攻吉。","original_xiang":"乘其墉，义弗克也，其吉，则困而反则也。","plain":"登上城墙，却不继续攻打，转而得吉。","symbolism":"九四知难而止，小象强调受阻后回归合宜之道。","guidance":"及时停止不正当或高代价的行动，争取和解。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：同人，先号啕而后笑。大师克相遇。","original_xiang":"同人之先，以中直也。大师相遇，言相克也。","plain":"同心之人先痛哭后欢笑，大军克服阻碍后得以相遇。","symbolism":"九五居中正，真诚同心仍可能经历隔阂与艰难。","guidance":"合作遇阻时坚持正当沟通，必要时协调解决障碍。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：同人于郊，无悔。","original_xiang":"同人于郊，志未得也。","plain":"在郊外与人相合，没有悔恨。","symbolism":"上九远离纷争，但小象亦言其志尚未完全实现。","guidance":"保持开放和气，也需评估是否真正达成合作目标。","editorial_status":"初稿待人工校对"}],"火天大有":[{"line_index":0,"original_line":"初九：无交害，匪咎，艰则无咎。","original_xiang":"大有初九，无交害也。","plain":"尚未与有害之事牵连；虽无过失，仍须谨慎面对艰难。","symbolism":"初九处富有之始，尚未因财富与权势结成复杂牵连；戒心可以防患。","guidance":"获得资源之初先守边界，避免不必要的利益纠葛。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：大车以载，有攸往，无咎。","original_xiang":"大车以载，积中不败也。","plain":"大车足以承载重物，可以有所前往而无过失。","symbolism":"九二阳刚居中，象征能力与承载相称；小象强调积载有度而不倾败。","guidance":"评估团队与资源的承载能力后，再推动较大的计划。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：公用亨于天子，小人弗克。","original_xiang":"公用亨于天子，小人害也。","plain":"公侯得以参与天子的祭享，小人难以承担此事。","symbolism":"九三强调资源丰厚时的公心与责任，不能以私利替代担当。","guidance":"取得权力或资源时，应以职责与公共利益为先。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：匪其彭，无咎。","original_xiang":"匪其彭，无咎；明辨晰也。","plain":"不炫耀自己盛大的财富与势力，便没有过失。","symbolism":"九四近尊位而能自知分寸，小象以明辨形势说明免咎之由。","guidance":"身处优势位置时避免张扬，主动识别权力边界。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：厥孚交如，威如；吉。","original_xiang":"厥孚交如，信以发志也。威如之吉，易而无备也。","plain":"以诚信相交，同时保持应有的威仪，吉祥。","symbolism":"六五以柔居尊，既凭互信凝聚人心，也以威信维持秩序。","guidance":"领导合作时兼顾信任与制度，不宜只靠亲近关系。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：自天佑之，吉无不利。","original_xiang":"大有上吉，自天佑也。","plain":"得到上天护佑，吉祥而无所不利。","symbolism":"上九处大有之终，呈现顺天守善、积德而得助的理想图景。","guidance":"成功时继续守正与感恩，勿将吉辞当作免除风险的保证。","editorial_status":"初稿待人工校对"}],"地山谦":[{"line_index":0,"original_line":"初六：谦谦君子，用涉大川，吉。","original_xiang":"谦谦君子，卑以自牧也。","plain":"谦逊又谦逊的君子，可以渡过大河，吉。","symbolism":"初六在卑下之位而能自我约束；小象称其以谦自牧。","guidance":"面对困难任务，先保持学习心态与充分准备。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：鸣谦，贞吉。","original_xiang":"鸣谦贞吉，中心得也。","plain":"谦逊之德显扬于外，守正则吉。","symbolism":"六二居中守正，谦德出于内心而自然为人所知。","guidance":"以持续行动建立可信声誉，不必刻意标榜谦逊。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：劳谦君子，有终吉。","original_xiang":"劳谦君子，万民服也。","plain":"勤劳有功而仍谦逊的君子，能够善终，吉。","symbolism":"九三为全卦唯一阳爻，能有功而不居功，故众人归服。","guidance":"取得成绩后合理分功，保持对协作者的尊重。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：无不利，㧑谦。","original_xiang":"无不利㧑谦；不违则也。","plain":"行事无不有利，但仍应发挥谦逊之德。","symbolism":"六四在上位而能以谦调和上下，小象强调不违背合宜法则。","guidance":"协调各方时既有礼让，也要维持清晰原则。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：不富，以其邻，利用侵伐，无不利。","original_xiang":"利用侵伐，征不服也。","plain":"虽不以财富自矜，却能与邻近者同心；有时需要采取果断行动。","symbolism":"六五说明谦逊不等于一味退让；爻辞中的侵伐属于古代政治语境。","guidance":"处理持续失序的问题时，可依法依规采取必要措施，避免把古代战争辞句直接套用于现实。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：鸣谦，利用行师，征邑国。","original_xiang":"鸣谦，志未得也。可用行师，征邑国也。","plain":"谦逊之名远扬；可用兵整治自己的邑国。","symbolism":"上六志向尚未实现，强调先整顿自己能够负责的范围。","guidance":"先解决自身团队或组织的问题，再考虑对外扩展。","editorial_status":"初稿待人工校对"}],"雷地豫":[{"line_index":0,"original_line":"初六：鸣豫，凶。","original_xiang":"初六鸣豫，志穷凶也。","plain":"过分宣扬自己的欢乐与得意，凶。","symbolism":"初六处豫之始，倚仗呼应而张扬，易因自满失去节制。","guidance":"刚有好消息时勿过度承诺，先核实实际条件。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：介于石，不终日，贞吉。","original_xiang":"不终日，贞吉；以中正也。","plain":"操守坚定如石，不必等到一天结束便能辨明变化；守正吉。","symbolism":"六二居中得正，能及早识别逸乐中的风险而不受牵引。","guidance":"发现偏差及时调整，不要拖延到问题扩大。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：盱豫，悔。迟有悔。","original_xiang":"盱豫有悔，位不当也。","plain":"仰望他人而沉迷享乐，会有懊悔；迟疑不改也会后悔。","symbolism":"六三失位而趋附上方，警惕依赖他人带来的失衡。","guidance":"减少盲目攀附，及时建立自己的判断与行动。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：由豫，大有得。勿疑。朋盍簪。","original_xiang":"由豫，大有得；志大行也。","plain":"欢乐与信心由此而生，可有重大收获；不要疑虑，朋友将聚集。","symbolism":"九四为众阴所应，能凝聚力量并推动共同目标。","guidance":"有明确方向时广纳伙伴，但仍需保持透明与分工。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：贞疾，恒不死。","original_xiang":"六五贞疾，乘刚也。恒不死，中未亡也。","plain":"长期有疾患，却仍能维持而不至灭亡。","symbolism":"六五虽居尊位却受九四制约，小象以居中说明尚能支撑。","guidance":"承认结构性压力，优先维持关键能力并寻找改善空间。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：冥豫，成有渝，无咎。","original_xiang":"冥豫在上，何可长也。","plain":"沉迷于昏暗的享乐；若能改变既成状态，可以无咎。","symbolism":"上六处豫之极，沉溺难以长久；转变才有出路。","guidance":"当舒适区开始损害判断时，及时纠偏而非继续放任。","editorial_status":"初稿待人工校对"}],"泽雷随":[{"line_index":0,"original_line":"初九：官有渝，贞吉。出门交有功。","original_xiang":"官有渝，从正吉也。出门交有功，不失也。","plain":"所掌管的事务或立场有所改变；守正则吉，走出去交往可有收获。","symbolism":"初九以变通响应新局面，但小象强调随变而不失正道。","guidance":"调整角色或策略时说明原则，并主动与外部沟通。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：系小子，失丈夫。","original_xiang":"系小子，弗兼与也。","plain":"系恋年轻的小子，就会失去成熟的丈夫。","symbolism":"六二以选择关系作喻，说明不同依附对象不能兼得。","guidance":"明确合作优先级，避免因短期吸引而舍弃重要承诺。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：系丈夫，失小子。随，有求得利，居贞。","original_xiang":"系丈夫，志舍下也。","plain":"亲近成熟的丈夫，便失去小子；有所追求可得利，宜守正。","symbolism":"六三舍下而随上，重在选择更合适的方向，但须守正。","guidance":"选择长期价值更高的合作，同时核对交换条件。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：随有获，贞凶。有孚在道，以明，何咎。","original_xiang":"随有获，其义凶也。有孚在道，明功也。","plain":"随从而有所收获，若只固执追逐成果反有凶险；以诚信守道、明辨事理，则无咎。","symbolism":"九四位近君主而有众望，收获伴随猜忌；正道与明察可化解。","guidance":"成绩越突出越应公开规则、避免利益冲突。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：孚于嘉，吉。","original_xiang":"孚于嘉，吉；位正中也。","plain":"对美善之事抱持诚信，吉。","symbolism":"九五居中得正，所随者合于善，小象强调正中之德。","guidance":"以可信的价值观选择伙伴与目标。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：拘系之，乃从维之。王用亨于西山。","original_xiang":"拘系之，上穷也。","plain":"紧紧拘系又反复维系；王在西山举行祭享。","symbolism":"上六处随之极，表现关系的强力维系与礼仪凝聚。","guidance":"维持重要关系应重视共同承诺，也要避免过度控制。","editorial_status":"初稿待人工校对"}],"山风蛊":[{"line_index":0,"original_line":"初六：干父之蛊，有子考，无咎，厉终吉。","original_xiang":"干父之蛊，意承考也。","plain":"整治父辈留下的弊病；有能担当的子辈，虽有危险，终能得吉。","symbolism":"初六开始处理旧弊，小象强调承继先人本意而修正问题。","guidance":"接手遗留问题时尊重历史，但要明确风险与整改责任。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：干母之蛊，不可贞。","original_xiang":"干母之蛊，得中道也。","plain":"整治母辈留下的弊病，不宜过于刚硬固执。","symbolism":"九二阳刚居中，面对亲近关系中的旧弊须以柔和得中之道处理。","guidance":"修复家庭或内部制度问题时，沟通方式与整改目标同样重要。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：干父之蛊，小有悔，无大咎。","original_xiang":"干父之蛊，终无咎也。","plain":"整治父辈留下的弊病，虽有小悔，却无大过失。","symbolism":"九三刚进而可能操之过急，但方向在于纠弊，故最终无大咎。","guidance":"推进改革时接受小幅试错，避免因急躁伤害合作。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：裕父之蛊，往见吝。","original_xiang":"裕父之蛊，往未得也。","plain":"宽纵父辈留下的弊病，继续前往会遇到羞吝。","symbolism":"六四过于宽缓，未能及时制止积弊，小象指出继续如此难有所得。","guidance":"对已知问题不能长期姑息，应设定明确整改期限。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：干父之蛊，用誉。","original_xiang":"干父用誉，承以德也。","plain":"整治父辈留下的弊病，并因此获得赞誉。","symbolism":"六五以柔居中，能够凭德行承接并改善旧事。","guidance":"通过公正、可验证的整改成果赢得信任。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：不事王侯，高尚其事。","original_xiang":"不事王侯，志可则也。","plain":"不侍奉王侯，崇尚自己所坚持的事业。","symbolism":"上九超然于权位之外，强调独立志节可作为效法的准则。","guidance":"在不违背现实责任的前提下，保持价值独立，不必一味追逐职位。","editorial_status":"初稿待人工校对"}],"地泽临":[{"line_index":0,"original_line":"初九：咸临，贞吉。","original_xiang":"咸临贞吉，志行正也。","plain":"以真诚感通他人而临近、领导，守正则吉。","symbolism":"初九阳刚在下，领导力从正直的志向和相互感应开始。","guidance":"初接触团队或项目时先建立信任，不以职位压人。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：咸临，吉无不利。","original_xiang":"咸临，吉无不利；未顺命也。","plain":"以诚意亲临、感化众人，吉而有利。","symbolism":"九二刚中，与六五相应；既有主动性，也须避免机械服从。","guidance":"主动沟通、坚持原则，合作时保留独立判断。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：甘临，无攸利。既忧之，无咎。","original_xiang":"甘临，位不当也。既忧之，咎不长也。","plain":"只凭甜言蜜语去亲近或管理他人，并无好处；觉察问题后便可免咎。","symbolism":"六三以柔居刚位，甘言易流于取悦；知忧而改是转机。","guidance":"检查承诺是否兑现，发现讨好式管理就及时纠偏。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：至临，无咎。","original_xiang":"至临无咎，位当也。","plain":"亲自到位、切实接近事务，可以免除过失。","symbolism":"六四位置得当，与初九相应；贵在身体力行而非远程发令。","guidance":"关键节点亲自了解一线情况，明确责任与支持。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：知临，大君之宜，吉。","original_xiang":"大君之宜，行中之谓也。","plain":"以智慧与适宜的方法治理，是领导者应有之道，吉。","symbolism":"六五柔中居尊，善于用人和把握中道，不以强势代替判断。","guidance":"授权专业人士，建立信息反馈与公正决策机制。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：敦临，吉无咎。","original_xiang":"敦临之吉，志在内也。","plain":"以敦厚诚恳的态度亲近和照顾他人，吉且无咎。","symbolism":"上六处临之终，厚道能使关系持久，内心仍关切基层。","guidance":"收尾与交接时照顾长期关系，避免只顾短期成果。","editorial_status":"初稿待人工校对"}],"风地观":[{"line_index":0,"original_line":"初六：童观，小人无咎，君子吝。","original_xiang":"初六童观，小人道也。","plain":"像孩童般只看见表面；对一般人无过，对君子却有失。","symbolism":"初六位置低远，见识受限；对负责任者而言浅见不足。","guidance":"重要决定先补足资料，不凭第一印象下结论。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：窥观，利女贞。","original_xiang":"窥观女贞，亦可丑也。","plain":"如从门缝窥看，见闻狭窄；守此方式虽适合特定处境，却有局限。","symbolism":"六二柔顺居内，观察受遮蔽；小象强调未能广见。","guidance":"主动接触不同来源，不只依赖内部转述。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：观我生，进退。","original_xiang":"观我生，进退；未失道也。","plain":"观察自己一生的作为，以决定进退。","symbolism":"六三在上下交界，观己比评人更能找到行动方向。","guidance":"复盘实际能力与资源，再决定扩大还是收缩。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：观国之光，利用宾于王。","original_xiang":"观国之光，尚宾也。","plain":"观看国家的光明气象，适宜作为贵宾参与。","symbolism":"六四近九五，能见治理成果；观察须兼看制度与文化。","guidance":"合作前考察对方组织治理、信誉与真实表现。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：观我生，君子无咎。","original_xiang":"观我生，观民也。","plain":"反观自己一生的作为，君子可以无咎。","symbolism":"九五居尊，观天下亦须从自身德行和施政结果反省。","guidance":"领导者用可验证的成效检验自身决策，而非只看赞誉。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：观其生，君子无咎。","original_xiang":"观其生，志未平也。","plain":"观察他人的行事与社会反应，君子可以无咎。","symbolism":"上九在尊位之外，观察他人亦需保持自身操守。","guidance":"担任顾问或监督角色时坚持独立、审慎评价。","editorial_status":"初稿待人工校对"}],"火雷噬嗑":[{"line_index":0,"original_line":"初九：屦校灭趾，无咎。","original_xiang":"屦校灭趾，不行也。","plain":"脚被刑具限制而伤及脚趾，可免进一步过失。","symbolism":"初九以小惩止大错，重在及早设界限而非滥施处罚。","guidance":"发现轻微违规先及时纠正，处罚应合法且相称。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：噬肤灭鼻，无咎。","original_xiang":"噬肤灭鼻，乘刚也。","plain":"咬柔软的肉却没过鼻子，仍无咎。","symbolism":"六二处理障碍相对容易，却因过度深入而显得严厉。","guidance":"处理明确问题也须掌握力度，避免超出必要范围。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：噬腊肉，遇毒；小吝，无咎。","original_xiang":"遇毒，位不当也。","plain":"咬干硬腊肉时遇到有毒之物；稍有困难，但无大过。","symbolism":"六三处位不当，解决积弊会碰到隐藏阻力与反噬。","guidance":"调查旧问题时保留证据，做好风险隔离和复核。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：噬干胏，得金矢，利艰贞，吉。","original_xiang":"利艰贞吉，未光也。","plain":"咬带骨干肉，得到金箭；在艰难中守正则吉。","symbolism":"九四面对坚硬阻碍，须凭刚正、耐心和事实突破。","guidance":"复杂纠纷先厘清证据与规则，不靠强行推进。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：噬干肉，得黄金，贞厉，无咎。","original_xiang":"贞厉无咎，得当也。","plain":"咬干肉而得黄金；虽守正仍有危险，谨慎可无咎。","symbolism":"六五居尊而柔中，处理争议可得实益，但责任重大。","guidance":"重大裁决保持程序公正，充分考虑后果。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：何校灭耳，凶。","original_xiang":"何校灭耳，聪不明也。","plain":"颈戴重枷而遮住耳朵，凶。","symbolism":"上九象征屡不听劝，积错至重罚；小象责其不明听。","guidance":"建立早期预警和申诉渠道，别等问题失控才回应。","editorial_status":"初稿待人工校对"}],"山火贲":[{"line_index":0,"original_line":"初九：贲其趾，舍车而徒。","original_xiang":"舍车而徒，义弗乘也。","plain":"修饰脚步，舍车步行。","symbolism":"初九重合宜之行而非外在排场；选择符合身份与原则。","guidance":"宁可采取朴素可靠的做法，不为形象牺牲原则。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：贲其须。","original_xiang":"贲其须，与上兴也。","plain":"修饰胡须。","symbolism":"六二的装饰依附于主体，如须随颔动；形式不能脱离实质。","guidance":"品牌包装要服务真实产品与价值，不可本末倒置。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：贲如濡如，永贞吉。","original_xiang":"永贞之吉，终莫之陵也。","plain":"文采润泽而光鲜，长久守正则吉。","symbolism":"九三处文明与止之间，外表华美需有恒常正道支撑。","guidance":"展示成果时保持透明，勿用包装掩盖缺陷。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：贲如皤如，白马翰如，匪寇婚媾。","original_xiang":"六四，当位疑也。匪寇婚媾，终无尤也。","plain":"装饰素白，白马疾驰；来者不是敌人，而是求婚者。","symbolism":"六四因疑虑误判外来者，最终可由信任消除戒心。","guidance":"面对陌生合作先核实意图，不因外表误判。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：贲于丘园，束帛戋戋，吝，终吉。","original_xiang":"六五之吉，有喜也。","plain":"装饰山丘园圃，所送帛礼微薄；虽有遗憾，终究吉。","symbolism":"六五以质朴诚意胜过奢华排场，礼薄而心真。","guidance":"资源有限时优先投入实质工作，保持诚恳沟通。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：白贲，无咎。","original_xiang":"白贲无咎，上得志也。","plain":"返归纯白朴素的装饰，可以无咎。","symbolism":"上九文饰至极而归于本真，减去繁复才显本色。","guidance":"项目成熟后精简多余流程和宣传，让成果说话。","editorial_status":"初稿待人工校对"}],"山地剥":[{"line_index":0,"original_line":"初六：剥床以足，蔑贞凶。","original_xiang":"剥床以足，以灭下也。","plain":"床脚开始被剥蚀，正道受损，有凶险。","symbolism":"初六从根基开始腐蚀，微小损害若忽略将逐步扩大。","guidance":"优先检查制度、现金流与基础设施的薄弱环节。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：剥床以辨，蔑贞凶。","original_xiang":"剥床以辨，未有与也。","plain":"床架连接处也被剥蚀，正道受损，凶。","symbolism":"六二剥蚀向上推进，支撑体系松动且缺少外援。","guidance":"及时止损并争取外部支持，避免孤立应对。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：剥之，无咎。","original_xiang":"剥之无咎，失上下也。","plain":"参与剥落却能脱离同类的不正之势，可以无咎。","symbolism":"六三与上九相应，虽处剥势仍可选择不随波逐流。","guidance":"在不良环境中守住底线，必要时退出有害安排。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：剥床以肤，凶。","original_xiang":"剥床以肤，切近灾也。","plain":"剥蚀已触及床上人的肌肤，凶。","symbolism":"六四损害由结构逼近人身，风险从隐患变为直接伤害。","guidance":"出现实质损失时立即启动保护与应急措施。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：贯鱼，以宫人宠，无不利。","original_xiang":"以宫人宠，终无尤也。","plain":"如鱼贯列，以宫人受宠的次序安排，便无不利。","symbolism":"六五以有序统摄众阴，剥极之际仍可用秩序减少伤害。","guidance":"资源紧张时公开排序与分配规则，避免争夺失控。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：硕果不食，君子得舆，小人剥庐。","original_xiang":"君子得舆，民所载也。小人剥庐，终不可用也。","plain":"硕大的果实未被吃尽；君子得车载，小人反而剥坏自己的屋舍。","symbolism":"上九一阳尚存，是更新的种子；德行决定衰败中的结局。","guidance":"保留核心人才与关键资产，为复苏留种；切勿拆毁根本。","editorial_status":"初稿待人工校对"}],"地雷复":[{"line_index":0,"original_line":"初九：不复远，无袛悔，元吉。","original_xiang":"不远之复，以修身也。","plain":"偏离正道不远便回头，尚未酿成严重悔恨，大吉。","symbolism":"初九阳气初生，及时知返是复卦的根本，重在修身。","guidance":"发现方向不对时立即修正，小错不必拖成大错。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：休复，吉。","original_xiang":"休复之吉，以下仁也。","plain":"安然、从容地返回正道，吉祥。","symbolism":"六二居中得正，亲近初九之仁，回归不必激烈。","guidance":"借助可靠同伴的榜样，平稳恢复秩序与习惯。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：频复，厉无咎。","original_xiang":"频复之厉，义无咎也。","plain":"屡次偏离又屡次回返，虽有危险，终能免咎。","symbolism":"六三处动之极，反复不定；肯持续纠错仍有转圜。","guidance":"建立检查机制，减少同一问题反复发生。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：中行独复。","original_xiang":"中行独复，以从道也。","plain":"处在众人之中，却能独自返回正道。","symbolism":"六四与初九相应，即使环境不利也不随波逐流。","guidance":"面对群体压力，依据原则作独立选择。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：敦复，无悔。","original_xiang":"敦复无悔，中以自考也。","plain":"以敦厚诚恳的态度回归正道，没有悔恨。","symbolism":"六五居尊而中，回归的关键在诚实自省而非表面补救。","guidance":"坦诚承认问题并持续修复，不求立刻得到赞许。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：迷复，凶，有灾眚。用行师，终有大败，以其国君，凶；至于十年，不克征。","original_xiang":"迷复之凶，反君道也。","plain":"迷失回归之路则凶，强行用兵还会招致重大失败。","symbolism":"上六居复之终而不知返，执迷扩大损失，难以速复。","guidance":"出现系统性错误时先止损，切勿以更大投入掩盖误判。","editorial_status":"初稿待人工校对"}],"天雷无妄":[{"line_index":0,"original_line":"初九：无妄，往吉。","original_xiang":"无妄之往，得志也。","plain":"以真实无妄的态度前行，吉祥。","symbolism":"初九阳刚发动，动机纯正且行动坦荡。","guidance":"在事实清楚、动机正当时积极推进，不玩弄取巧手段。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：不耕获，不菑畬，则利有攸往。","original_xiang":"不耕获，未富也。","plain":"不预设耕种必有收获，也不强求开垦即得熟田，前往有利。","symbolism":"六二中正而无私心，不把每一步都变成索取回报的交易。","guidance":"先把应做之事做好，不以短期收益扭曲判断。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：无妄之灾，或系之牛，行人之得，邑人之灾。","original_xiang":"行人得牛，邑人灾也。","plain":"无端遭灾：路人牵走拴着的牛，乡里人却蒙受损失。","symbolism":"六三说明正直行事也可能遇到外来意外，非所有损失都源于己过。","guidance":"对突发风险留有证据和预案，勿急于责怪受害者。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：可贞，无咎。","original_xiang":"可贞无咎，固有之也。","plain":"能够坚守正道，便没有过失。","symbolism":"九四不妄动，守住已有的正当位置与分寸。","guidance":"面对诱惑先核对边界，稳守职责比冒进更妥。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：无妄之疾，勿药有喜。","original_xiang":"无妄之药，不可试也。","plain":"无端生病，不宜乱用药，最终会有喜庆。","symbolism":"九五居中得正，偶发异常未必需要过度干预。","guidance":"先查明原因再采取措施，避免因恐慌而过度处置；健康问题仍应求医。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：无妄，行有眚，无攸利。","original_xiang":"无妄之行，穷之灾也。","plain":"即使本意无妄，此时强行前进也会有灾，无所利益。","symbolism":"上九已到无妄之极，动机正确不等于时机合宜。","guidance":"条件不允许时应暂停，切勿以“初心正确”为冒进辩护。","editorial_status":"初稿待人工校对"}],"山天大畜":[{"line_index":0,"original_line":"初九：有厉利已。","original_xiang":"有厉利已，不犯灾也。","plain":"前方有危险，停止前进反而有利。","symbolism":"初九刚健欲进，却受上方蓄止，懂得止步可避灾。","guidance":"发现明显风险时暂缓启动，先补足资源与许可。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：舆说輹。","original_xiang":"舆说輹，中无尤也。","plain":"车轴的连接部件脱落，车辆暂不能前行。","symbolism":"九二处中，主动停驶并非失败，而是保存力量。","guidance":"项目关键条件缺失时先修复基础设施，不勉强上路。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：良马逐，利艰贞。曰闲舆卫，利有攸往。","original_xiang":"利有攸往，上合志也。","plain":"良马竞逐，艰难中守正有利；勤练车驾与护卫后可以前进。","symbolism":"九三有进取能力，但必须先训练和防备。","guidance":"在扩张前完成团队训练、流程演练与风险准备。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：童牛之牿，元吉。","original_xiang":"六四元吉，有喜也。","plain":"在小牛尚幼时加上防角之具，大吉。","symbolism":"六四从源头预防冲撞，治理贵在问题尚小时建立约束。","guidance":"早设规则与预警机制，比事后处罚更有效。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：豮豕之牙，吉。","original_xiang":"六五之吉，有庆也。","plain":"阉猪虽有獠牙却已失去冲撞之势，吉。","symbolism":"六五以柔中之德化解躁动根源，不仅靠强压表象。","guidance":"解决问题的激励与成因，避免只处理表面症状。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：何天之衢，亨。","original_xiang":"何天之衢，道大行也。","plain":"通往天空的大道已经开阔，亨通。","symbolism":"上九蓄养已足、阻碍解除，德才得以施展。","guidance":"准备成熟后把握开放窗口，让长期积累转为行动成果。","editorial_status":"初稿待人工校对"}],"山雷颐":[{"line_index":0,"original_line":"初九：舍尔灵龟，观我朵颐，凶。","original_xiang":"观我朵颐，亦不足贵也。","plain":"舍弃自己如灵龟般的本领，却羡慕别人进食的样子，凶。","symbolism":"初九本有自养之能，却因贪羡外物而失其贵。","guidance":"先盘点自身能力，不因攀比而放弃独立判断。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：颠颐，拂经，于丘颐，征凶。","original_xiang":"六二征凶，行失类也。","plain":"颠倒求养的常道，向高处乞求供养，出行则凶。","symbolism":"六二求养失其正途，依赖关系错位。","guidance":"核实资源来源与合作责任，避免不合宜的依附。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：拂颐，贞凶，十年勿用，无攸利。","original_xiang":"十年勿用，道大悖也。","plain":"违背养正之道，即使固执坚持也凶，长期不宜有所作为。","symbolism":"六三躁动而失正，错误的养生或供养方式难以持久。","guidance":"停止有害习惯或失衡商业模式，先修正基本原则。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：颠颐吉，虎视眈眈，其欲逐逐，无咎。","original_xiang":"颠颐之吉，上施光也。","plain":"反常地向下求贤求养，虽如猛虎专注追求，却无过失。","symbolism":"六四虽居上位，能向下求助并保持专注，反得其正。","guidance":"主动向专业人才请教，明确需求并尊重贡献。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：拂经，居贞吉，不可涉大川。","original_xiang":"居贞之吉，顺以从上也。","plain":"虽不循通常方式，安守正道则吉，但不可贸然涉险。","symbolism":"六五柔中而能力有限，宜倚重贤者而不强行担大任。","guidance":"依靠合适团队稳步经营，暂不承担超出能力的大风险。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：由颐，厉吉，利涉大川。","original_xiang":"由颐厉吉，大有庆也。","plain":"众人赖以得到养育的源头，虽有危险仍吉，利于渡过难关。","symbolism":"上九承担供养众人的重任，风险与责任并存。","guidance":"具备能力和担当时可承担关键任务，同时做好风险防护。","editorial_status":"初稿待人工校对"}],"泽风大过":[{"line_index":0,"original_line":"初六：藉用白茅，无咎。","original_xiang":"藉用白茅，柔在下也。","plain":"用洁白茅草垫在器物下面，谨慎如此便无咎。","symbolism":"初六以柔居下，细致的预防能承托非常之事。","guidance":"面对高风险任务，多做一道基础防护并非多余。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：枯杨生稊，老夫得其女妻，无不利。","original_xiang":"老夫女妻，过以相与也。","plain":"枯杨重新生出嫩芽，老者娶得年轻妻子，无不利。","symbolism":"九二刚中而得柔助，衰势中仍可能萌发新生。","guidance":"善用跨代际或跨能力合作，寻找更新旧业务的契机。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：栋桡，凶。","original_xiang":"栋桡之凶，不可以有辅也。","plain":"屋梁弯曲下陷，凶。","symbolism":"九三刚过而不中，承担超载又缺乏有效支撑。","guidance":"出现结构性超负荷时立即减载并加固，不靠意志硬撑。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：栋隆，吉。有它吝。","original_xiang":"栋隆之吉，不桡乎下也。","plain":"屋梁隆起坚固，吉；但若另有所图则有遗憾。","symbolism":"九四得到适当支撑，能担重任，但私心会破坏稳定。","guidance":"先守住核心任务，避免分心追逐额外利益。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：枯杨生华，老妇得其士夫，无咎无誉。","original_xiang":"枯杨生华，何可久也。老妇士夫，亦可丑也。","plain":"枯杨开花，老妇嫁给年轻男子，无过失也无值得称誉之处。","symbolism":"九五虽有一时表面繁华，却难持久，形式改善未必恢复根本。","guidance":"区分短暂热度与长期复苏，勿把表面增长当作根本转型。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：过涉灭顶，凶，无咎。","original_xiang":"过涉之凶，不可咎也。","plain":"涉水过深以至没顶，凶；虽有凶险却未必有道义过失。","symbolism":"上六为非常之事奋不顾身，结果危险与动机评价应区分。","guidance":"承担公益或救援责任也须评估安全，不以牺牲作为唯一选择。","editorial_status":"初稿待人工校对"}],"坎为水":[{"line_index":0,"original_line":"初六：习坎，入于坎窞，凶。","original_xiang":"习坎入坎，失道凶也。","plain":"习坎，入于坎窞，凶。","symbolism":"初六阴柔处险之底，重复陷落而无援。","guidance":"停止冒进，先确认风险边界与退出路径。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：坎有险，求小得。","original_xiang":"求小得，未出中也。","plain":"坎有险，求小得。","symbolism":"九二居险中，虽不能立刻脱困，仍可取得有限成果。","guidance":"缩小目标，先争取可控的小进展。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：来之坎坎，险且枕，入于坎窞，勿用。","original_xiang":"来之坎坎，终无功也。","plain":"来之坎坎，险且枕，入于坎窞，勿用。","symbolism":"六三进退皆险，倚靠之处也不安稳。","guidance":"暂缓重大决定，先解决反复出现的隐患。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：樽酒簋贰，用缶，纳约自牖，终无咎。","original_xiang":"樽酒簋贰，刚柔济也。","plain":"樽酒簋贰，用缶，纳约自牖，终无咎。","symbolism":"六四以简朴真诚与九五相通，不重排场。","guidance":"在困难时坦诚沟通，重实质而轻形式。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：坎不盈，祗既平，无咎。","original_xiang":"坎不盈，中未大也。","plain":"坎不盈，祗既平，无咎。","symbolism":"九五居中，险未满溢，守平衡可免过失。","guidance":"不要追求一次清零风险，逐步恢复稳定。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：系用徽𬙊，寘于丛棘，三岁不得，凶。","original_xiang":"上六失道，凶三岁也。","plain":"系用徽纆，寘于丛棘，三岁不得，凶。","symbolism":"上六陷险已深，束缚长期难解。","guidance":"及早处理违规或积弊，避免问题演变成长期困局。","editorial_status":"初稿待人工校对"}],"离为火":[{"line_index":0,"original_line":"初九：履错然，敬之无咎。","original_xiang":"履错之敬，以辟咎也。","plain":"履错然，敬之无咎。","symbolism":"初九光明初起，行动交错，谨慎可免过失。","guidance":"启动新事时核对步骤，勿因急躁出错。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：黄离，元吉。","original_xiang":"黄离元吉，得中道也。","plain":"黄离，元吉。","symbolism":"六二柔中得正，光明而不过激。","guidance":"用稳健、透明的方式推进最有利。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：日昃之离，不鼓缶而歌，则大耋之嗟，凶。","original_xiang":"日昃之离，何可久也。","plain":"日昃之离，不鼓缶而歌，则大耋之嗟，凶。","symbolism":"九三如日将暮，提醒盛时终会转衰。","guidance":"正视周期变化，及时调整而非沉溺失落。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：突如其来如，焚如，死如，弃如。","original_xiang":"突如其来如，无所容也。","plain":"突如其来如，焚如，死如，弃如。","symbolism":"九四阳刚躁进，火势突起而难以持久。","guidance":"避免突然激进扩张，先检验承受能力。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：出涕沱若，戚嗟若，吉。","original_xiang":"六五之吉，离王公也。","plain":"出涕沱若，戚嗟若，吉。","symbolism":"六五处尊位而能忧惧自省，因此转吉。","guidance":"承担责任时保持警觉，愿意听取逆耳意见。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：王用出征，有嘉折首，获匪其丑，无咎。","original_xiang":"王用出征，以正邦也。","plain":"王用出征，有嘉折首，获匪其丑，无咎。","symbolism":"上九以明断去除首恶，不株连无辜。","guidance":"处理问题抓关键责任，避免扩大伤害。","editorial_status":"初稿待人工校对"}],"泽山咸":[{"line_index":0,"original_line":"初六：咸其拇。","original_xiang":"咸其拇，志在外也。","plain":"咸其拇。","symbolism":"初六感应始于脚趾，心动而行动尚浅。","guidance":"先观察真实信号，不要因初步好感就投入全部。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：咸其腓，凶，居吉。","original_xiang":"虽凶，居吉，顺不害也。","plain":"咸其腓，凶，居吉。","symbolism":"六二感于小腿，容易被外力带动；安守反吉。","guidance":"别被情绪催促，维持自主判断。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：咸其股，执其随，往吝。","original_xiang":"咸其股，亦不处也。志在随人，所执下也。","plain":"咸其股，执其随，往吝。","symbolism":"九三感于大腿，随人而动失去主见。","guidance":"合作中保留原则，不盲目追随。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：贞吉悔亡，憧憧往来，朋从尔思。","original_xiang":"贞吉悔亡，未感害也。憧憧往来，未光大也。","plain":"贞吉悔亡，憧憧往来，朋从尔思。","symbolism":"九四居心意往来之际，专一则吉，纷扰则散。","guidance":"明确沟通意图，减少猜测与反复试探。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：咸其脢，无悔。","original_xiang":"咸其脢，志末也。","plain":"咸其脢，无悔。","symbolism":"九五感于背肉，感应内敛，不易偏私。","guidance":"保持适度距离，避免情感左右公正。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：咸其辅，颊，舌。","original_xiang":"咸其辅，颊，舌，滕口说也。","plain":"咸其辅颊舌。","symbolism":"上六感应停在口舌，言辞多而实质少。","guidance":"不要只靠承诺打动人，要看持续行动。","editorial_status":"初稿待人工校对"}],"雷风恒":[{"line_index":0,"original_line":"初六：浚恒，贞凶，无攸利。","original_xiang":"浚恒之凶，始求深也。","plain":"浚恒，贞凶，无攸利。","symbolism":"初六一开始就过度追求深固，反失恒常。","guidance":"新关系或制度要循序建立，不宜强求立刻稳定。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：悔亡。","original_xiang":"九二悔亡，能久中也。","plain":"悔亡。","symbolism":"九二居中守常，偏差可获修正。","guidance":"以长期一致的行为弥补先前失误。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：不恒其德，或承之羞，贞吝。","original_xiang":"不恒其德，无所容也。","plain":"不恒其德，或承之羞，贞吝。","symbolism":"九三德行反复，难获信任，固执更受辱。","guidance":"建立可执行的承诺，避免朝令夕改。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：田无禽。","original_xiang":"久非其位，安得禽也。","plain":"田无禽。","symbolism":"九四位置不当，久守错误方向也无收获。","guidance":"检查目标与方法，别把坚持误当成有效。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：恒其德，贞，妇人吉，夫子凶。","original_xiang":"妇人贞吉，从一而终也。夫子制义，从妇凶也。","plain":"恒其德，贞；妇人吉，夫子凶。","symbolism":"六五强调守常需结合所处角色与职责判断。","guidance":"原则要稳定，策略应随责任与情境调整。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：振恒，凶。","original_xiang":"振恒在上，大无功也。","plain":"振恒，凶。","symbolism":"上六躁动不安，失去恒久之道。","guidance":"重大变动前先稳住节奏，避免频繁折腾。","editorial_status":"初稿待人工校对"}],"天山遁":[{"line_index":0,"original_line":"初六：遁尾，厉，勿用有攸往。","original_xiang":"遁尾之厉，不往何灾也。","plain":"遁尾，厉，勿用有攸往。","symbolism":"初六退避太迟，落在队尾而危险。","guidance":"发现不利趋势应尽早准备退出，暂勿冒险前往。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：执之用黄牛之革，莫之胜说。","original_xiang":"执用黄牛，固志也。","plain":"执之用黄牛之革，莫之胜说。","symbolism":"六二以坚韧之物系守，志向牢固。","guidance":"守住核心承诺，但先辨别坚持是否合宜。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：系遁，有疾厉，畜臣妾吉。","original_xiang":"系遁之厉，有疾惫也。畜臣妾吉，不可大事也。","plain":"系遁，有疾厉，畜臣妾吉。","symbolism":"九三退而受牵绊，易生困扰；处理近务尚可。","guidance":"厘清人情与利益牵连，先安顿内部事务。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：好遁君子吉，小人否。","original_xiang":"君子好遁，小人否也。","plain":"好遁，君子吉，小人否。","symbolism":"九四虽有留恋，能舍则吉；贪恋则难退。","guidance":"面对诱惑仍应依原则及时止损。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：嘉遁，贞吉。","original_xiang":"嘉遁贞吉，以正志也。","plain":"嘉遁，贞吉。","symbolism":"九五退避得宜，合乎时中与正道。","guidance":"有计划地调整位置，保留声誉与主动权。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：肥遁，无不利。","original_xiang":"肥遁，无不利；无所疑也。","plain":"肥遁，无不利。","symbolism":"上九已超脱牵累，从容退处。","guidance":"完成交接后轻装转向，不必纠缠旧局。","editorial_status":"初稿待人工校对"}],"雷天大壮":[{"line_index":0,"original_line":"初九：壮于趾，征凶，有孚。","original_xiang":"壮于趾，其孚穷也。","plain":"壮于趾，征凶，有孚。","symbolism":"初九力量只在脚趾便欲前进，勇而欠审。","guidance":"不要把冲劲当实力，先验证资源是否足够。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：贞吉。","original_xiang":"九二贞吉，以中也。","plain":"贞吉。","symbolism":"九二居中不躁，强盛而能守正。","guidance":"在优势期维持纪律，比继续加速更重要。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。","original_xiang":"小人用壮，君子罔也。","plain":"小人用壮，君子用罔，贞厉，羝羊触藩，羸其角。","symbolism":"九三恃强冲撞，像公羊角困篱笆。","guidance":"强推遇阻时改换方式，别陷入面子之争。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：贞吉悔亡，藩决不羸，壮于大舆之輹。","original_xiang":"藩决不羸，尚往也。","plain":"贞吉悔亡，藩决不羸，壮于大舆之輹。","symbolism":"九四守正则障碍打开，力量用于承载而非冲撞。","guidance":"把资源投入基础能力与协同，推动稳健突破。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：丧羊于易，无悔。","original_xiang":"丧羊于易，位不当也。","plain":"丧羊于易，无悔。","symbolism":"六五柔中能舍去刚猛之性，故无悔。","guidance":"适当让步并非失势，能换取更大回旋空间。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：羝羊触藩，不能退，不能遂，无攸利，艰则吉。","original_xiang":"不能退，不能遂，不详也。艰则吉，咎不长也。","plain":"羝羊触藩，不能退，不能遂，无攸利，艰则吉。","symbolism":"上六进退两难，承认艰难才可能转吉。","guidance":"暂停对抗，重整方案与关系，勿继续硬碰。","editorial_status":"初稿待人工校对"}],"火地晋":[{"line_index":0,"original_line":"初六：晋如，摧如，贞吉。罔孚，裕无咎。","original_xiang":"晋如，摧如；独行正也。裕无咎；未受命也。","plain":"晋如摧如，贞吉，罔孚，裕无咎。","symbolism":"初六求进却受挫，暂不被信任，宽裕守正无咎。","guidance":"早期阻力不必急辩，用事实逐步建立信任。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：晋如，愁如，贞吉。受兹介福，于其王母。","original_xiang":"受兹介福，以中正也。","plain":"晋如愁如，贞吉，受兹介福于其王母。","symbolism":"六二进取中有忧虑，守正可得长辈或上位者助力。","guidance":"保持专业与耐心，争取可信赖的支持。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：众允，悔亡。","original_xiang":"众允之志，上行也。","plain":"众允，悔亡。","symbolism":"六三获得众人认可，先前疑虑得解。","guidance":"关键推进前取得团队共识，减少内耗。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：晋如鼫鼠，贞厉。","original_xiang":"鼫鼠贞厉，位不当也。","plain":"晋如鼫鼠，贞厉。","symbolism":"九四如贪藏的鼠，位不当而进退不安。","guidance":"避免靠投机攫取利益，先纠正权责不匹配。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：悔亡，失得勿恤，往吉无不利。","original_xiang":"失得勿恤，往有庆也。","plain":"悔亡，失得勿恤，往吉无不利。","symbolism":"六五不执着一时得失，光明推进。","guidance":"聚焦长期方向，别被短期数字牵着走。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：晋其角，维用伐邑，厉吉无咎，贞吝。","original_xiang":"维用伐邑，道未光也。","plain":"晋其角，维用伐邑，厉吉无咎，贞吝。","symbolism":"上九进至角端，强硬手段只宜整顿自身领域。","guidance":"必要的整顿须限定范围，切忌向外逞强。","editorial_status":"初稿待人工校对"}],"地火明夷":[{"line_index":0,"original_line":"初九：明夷于飞，垂其翼。君子于行，三日不食，有攸往，主人有言。","original_xiang":"君子于行，义不食也。","plain":"明夷于飞，垂其翼，君子于行，三日不食，有攸往，主人有言。","symbolism":"初九光明受伤，低飞远行且受非议。","guidance":"环境不利时保护能力，必要时低调转移。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：明夷，夷于左股，用拯马壮，吉。","original_xiang":"六二之吉，顺以则也。","plain":"明夷，夷于左股，用拯马壮，吉。","symbolism":"六二受伤但尚可借强健助力脱险。","guidance":"及时寻求可靠资源，先处理最紧迫的损害。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：明夷于南狩，得其大首，不可疾贞。","original_xiang":"南狩之志，乃大得也。","plain":"明夷于南狩，得其大首，不可疾贞。","symbolism":"九三在艰难中找到关键症结，仍不宜急于定局。","guidance":"抓住核心问题后分步改革，勿急于求成。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：入于左腹，获明夷之心，
