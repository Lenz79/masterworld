于出门庭。","original_xiang":"入于左腹，获心意也。","plain":"入于左腹，获明夷之心，于出门庭。","symbolism":"六四深入内部而识破暗昧之心，适宜离开。","guidance":"了解真实情况后及时脱离不健康的环境。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：箕子之明夷，利贞。","original_xiang":"箕子之贞，明不可息也。","plain":"箕子之明夷，利贞。","symbolism":"六五如箕子处暗世而守其明，内正外晦。","guidance":"暂时不便公开立场时，守住底线与证据。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：不明晦，初登于天，后入于地。","original_xiang":"初登于天，照四国也。后入于地，失则也。","plain":"不明晦，初登于天，后入于地。","symbolism":"上六由极盛转至极暗，失明德而坠落。","guidance":"权势不能代替自省，警惕失去监督后的崩塌。","editorial_status":"初稿待人工校对"}],"风火家人":[{"line_index":0,"original_line":"初九：闲有家，悔亡。","original_xiang":"闲有家，志未变也。","plain":"治家之初先立规矩，便能免去日后的懊悔。","symbolism":"初九在家庭秩序尚未紊乱时设防，重在防微杜渐。","guidance":"合作或家庭事务先讲清边界与责任，不要等冲突发生才补规则。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：无攸遂，在中馈，贞吉。","original_xiang":"六二之吉，顺以巽也。","plain":"不强求事事自行主导，安守内务、持正便吉。","symbolism":"六二居中而顺，象征在分工中尽责，而非争夺控制权。","guidance":"明确自己的职责，先把关键日常工作做好。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：家人嗃嗃，悔厉吉；妇子嘻嘻，终吝。","original_xiang":"家人嗃嗃，未失也；妇子嘻嘻，失家节也。","plain":"家中管束严厉虽有紧张仍可守正；一味嬉闹失序终会遗憾。","symbolism":"九三以严与宽的失衡对照，提醒纪律不可废、也不可过苛。","guidance":"管理团队既要有要求，也要保留沟通与体谅。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：富家，大吉。","original_xiang":"富家大吉，顺在位也。","plain":"家庭经营充实富足，是很大的吉祥。","symbolism":"六四柔顺得位，能以妥善治理积累家业。","guidance":"稳固财务与资源基础，让成果惠及成员。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：王假有家，勿恤。吉。","original_xiang":"王假有家，交相爱也。","plain":"主事者以德感通家庭，不必过度忧虑，结果吉利。","symbolism":"九五以尊位而能相爱，重在上下相互信任。","guidance":"领导者少用强制，多用可信的行动凝聚人心。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：有孚威如，终吉。","original_xiang":"威如之吉，反身之谓也。","plain":"既有诚信又有令人敬重的威仪，最终吉利。","symbolism":"上九指出真正的威信来自反省自身，而非单靠威吓。","guidance":"先检视自己的言行是否一致，再要求他人遵守。","editorial_status":"初稿待人工校对"}],"火泽睽":[{"line_index":0,"original_line":"初九：悔亡，丧马勿逐，自复；见恶人无咎。","original_xiang":"见恶人，以辟咎也。","plain":"失马不必急追，它会自行返回；面对难相处者也能免祸。","symbolism":"初九处乖离之始，避免以冲动加深对立。","guidance":"先冷静处理误会，必要时与不同立场者保持基本沟通。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：遇主于巷，无咎。","original_xiang":"遇主于巷，未失道也。","plain":"在小巷偶遇所要见的主人，虽非正式场合也无过失。","symbolism":"九二与六五相应，形式受阻而关系仍可相通。","guidance":"正式渠道不畅时，可用合宜的非正式沟通化解隔阂。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：见舆曳，其牛掣，其人天且劓，无初有终。","original_xiang":"见舆曳，位不当也。无初有终，遇刚也。","plain":"车被拖住、牛被牵制，甚至受辱；开头艰难，最终仍可能和合。","symbolism":"六三处上下不顺，虽受阻却因有相应而可终得转机。","guidance":"遭误解时先稳住关系，勿因初期挫折断定结局。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：睽孤，遇元夫，交孚，厉无咎。","original_xiang":"交孚无咎，志行也。","plain":"孤立之中遇到可信赖的同道，彼此诚信，虽有危险仍无咎。","symbolism":"九四失其同类而遇初九，以信任打破孤立。","guidance":"寻找价值观相近的合作方，但仍须评估共同风险。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：悔亡，厥宗噬肤，往何咎。","original_xiang":"厥宗噬肤，往有庆也。","plain":"悔恨消散，亲近者如咬开柔软之物般消除隔阂，前进无咎。","symbolism":"六五得九二相应，关系由疏转亲，阻隔易除。","guidance":"主动修复核心伙伴的信任，合作可逐步恢复。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：睽孤， 见豕负涂，载鬼一车， 先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。","original_xiang":"遇雨之吉，群疑亡也。","plain":"起初把来者看作可疑敌人，后来解除戒心；如雨降下，终归吉利。","symbolism":"上九疑惧过甚而生幻象，最终因阴阳相合而释疑。","guidance":"重大判断前核实事实，避免把误会当作敌意。","editorial_status":"初稿待人工校对"}],"水山蹇":[{"line_index":0,"original_line":"初六：往蹇，来誉。","original_xiang":"往蹇来誉，宜待也。","plain":"向前会遇艰难，退回来反而获得赞誉。","symbolism":"初六在险阻初起时宜待，不以硬闯为勇。","guidance":"项目条件不足就暂停推进，先补齐准备。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：王臣蹇蹇，匪躬之故。","original_xiang":"王臣蹇蹇，终无尤也。","plain":"臣子为君事一再遇难，并非出于个人私利。","symbolism":"六二守职尽忠，承担公共责任而不计私得。","guidance":"遇组织难题时区分职责与私利，留下透明决策记录。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：往蹇来反。","original_xiang":"往蹇来反，内喜之也。","plain":"前行受阻，回到原处较为妥当。","symbolism":"九三前临险境，回归内卦则有所依托。","guidance":"先返回熟悉的资源和团队，重新规划路线。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：往蹇来连。","original_xiang":"往蹇来连，当位实也。","plain":"向前艰难，回来与伙伴联结。","symbolism":"六四柔顺得位，单独突围不如寻求支援。","guidance":"跨部门协作比孤军行动更有机会突破。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：大蹇朋来。","original_xiang":"大蹇朋来，以中节也。","plain":"处于重大困境时，朋友会前来相助。","symbolism":"九五居中守正，能以德行凝聚支持者。","guidance":"困难越大越应公开需求，争取可信盟友。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：往蹇来硕，吉；利见大人。","original_xiang":"往蹇来硕，志在内也。利见大人，以从贵也。","plain":"前进受阻，回来反而有丰厚收获；见有德有位者有利。","symbolism":"上六处蹇之终，转而从九五可得归宿。","guidance":"及时调整方向，向有经验且有决策力者求助。","editorial_status":"初稿待人工校对"}],"雷水解":[{"line_index":0,"original_line":"初六：无咎。","original_xiang":"刚柔之际，义无咎也。","plain":"险难刚刚解除，没有过失。","symbolism":"初六与九四相应，刚柔相接，具备化解的开端。","guidance":"抓住缓和窗口，尽快恢复正常秩序。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：田获三狐，得黄矢，贞吉。","original_xiang":"九二贞吉，得中道也。","plain":"田猎得到三只狐狸和黄色箭矢，守正吉利。","symbolism":"九二以中正识破狡诈，黄矢象征正直有准。","guidance":"厘清问题根源，凭证据处理隐患。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：负且乘，致寇至，贞吝。","original_xiang":"负且乘，亦可丑也，自我致戎，又谁咎也。","plain":"背负财物却乘坐显贵之车，招来盗寇，即使自守也难免羞吝。","symbolism":"六三德位不称，外在排场招致觊觎。","guidance":"权责与资源不匹配时应收敛表现、修正制度。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：解而拇，朋至斯孚。","original_xiang":"解而拇，未当位也。","plain":"解除脚拇指般的牵累，可信朋友才会前来。","symbolism":"九四需摆脱不当依附，才能与正当伙伴相合。","guidance":"清理有利益冲突的关系，建立可靠合作。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：君子维有解，吉；有孚于小人。","original_xiang":"君子有解，小人退也。","plain":"君子能真正解除困局则吉，小人也会因此退避。","symbolism":"六五以诚信解难，正气确立而邪僻自退。","guidance":"用公开、公平的办法解决问题，不靠报复维持秩序。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：公用射隼，于高墉之上，获之，无不利。","original_xiang":"公用射隼，以解悖也。","plain":"公侯在高墙上射中猛禽，去除祸患，无往不利。","symbolism":"上六处解之终，针对残余的悖乱果断处理。","guidance":"在风险证据明确时，集中解决最后的关键障碍。","editorial_status":"初稿待人工校对"}],"山泽损":[{"line_index":0,"original_line":"初九：已事遄往，无咎，酌损之。","original_xiang":"已事遄往，尚合志也。","plain":"办完自己的事便迅速前往相助，无过；但须酌量减损。","symbolism":"初九愿助六四，强调付出也要衡量承受能力。","guidance":"支援他人之前先核算自身资源，避免过度牺牲。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：利贞，征凶，弗损益之。","original_xiang":"九二利贞，中以为志也。","plain":"守正有利，贸然出征有凶；不损自己反能增益他人。","symbolism":"九二居中，帮助不等于盲目自损。","guidance":"坚持核心原则，用能力与方法创造价值。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：三人行，则损一人；一人行，则得其友。","original_xiang":"一人行，三则疑也。","plain":"三人同行会减去一人；一人独行反而能找到同伴。","symbolism":"六三以人数过多易生猜疑，强调关系贵在契合。","guidance":"精简决策团队，明确伙伴关系与责任。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：损其疾，使遄有喜，无咎。","original_xiang":"损其疾，亦可喜也。","plain":"减轻自身的弊病，越快越可喜，没有过失。","symbolism":"六四能接受初九帮助，主动去病而改善。","guidance":"优先修复最明显的流程缺陷，及时接受反馈。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：或益之，十朋之龟弗克违，元吉。","original_xiang":"六五元吉，自上佑也。","plain":"有人增益自己，价值十朋的大龟也不能违背，极吉。","symbolism":"六五虚中受益，外援与天时相合。","guidance":"面对难得支持时以谦逊与诚信承接，不可自满。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：弗损益之，无咎，贞吉，利有攸往，得臣无家。","original_xiang":"弗损益之，大得志也。","plain":"不再损人而能增益他人，守正吉，前往有利，并得众人归附。","symbolism":"上九由损转益，以成全他人实现共同利益。","guidance":"把节约所得转化为共享成果，避免只让少数人受益。","editorial_status":"初稿待人工校对"}],"风雷益":[{"line_index":0,"original_line":"初九：利用为大作，元吉，无咎。","original_xiang":"元吉无咎，下不厚事也。","plain":"适宜承担重大事业，结果大吉而无过失。","symbolism":"初九受上方增益，处下位更应把机会用于正事。","guidance":"资源到位时推进有公共价值的重点项目。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：或益之，十朋之龟弗克违，永贞吉。王用享于帝，吉。","original_xiang":"或益之，自外来也。","plain":"有人给予增益，价值十朋的大龟也不能违背；长久守正吉。","symbolism":"六二虚中受益，强调外来帮助与持久正道相配。","guidance":"接受支持后建立长期机制，不把偶然好运当成常态。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：益之用凶事，无咎。有孚中行，告公用圭。","original_xiang":"益用凶事，固有之也。","plain":"即使用增益去处理灾难也无过；以诚信中道上报。","symbolism":"六三处多事之位，危机中仍应守信合规。","guidance":"紧急应对须透明汇报，并保留授权与依据。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：中行，告公从。利用为依迁国。","original_xiang":"告公从，以益志也。","plain":"持中正之道进言，上级听从；依此迁国也有利。","symbolism":"六四居近君之位，能沟通上下、推动重大调整。","guidance":"大型变革先取得关键利益相关方支持。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：有孚惠心，勿问元吉。有孚惠我德。","original_xiang":"有孚惠心，勿问之矣。惠我德，大得志也。","plain":"心怀诚信而施惠，不必多问，自然大吉；善意也会得到回应。","symbolism":"九五以惠心居尊位，互信形成良性循环。","guidance":"以长期可信的利益分享建立合作。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：莫益之，或击之，立心勿恒，凶。","original_xiang":"莫益之，偏辞也。或击之，自外来也。","plain":"无人增益，反可能遭受攻击；立心反复无常则凶。","symbolism":"上九贪求过甚而失众心，动机不定招致反噬。","guidance":"停止单方面索取，重建互惠与一致承诺。","editorial_status":"初稿待人工校对"}],"泽天夬":[{"line_index":0,"original_line":"初九：壮于前趾，往不胜为咎。","original_xiang":"不胜而往，咎也。","plain":"脚趾先逞强，实力不足便前往，失败招咎。","symbolism":"初九阳刚在下，决断之心超过实际能力。","guidance":"未确认胜算前不要贸然发起对抗。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：惕号，莫夜有戎，勿恤。","original_xiang":"莫夜有戎，得中道也。","plain":"保持警惕并发出警号，即使夜间有敌袭也无需忧惧。","symbolism":"九二居中，戒备充分而不惊乱。","guidance":"建立预警与应急预案，降低突发事件冲击。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。","original_xiang":"君子夬夬，终无咎也。","plain":"面颊显出强硬之色会招凶；君子坚持决断，即使受雨淋而被误解也无咎。","symbolism":"九三与上六相应，决断中夹杂复杂关系，贵在内心守正。","guidance":"坚持原则但避免公开逞强，允许短期误解。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：臀无肤，其行次且。牵羊悔亡，闻言不信。","original_xiang":"其行次且，位不当也。闻言不信，聪不明也。","plain":"臀部无皮、行动迟疑；若随羊群而行可免悔，却不肯听劝。","symbolism":"九四进退失据，问题在不信合理意见。","guidance":"行动卡住时听取专业建议，调整方法而非硬撑。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：苋陆夬夬，中行无咎。","original_xiang":"中行无咎，中未光也。","plain":"像铲除苋陆草那样果断去除弊端，持中道便无咎。","symbolism":"九五居尊而近阴，决断仍须中正不偏。","guidance":"处理顽固问题要坚定，但程序必须公平。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：无号，终有凶。","original_xiang":"无号之凶，终不可长也。","plain":"危急时无法呼号求援，最终有凶险。","symbolism":"上六孤立于众阳之上，失去转圜空间。","guidance":"不要等支持尽失才求助，尽早面对风险。","editorial_status":"初稿待人工校对"}],"天风姤":[{"line_index":0,"original_line":"初六：系于金柅，贞吉，有攸往，见凶，羸豕孚踟躅。","original_xiang":"系于金柅，柔道牵也。","plain":"以坚固的金属止车器约束，守正吉；若任意前往则见凶。","symbolism":"初六阴气初生，虽微小却可能渐强，宜早制约。","guidance":"发现初期隐患就设防，别因暂时无害而放任。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：包有鱼，无咎，不利宾。","original_xiang":"包有鱼，义不及宾也。","plain":"袋中有鱼，自己掌握得当无过，但不宜拿去招待宾客。","symbolism":"九二与初六相遇，强调资源或关系须守其分。","guidance":"管理敏感机会时划清权限，不随意外扩。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：臀无肤，其行次且，厉，无大咎。","original_xiang":"其行次且，行未牵也。","plain":"臀部无皮，步履艰难，虽有危险却无大过失。","symbolism":"九三欲遇而不得，受阻反使其免于深陷。","guidance":"机会受阻时不要强求，先保护基本盘。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：包无鱼，起凶。","original_xiang":"无鱼之凶，远民也。","plain":"袋中无鱼，可能引发凶险。","symbolism":"九四远离初六而失其所系，也象征脱离下情。","guidance":"留意基层需求与关键资源流失，及时修复联系。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：以杞包瓜，含章，有陨自天。","original_xiang":"九五含章，中正也。有陨自天，志不舍命也。","plain":"用杞叶包住瓜果，内藏文采；可能有意外机缘从天而降。","symbolism":"九五中正含蓄，能守德待时而不躁进。","guidance":"培育长期实力与声誉，让机会自然成熟。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：姤其角，吝，无咎。","original_xiang":"姤其角，上穷吝也。","plain":"在角端相遇，处境窘迫，但没有重大过失。","symbolism":"上九处姤之极，刚硬而难以相合。","guidance":"不合适的关系不必强求，守住界限即可。","editorial_status":"初稿待人工校对"}],"泽地萃":[{"line_index":0,"original_line":"初六：有孚不终，乃乱乃萃，若号一握为笑，勿恤，往无咎。","original_xiang":"乃乱乃萃，其志乱也。","plain":"有诚信却不能坚持到底，聚合时反而生乱；真诚呼应后可转忧为安。","symbolism":"初位志向不定，群体虽聚而心尚未齐。","guidance":"召集合作伙伴时先统一目标，避免承诺反复。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：引吉，无咎，孚乃利用禴。","original_xiang":"引吉无咎，中未变也。","plain":"受到引导而相聚是吉利的，真诚足以支持简朴的祭礼。","symbolism":"六二守中不变，以信任而非排场建立联结。","guidance":"选择可信的引路人，重视实质诚意。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：萃如，嗟如，无攸利，往无咎，小吝。","original_xiang":"往无咎，上巽也。","plain":"想要聚合却叹息无益；主动前往虽略有不快，仍可免过。","symbolism":"六三难得相应，须放下孤立姿态向外寻求接纳。","guidance":"关系不顺时主动沟通，但别期待立即获得完全认同。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：大吉，无咎。","original_xiang":"大吉无咎，位不当也。","plain":"能够促成大规模且合宜的聚合，便可避免过失。","symbolism":"九四位置未必安稳，聚众须以公心维系正当性。","guidance":"取得支持后更应明确权责，勿凭人多势众行事。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：萃有位，无咎。匪孚，元永贞，悔亡。","original_xiang":"萃有位，志未光也。","plain":"身居聚合的中心虽无过失，若人心未服仍须长久守正。","symbolism":"九五有位而未必有信，权威需要时间赢得认同。","guidance":"领导团队不要只依靠职位，以持续兑现承诺凝聚信任。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：赍咨涕洟，无咎。","original_xiang":"赍咨涕洟，未安上也。","plain":"因难以安居群体之上而忧叹流泪，本身未必构成过失。","symbolism":"上六处聚合之极，孤立与不安暴露关系基础薄弱。","guidance":"发现自己被排除时先修复信任，勿以情绪强求归属。","editorial_status":"初稿待人工校对"}],"地风升":[{"line_index":0,"original_line":"初六：允升，大吉。","original_xiang":"允升大吉，上合志也。","plain":"得到上下认可而向上发展，十分吉利。","symbolism":"初六柔顺而与上方志同，起步虽低却有扶持。","guidance":"起步阶段争取关键支持，按既定路径稳步推进。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：孚乃利用禴，无咎。","original_xiang":"九二之孚，有喜也。","plain":"心怀诚信，即使祭礼简约也可无过。","symbolism":"九二以刚中之德取信于人，不靠繁文缛节。","guidance":"用可靠成果与真诚沟通换取资源，不必过度包装。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：升虚邑。","original_xiang":"升虚邑，无所疑也。","plain":"向上进入空旷的城邑，前路少有阻碍。","symbolism":"九三阳刚得势，所进之处暂时没有明显抵抗。","guidance":"把握顺畅窗口，同时核查看不见的后续风险。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：王用亨于岐山，吉无咎。","original_xiang":"王用亨于岐山，顺事也。","plain":"君王在岐山举行祭礼，顺应礼制则吉而无咎。","symbolism":"六四以柔顺承上，升进须合乎制度与秩序。","guidance":"涉及晋升或扩张时遵循授权和合规程序。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：贞吉，升阶。","original_xiang":"贞吉升阶，大得志也。","plain":"守正便吉，像拾级而上那样逐层升进。","symbolism":"六五居尊而柔中，进展应循序不越级。","guidance":"把大目标拆成可验证的阶段，稳步提升。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：冥升，利于不息之贞。","original_xiang":"冥升在上，消不富也。","plain":"在昏暗中仍一味向上，宜将不息之志用于守正。","symbolism":"上六升至极点，盲目追高容易耗尽积累。","guidance":"达到高位后改以巩固基础为主，警惕无止境扩张。","editorial_status":"初稿待人工校对"}],"泽水困":[{"line_index":0,"original_line":"初六：臀困于株木，入于幽谷，三岁不觌。","original_xiang":"入于幽谷，幽不明也。","plain":"困坐枯木、深入幽谷，长久不见出路。","symbolism":"初六阴暗失位，困境因视野封闭而加深。","guidance":"先恢复信息和外部联络，不要在孤立中做重大决定。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：困于酒食，朱绂方来，利用亨祀，征凶，无咎。","original_xiang":"困于酒食，中有庆也。","plain":"虽有饮食却感受困顿，尊贵援助将至；躁进不利。","symbolism":"九二刚中而困，资源不缺但行动时机未到。","guidance":"保留实力并等待合适支持，避免为求突破而冒险。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：困于石，据于蒺藜，入于其宫，不见其妻，凶。","original_xiang":"据于蒺藜，乘刚也。入于其宫，不见其妻，不祥也。","plain":"被石头阻挡又依靠荆棘，回家也失去依托，凶险。","symbolism":"六三进退失据，所倚靠之物反成伤害。","guidance":"停止依赖不可靠的安排，优先排除多重风险。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：来徐徐，困于金车，吝，有终。","original_xiang":"来徐徐，志在下也。虽不当位，有与也。","plain":"援助来得迟缓，受车马牵制，虽有遗憾终能相聚。","symbolism":"九四志在下应，却受现实条件阻滞。","guidance":"协调资源与时间，勿因支援延迟就轻易放弃。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：劓刖，困于赤绂，乃徐有说，利用祭祀。","original_xiang":"劓刖，志未得也。乃徐有说，以中直也。利用祭祀，受福也。","plain":"处处受限，后来逐渐得到舒解；守中正可转困。","symbolism":"九五尊位亦受困，转机来自公正与持守。","guidance":"压力之下坚持公平透明，逐步重建合作信心。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：困于葛藟，于臲卼，曰动悔。有悔，征吉。","original_xiang":"困于葛藟，未当也。动悔，有悔，吉行也。","plain":"被藤蔓缠绕而摇摇欲坠，觉察行动的悔意后前进可吉。","symbolism":"上六困极将变，真正的突破从反省旧路径开始。","guidance":"承认策略失效并调整行动，勿因怕犯错而停滞。","editorial_status":"初稿待人工校对"}],"水风井":[{"line_index":0,"original_line":"初六：井泥不食，旧井无禽。","original_xiang":"井泥不食，下也。旧井无禽，时舍也。","plain":"井底淤泥无法饮用，废旧之井连鸟也不来。","symbolism":"初六处井底而失用，价值因长期荒废无法发挥。","guidance":"先整顿基础设施与数据质量，再谈扩大服务。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：井谷射鲋，瓮敝漏。","original_xiang":"井谷射鲋，无与也。","plain":"井水只能射及小鱼，汲水的陶瓮又破漏。","symbolism":"九二有资源却缺少配合与可用的输送工具。","guidance":"排查渠道和执行机制，避免资源在交付环节流失。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：井渫不食，为我心恻，可用汲，王明，并受其福。","original_xiang":"井渫不食，行恻也。求王明，受福也。","plain":"井已清洁却无人取水，令人惋惜；得明主赏识可共受益。","symbolism":"九三有才有用而未被发现，关键在识别与任用。","guidance":"主动展示已准备好的能力，争取合适的使用场景。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：井甃，无咎。","original_xiang":"井甃无咎，修井也。","plain":"修砌井壁，使井得以继续使用，没有过失。","symbolism":"六四重在修护结构，暂不求立刻出成果。","guidance":"投入必要的维护和流程改造，为长期使用打底。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：井冽，寒泉食。","original_xiang":"寒泉之食，中正也。","plain":"井水清冽，寒泉可以饮用。","symbolism":"九五中正而供养众人，资源终于发挥公共价值。","guidance":"确保服务品质稳定，让真正需要的人方便使用。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：井收勿幕，有孚元吉。","original_xiang":"元吉在上，大成也。","plain":"井已成而不加遮盖，怀诚信分享，十分吉利。","symbolism":"上六象征资源开放共享，成功不应被独占。","guidance":"完善开放规则，让成果持续惠及更多使用者。","editorial_status":"初稿待人工校对"}],"泽火革":[{"line_index":0,"original_line":"初九：巩用黄牛之革。","original_xiang":"巩用黄牛，不可以有为也。","plain":"用黄牛皮牢牢束缚，当前不宜贸然改变。","symbolism":"初九居革之始，时机未熟应先稳住基本盘。","guidance":"重大改革前先确认共识、风险和必要条件。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：巳日乃革之，征吉，无咎。","original_xiang":"巳日革之，行有嘉也。","plain":"到了适当时日再实行改革，出行吉而无咎。","symbolism":"六二中正且得应，变革具备正当时机。","guidance":"等关键条件到位再启动，避免仓促发布。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：征凶，贞厉，革言三就，有孚。","original_xiang":"革言三就，又何之矣。","plain":"急于前进有凶险；改革方案反复讨论确认后才可信。","symbolism":"九三处变革躁动之位，强调多次审议与共识。","guidance":"重要制度调整至少经过充分论证和利益相关方沟通。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：悔亡，有孚改命，吉。","original_xiang":"改命之吉，信志也。","plain":"悔意消散，凭诚信更改旧命令，吉利。","symbolism":"九四以信服人，改变制度需要可信的执行者。","guidance":"公开说明改革理由与责任分工，建立可追踪的承诺。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：大人虎变，未占有孚。","original_xiang":"大人虎变，其文炳也。","plain":"有德之人的改革如虎纹鲜明，不占问也令人信服。","symbolism":"九五居中正，变革成效显著且可被看见。","guidance":"以透明成果证明改革价值，而非仅靠宣传。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：君子豹变，小人革面，征凶，居贞吉。","original_xiang":"君子豹变，其文蔚也。小人革面，顺以从君也。","plain":"君子变化如豹纹细致，小人仅改外貌；继续强攻不利。","symbolism":"上六革成之后，表面服从与内在转化仍有差别。","guidance":"改革落地后转向巩固文化和机制，避免不停折腾。","editorial_status":"初稿待人工校对"}],"火风鼎":[{"line_index":0,"original_line":"初六：鼎颠趾，利出否，得妾以其子，无咎。","original_xiang":"鼎颠趾，未悖也。利出否，以从贵也。","plain":"鼎脚朝上有利于倒出污秽，虽形式反常却能除旧纳新。","symbolism":"初六以颠倒之象清除杂质，为承载新物创造条件。","guidance":"改造开始先清理积弊，不要只顾维持旧形式。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：鼎有实，我仇有疾，不我能即，吉。","original_xiang":"鼎有实，慎所之也。我仇有疾，终无尤也。","plain":"鼎中有实物，敌对者有病难以靠近，吉利。","symbolism":"九二有真实才干，但须谨慎选择往来对象。","guidance":"守住核心能力，防止无谓争执损害成果。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。","original_xiang":"鼎耳革，失其义也。","plain":"鼎耳改变导致搬运受阻，美食暂不能享用，终能转吉。","symbolism":"九三能力与配套不匹配，须待条件调整。","guidance":"发现交付环节不通时先修复接口，不要急着推出产品。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：鼎折足，覆公𫗧，其形渥，凶。","original_xiang":"覆公𫗧，信如何也。","plain":"鼎足折断，贵重食物倾覆，十分凶险。","symbolism":"九四承载责任超出能力，失信来自关键结构失效。","guidance":"重要项目先核查承载能力、负责人和备援方案。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：鼎黄耳金铉，利贞。","original_xiang":"鼎黄耳，中以为实也。","plain":"鼎配黄色的耳和金属横杠，守正有利。","symbolism":"六五柔中得位，良好器具象征恰当用人与制度。","guidance":"建立稳健的治理结构，让能力与职责匹配。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：鼎玉铉，大吉，无不利。","original_xiang":"玉铉在上，刚柔节也。","plain":"鼎配玉制横杠，大吉而无不利。","symbolism":"上九刚柔有节，成熟体系兼具力量与温润。","guidance":"成果成熟后继续保持质量标准与适度弹性。","editorial_status":"初稿待人工校对"}],"震为雷":[{"line_index":0,"original_line":"初九：震来虩虩，后笑言哑哑，吉。","original_xiang":"震来虩虩，恐致福也。笑言哑哑，后有则也。","plain":"雷声骤起令人惊惧，随后能从容谈笑，吉利。","symbolism":"初九因警惕而能修正行为，恐惧转化为秩序。","guidance":"突发事件先启动预案，稳住后再恢复正常节奏。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：震来厉，亿丧贝，跻于九陵，勿逐，七日得。","original_xiang":"震来厉，乘刚也。","plain":"震动带来危险与财物损失，暂避高处，不必追逐，终会复得。","symbolism":"六二受强震冲击，退避保全比即时追回更重要。","guidance":"发生重大波动时先保障安全与流动性，勿盲目追损。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：震苏苏，震行无眚。","original_xiang":"震苏苏，位不当也。","plain":"受震而惶惶不安，若及时行动便可免灾。","symbolism":"六三位置不稳，恐惧需转化为合宜行动。","guidance":"不要僵在焦虑中，尽快采取可控的应急措施。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：震遂泥。","original_xiang":"震遂泥，未光也。","plain":"震动陷入泥沼，难以施展。","symbolism":"九四阳刚却受阻，力量陷于迟滞。","guidance":"识别拖累执行的环节，避免在低效路径上反复投入。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：震往来厉，亿无丧，有事。","original_xiang":"震往来厉，危行也。其事在中，大无丧也。","plain":"震动往来皆险，但守住要事，仍可免重大损失。","symbolism":"六五居中持重，关键是危机中不失核心职责。","guidance":"明确优先级，先保护最重要的业务和关系。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。","original_xiang":"震索索，中未得也。虽凶无咎，畏邻戒也。","plain":"惊惧到目光游移，贸然前行凶；见邻近预警先防范可免过。","symbolism":"上六震极而乱，善用外部征兆才能避险。","guidance":"关注同行或邻近风险信号，提前预防而非事后惊慌。","editorial_status":"初稿待人工校对"}],"艮为山":[{"line_index":0,"original_line":"初六：艮其趾，无咎，利永贞。","original_xiang":"艮其趾，未失正也。","plain":"在脚趾处止住行动，没有过失，长期守正有利。","symbolism":"初六止于行动未起之际，容易控制风险。","guidance":"发现方向不对就及早暂停，避免小错滚成大错。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：艮其腓，不拯其随，其心不快。","original_xiang":"不拯其随，未退听也。","plain":"止住小腿却无法带动随行者，内心不快。","symbolism":"六二自身愿停，相关方却未同步，造成挫折。","guidance":"暂停项目时先协调团队，不要只下个人决定。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：艮其限，列其夤，厉熏心。","original_xiang":"艮其限，危熏心也。","plain":"强行止住腰部，使脊背紧张，危险逼迫内心。","symbolism":"九三过度僵硬，强制压抑反而伤及自身。","guidance":"控制风险也要留出调整空间，避免一刀切。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：艮其身，无咎。","original_xiang":"艮其身，止诸躬也。","plain":"止住身体，使自己安定，无过失。","symbolism":"六四将约束落实于自身，不越界干涉他人。","guidance":"先管好职责范围内的行为和承诺。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：艮其辅，言有序，悔亡。","original_xiang":"艮其辅，以中正也。","plain":"节制口舌，使言语有次序，悔意消散。","symbolism":"六五居中，慎言与表达秩序能减少失误。","guidance":"敏感沟通先整理事实与措辞，再对外表态。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：敦艮，吉。","original_xiang":"敦艮之吉，以厚终也。","plain":"以敦厚坚定之德完成止息，吉利。","symbolism":"上九止于至善，不是消极不动而是守住分寸。","guidance":"在需要收尾时果断结束，并保留体面与善意。","editorial_status":"初稿待人工校对"}],"风山渐":[{"line_index":0,"original_line":"初六：鸿渐于干，小子厉，有言，无咎。","original_xiang":"小子之厉，义无咎也。","plain":"鸿雁渐进至水边，年轻者有危险和议论，但无过失。","symbolism":"初六渐进之始基础未稳，外界质疑难免。","guidance":"初期试点先控制规模，用时间积累信任。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：鸿渐于磐，饮食衎衎，吉。","original_xiang":"饮食衎衎，不素饱也。","plain":"鸿雁渐至磐石，饮食安乐，吉利。","symbolism":"六二得中而安稳，成长建立在踏实供养上。","guidance":"稳住团队与资源，让进展有可持续基础。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。","original_xiang":"夫征不复，离群丑也。妇孕不育，失其道也。利用御寇，顺相保也。","plain":"鸿雁渐至高陆，冒进者难返，家业受损；宜守御。","symbolism":"九三离群躁进，过快扩张可能破坏内外平衡。","guidance":"高风险扩张前先保护核心业务与家庭责任。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：鸿渐于木，或得其桷，无咎。","original_xiang":"或得其桷，顺以巽也。","plain":"鸿雁渐至树上，找到平稳的枝桠，免过失。","symbolism":"六四身处不易立足之地，懂得择位而安。","guidance":"在陌生环境中寻找适配的岗位或合作方式。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：鸿渐于陵，妇三岁不孕，终莫之胜，吉。","original_xiang":"终莫之胜，吉；得所愿也。","plain":"鸿雁渐至高陵，虽久受阻，终无人能阻其愿，吉利。","symbolism":"九五居正而暂隔，坚守正当关系终可相合。","guidance":"面对长期延迟，持续改善条件而非轻易否定目标。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：鸿渐于陆，其羽可用为仪，吉。","original_xiang":"其羽可用为仪，吉；不可乱也。","plain":"鸿雁飞至高处，其羽毛可作礼仪装饰，吉利。","symbolism":"上九进德至成，留下可供他人效法的规范。","guidance":"把成熟经验沉淀为制度和榜样，形成长期影响。","editorial_status":"初稿待人工校对"}],"雷泽归妹":[{"line_index":0,"original_line":"初九：归妹以娣，跛能履，征吉。","original_xiang":"归妹以娣，以恒也。跛能履吉，相承也。","plain":"少女以陪嫁身份出嫁，虽行动不便仍能前行而吉。","symbolism":"初九处从属之位，能力有限仍可发挥辅助作用。","guidance":"认清自身定位，先做好可胜任的支持工作。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：眇能视，利幽人之贞。","original_xiang":"利幽人之贞，未变常也。","plain":"一只眼仍能看见，守静独处而正直有利。","symbolism":"九二虽条件不足，仍不失内在操守。","guidance":"信息或资源不全时保持原则，不因急于求成而妥协。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：归妹以须，反归以娣。","original_xiang":"归妹以须，未当也。","plain":"出嫁身份未得其宜，退而以较低身份随行。","symbolism":"六三求位不当，必须重新评估期望与现实。","guidance":"合作条件不匹配时调整角色，避免强求不适当的安排。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：归妹愆期，迟归有时。","original_xiang":"愆期之志，有待而行也。","plain":"婚期延误，迟嫁自有合适时机。","symbolism":"九四宁待其时，不因外部催促仓促结合。","guidance":"重要合作或关系未成熟时允许延期。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：帝乙归妹，其君之袂，不如其娣之袂良，月几望，吉。","original_xiang":"帝乙归妹，不如其娣之袂良也。其位在中，以贵行也。","plain":"帝乙嫁妹，尊贵者衣饰反不如随从华丽；月近圆满而吉。","symbolism":"六五贵在中德而非外饰，合宜关系重实质。","guidance":"评估伙伴重视价值观与实际契合，不以排场定高下。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：女承筐无实，士刲羊无血，无攸利。","original_xiang":"上六无实，承虚筐也。","plain":"女子捧空筐，男子宰羊无血，徒具仪式而无益。","symbolism":"上六关系有名无实，形式不能替代真正承担。","guidance":"核实双方投入与交付，警惕空头承诺。","editorial_status":"初稿待人工校对"}],"雷火丰":[{"line_index":0,"original_line":"初九：遇其配主，虽旬无咎，往有尚。","original_xiang":"虽旬无咎，过旬灾也。","plain":"遇到相配的主事者，短期相处无过，继续前往值得肯定。","symbolism":"初九与合适伙伴相应，但良好契合亦有时限。","guidance":"合作初期确认共同目标和期限，勿以一时顺利代替长期安排。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：丰其蔀，日中见斗，往得疑疾，有孚发若，吉。","original_xiang":"有孚发若，信以发志也。","plain":"遮蔽过盛，正午竟见北斗；贸然前往招疑，凭诚信才能打开局面。","symbolism":"盛大表象反而遮光，六二须靠诚意破除隔阂。","guidance":"资讯不透明时先建立信任、公开依据，避免强行推进。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：丰其沛，日中见沫，折其右肱，无咎。","original_xiang":"丰其沛，不可大事也。折其右肱，终不可用也。","plain":"遮蔽深重，白昼昏暗如见小星，右臂受损却无咎。","symbolism":"关键执行力量受阻，不宜承担重大任务。","guidance":"若核心资源暂不可用，应缩小计划范围并调整分工。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：丰其蔀，日中见斗，遇其夷主，吉。","original_xiang":"丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主，吉；行也。","plain":"盛大却受遮蔽，正午如夜；遇到志同道合的主人便吉。","symbolism":"九四处位不当，需借助平等可信的伙伴走出昏暗。","guidance":"在判断不清时寻求有经验且目标一致的合作者。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：来章，有庆誉，吉。","original_xiang":"六五之吉，有庆也。","plain":"招来有文采、有德行的人，获得庆贺与声誉，吉。","symbolism":"六五以开放态度延揽贤才，使丰盛转化为共同成果。","guidance":"主动听取专业意见，让功劳与机会得到合理分享。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。","original_xiang":"丰其屋，天际翔也。窥其户，阒其无人，自藏也。","plain":"房屋虽大却遮蔽门户，家中寂静无人，长期隔绝而凶。","symbolism":"丰极转为自我封闭，外在规模无法弥补关系断裂。","guidance":"警惕过度扩张后的孤立，及时恢复沟通与真实连接。","editorial_status":"初稿待人工校对"}],"火山旅":[{"line_index":0,"original_line":"初六：旅琐琐，斯其所取灾。","original_xiang":"旅琐琐，志穷灾也。","plain":"旅途中纠缠琐碎小事，反而招来灾患。","symbolism":"初六处异地弱势，眼界狭窄会放大风险。","guidance":"出行或新环境中先顾安全和重要事项，少计较枝节。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：旅即次，怀其资，得童仆贞。","original_xiang":"得童仆贞，终无尤也。","plain":"旅人找到住处、保有资财，也得到忠实随从。","symbolism":"六二得中，安顿、资源与可靠支持同时具备。","guidance":"先安排住宿、资金和可信协助，再展开下一步。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：旅焚其次，丧其童仆，贞厉。","original_xiang":"旅焚其次，亦以伤矣。以旅与下，其义丧也。","plain":"旅舍被焚、随从离去，即使坚持也有危险。","symbolism":"九三刚躁失和，连暂时依靠也可能丧失。","guidance":"避免在陌生环境强硬对待伙伴，立即建立备用方案。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：旅于处，得其资斧，我心不快。","original_xiang":"旅于处，未得位也。得其资斧，心未快也。","plain":"旅居有处，得到钱财和工具，心里仍不舒畅。","symbolism":"九四虽有物质保障，却尚未找到真正归属。","guidance":"区分短期落脚与长期定位，别因条件尚可便忽视内心顾虑。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：射雉一矢亡，终以誉命。","original_xiang":"终以誉命，上逮也。","plain":"射雉损失一支箭，最终赢得赞誉与任命。","symbolism":"六五愿付出有限代价，换来更高层次的认可。","guidance":"评估合理投入，重视信誉与长期机会，不只计算眼前得失。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。","original_xiang":"以旅在上，其义焚也。丧牛于易，终莫之闻也。","plain":"鸟巢焚毁，旅人先笑后哭，又轻易失牛，凶。","symbolism":"上九居高忘危，失去栖身处和重要资产。","guidance":"顺境中仍须看管根本资源，勿轻率冒险或得意忘形。","editorial_status":"初稿待人工校对"}],"巽为风":[{"line_index":0,"original_line":"初六：进退，利武人之贞。","original_xiang":"进退，志疑也。利武人之贞，志治也。","plain":"进退犹豫，宜效法武人守定原则。","symbolism":"初六柔弱多疑，需要明确纪律来稳定意志。","guidance":"选定判断标准与行动边界，避免反复改变决定。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：巽在床下，用史巫纷若，吉无咎。","original_xiang":"纷若之吉，得中也。","plain":"谦顺至床下，借史巫多方祈问，吉而无咎。","symbolism":"九二得中，以审慎求证化解隐忧，而非盲从。","guidance":"遇到不确定事项可多渠道核实，但须汇总为清晰结论。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：频巽，吝。","original_xiang":"频巽之吝，志穷也。","plain":"一再低头顺从，终有羞吝。","symbolism":"九三过度退让而失去自主，柔顺变成无原则。","guidance":"合作时保留底线，不要为了讨好而不断改口。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：悔亡，田获三品。","original_xiang":"田获三品，有功也。","plain":"悔恨消失，狩猎获得三类猎物。","symbolism":"六四顺势而行并取得实绩，柔顺不等于无所作为。","guidance":"以可衡量成果证明调整有效，巩固合作信心。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。","original_xiang":"九五之吉，位正中也。","plain":"守正吉利，悔消且诸事有利；开头未佳，充分筹划后可善终。","symbolism":"九五中正，改革须有前期准备和事后检验。","guidance":"重要变更设置实施前评估及实施后复盘，勿求一步到位。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：巽在床下，丧其资斧，贞凶。","original_xiang":"巽在床下，上穷也。丧其资斧，正乎凶也。","plain":"谦伏到床下却丢失资财与工具，固执下去有凶。","symbolism":"上九顺从过度，连自主行动能力也失去。","guidance":"若让步已损及关键资源，应及时停止并重建边界。","editorial_status":"初稿待人工校对"}],"兑为泽":[{"line_index":0,"original_line":"初九：和兑，吉。","original_xiang":"和兑之吉，行未疑也。","plain":"以和善的方式表达喜悦，吉。","symbolism":"初九喜悦出于坦荡，不靠迎合换取好感。","guidance":"以真诚友善开启沟通，避免隐藏目的。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：孚兑，吉，悔亡。","original_xiang":"孚兑之吉，信志也。","plain":"凭诚信获得喜悦，吉，悔恨消散。","symbolism":"九二刚中，内在可信使关系稳定。","guidance":"兑现承诺比营造气氛更能建立长期互信。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：来兑，凶。","original_xiang":"来兑之凶，位不当也。","plain":"主动迎合外来的欢悦，凶。","symbolism":"六三位不当，过度求悦容易失去判断。","guidance":"对诱人的邀请或赞美先核实动机，不要急于附和。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：商兑，未宁，介疾有喜。","original_xiang":"九四之喜，有庆也。","plain":"反复斟酌喜悦之事，心神未安；隔离弊病则有喜。","symbolism":"九四在取舍间犹疑，划清不良影响才能安稳。","guidance":"谈判或交友先识别风险因素，再决定是否接受。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：孚于剥，有厉。","original_xiang":"孚于剥，位正当也。","plain":"信任正在剥蚀正道的力量，便有危险。","symbolism":"九五虽居正位，也可能因误信不当对象而受损。","guidance":"关键合作应做尽职核查，不因对方讨喜而降低标准。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：引兑。","original_xiang":"上六引兑，未光也。","plain":"牵引他人追求欢乐。","symbolism":"上六以外在诱导维系欢悦，未必具备真实光明的基础。","guidance":"留意被情绪和群体气氛带着走，回到事实与原则。","editorial_status":"初稿待人工校对"}],"风水涣":[{"line_index":0,"original_line":"初六：用拯马壮，吉。","original_xiang":"初六之吉，顺也。","plain":"借助强健的马及时救援，吉。","symbolism":"初六顺势借力，涣散初起即可获得挽救。","guidance":"危机刚出现时迅速调动可靠资源，不宜拖延。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：涣奔其机，悔亡。","original_xiang":"涣奔其机，得愿也。","plain":"离散之际奔向可依靠的凭几，悔恨消散。","symbolism":"九二寻找稳定支点，先安身再应变。","guidance":"团队动荡时确认核心支持与信息来源。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：涣其躬，无悔。","original_xiang":"涣其躬，志在外也。","plain":"消解对自身的执著，没有悔恨。","symbolism":"六三将关注由个人得失转向外部大局。","guidance":"为共同目标适当放下个人立场，推动问题解决。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：涣其群，元吉。涣有丘，匪夷所思。","original_xiang":"涣其群，元吉；光大也。","plain":"打散小团体，十分吉利；重新凝聚的规模超出想象。","symbolism":"六四破除派系，才能形成更大的共同体。","guidance":"跨部门协作应打通壁垒，避免各自为政。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：涣汗其大号，涣王居，无咎。","original_xiang":"王居无咎，正位也。","plain":"像汗水发散般发布重大号令，王者安居其位，无咎。","symbolism":"九五以公开而明确的政令消解混乱。","guidance":"重大调整要统一口径、清楚说明责任与执行安排。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：涣其血，去逖出，无咎。","original_xiang":"涣其血，远害也。","plain":"使伤害远离，脱离险境，无咎。","symbolism":"上九处涣散终局，以远害保全为优先。","guidance":"面对持续性风险，必要时撤离高危关系或项目。","editorial_status":"初稿待人工校对"}],"水泽节":[{"line_index":0,"original_line":"初九：不出户庭，无咎。","original_xiang":"不出户庭，知通塞也。","plain":"不走出内院，没有过失。","symbolism":"初九知晓通塞，适时克制是明智选择。","guidance":"条件不具备时先守住边界，不必急于公开行动。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：不出门庭，凶。","original_xiang":"不出门庭，失时极也。","plain":"不走出门庭反而凶。","symbolism":"九二有可行动的时机却自我封闭，节制变成错失。","guidance":"当条件成熟时果断推进，别把谨慎当成拖延借口。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：不节若，则嗟若，无咎。","original_xiang":"不节之嗟，又谁咎也。","plain":"不能节制便会叹息，责任在己。","symbolism":"六三放任失衡后才觉后悔，需自省而非怨人。","guidance":"检视预算、时间或情绪管理，及早设定限制。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：安节，亨。","original_xiang":"安节之亨，承上道也。","plain":"安然遵守节度，亨通。","symbolism":"六四顺应合宜制度，节制成为稳定秩序。","guidance":"建立大家都能执行的规则，而非临时加码。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：甘节，吉；往有尚。","original_xiang":"甘节之吉，居位中也。","plain":"甘于适度节制，吉，前行受推崇。","symbolism":"九五居中，使限制合理且易于接受。","guidance":"制度设计应兼顾效率与人性，让约束服务目标。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：苦节，贞凶，悔亡。","original_xiang":"苦节贞凶，其道穷也。","plain":"节制过苦，固守则凶，虽可免悔。","symbolism":"上六把节制推向极端，失去可持续性。","guidance":"发现规则造成过重负担时及时调整，不要以严苛为美德。","editorial_status":"初稿待人工校对"}],"风泽中孚":[{"line_index":0,"original_line":"初九：虞吉，有他不燕。","original_xiang":"初九虞吉，志未变也。","plain":"先有戒备与准备则吉；若另有牵挂便难安宁。","symbolism":"初九诚信须专一，分心会动摇关系基础。","guidance":"建立合作前厘清承诺和潜在利益冲突。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：鸣鹤在阴，其子和之，我有好爵，吾与尔靡之。","original_xiang":"其子和之，中心愿也。","plain":"鹤在幽处鸣叫，幼鹤回应；美酒愿与人共享。","symbolism":"九二内在诚意自然引发共鸣，不靠外在强迫。","guidance":"以坦诚沟通与成果分享培养自发的信任。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：得敌，或鼓或罢，或泣或歌。","original_xiang":"可鼓或罢，位不当也。","plain":"遇到对手，时而击鼓时而停下，时哭时歌。","symbolism":"六三受外部关系牵动，情绪与行动反复无常。","guidance":"争议期间保持判断稳定，避免被对方节奏左右。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：月几望，马匹亡，无咎。","original_xiang":"马匹亡，绝类上也。","plain":"月亮接近圆满，失去马匹伙伴却无咎。","symbolism":"六四为向上守正而脱离旧有同类牵连。","guidance":"必要时放下不合适的联盟，维护更重要的诚信原则。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：有孚挛如，无咎。","original_xiang":"有孚挛如，位正当也。","plain":"诚信把众人紧密联结，无咎。","symbolism":"九五中正，以真实信任形成稳固凝聚力。","guidance":"领导团队应以一致行动兑现承诺，减少形式化口号。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：翰音登于天，贞凶。","original_xiang":"翰音登于天，何可长也。","plain":"鸟鸣声高扬至天，执意如此则凶。","symbolism":"上九声势超过实际，诚信沦为夸大宣称。","guidance":"不要过度宣传尚未实现的成果，让证据跟得上承诺。","editorial_status":"初稿待人工校对"}],"雷山小过":[{"line_index":0,"original_line":"初六：飞鸟以凶。","original_xiang":"飞鸟以凶，不可如何也。","plain":"飞鸟一味高飞，招致凶险。","symbolism":"初六躁进越过适宜尺度，难以挽回。","guidance":"起步阶段先控制目标高度，勿因小成而冒进。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：过其祖，遇其妣；不及其君，遇其臣；无咎。","original_xiang":"不及其君，臣不可过也。","plain":"越过祖父而遇祖母；未及君主而遇臣属，无咎。","symbolism":"六二懂得尊卑分寸，宁取合宜而不强求越级。","guidance":"沟通与审批按合适层级进行，避免绕过必要程序。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：弗过防之，从或戕之，凶。","original_xiang":"从或戕之，凶如何也。","plain":"若不加强防范，跟从者可能伤害自己，凶。","symbolism":"九三刚强而失警惕，近处隐患尤其危险。","guidance":"对熟悉的人事也保留必要审查与防护。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：无咎，弗过遇之。往厉必戒，勿用永贞。","original_xiang":"弗过遇之，位不当也。往厉必戒，终不可长也。","plain":"不越分而相遇可无咎；继续前往危险，须警戒，不宜长期固执。","symbolism":"九四处变动位置，守分与适时调整同样重要。","guidance":"风险上升时设置退出条件，不把临时策略固定化。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：密云不雨，自我西郊，公弋取彼在穴。","original_xiang":"密云不雨，已上也。","plain":"浓云不下雨；君王射取藏在洞穴中的猎物。","symbolism":"六五力量尚未化为普遍成效，应先处理局部具体问题。","guidance":"大目标暂未实现时，从可掌控的小范围突破。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：弗遇过之，飞鸟离之，凶，是谓灾眚。","original_xiang":"弗遇过之，已亢也。","plain":"错过相遇反而飞越过头，如鸟遭网罗，凶。","symbolism":"上六越界至极，过度追求反致灾患。","guidance":"若已偏离原定边界，应立即停止升级承诺。","editorial_status":"初稿待人工校对"}],"水火既济":[{"line_index":0,"original_line":"初九：曳其轮，濡其尾，无咎。","original_xiang":"曳其轮，义无咎也。","plain":"拖住车轮、尾巴沾湿，仍无过失。","symbolism":"初九在已成之局谨慎起步，宁慢勿失。","guidance":"项目交付后仍要控制节奏，防止最后阶段出错。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"六二：妇丧其茀，勿逐，七日得。","original_xiang":"七日得，以中道也。","plain":"妇人丢失车帘，不必追赶，七日后可复得。","symbolism":"六二守中，不因短暂损失打乱正道。","guidance":"对可恢复的小损失先评估等待成本，避免冲动追逐。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"九三：高宗伐鬼方，三年克之，小人勿用。","original_xiang":"三年克之，惫也。","plain":"高宗征讨鬼方，历时三年才取胜；不可任用小人。","symbolism":"九三大事虽成仍耗费巨大，选人不当会败坏成果。","guidance":"长期攻坚要审视资源消耗，并严格把关关键人员。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"六四：𦈡有衣袽，终日戒。","original_xiang":"终日戒，有所疑也。","plain":"破旧衣物须备作堵漏，整日保持警戒。","symbolism":"六四在稳定表象下预见隐患，防患未然。","guidance":"建立维护、应急与持续监控机制，不因成功放松。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"九五：东邻杀牛，不如西邻之禴祭，实受其福。","original_xiang":"东邻杀牛，不如西邻之时也；实受其福，吉大来也。","plain":"东邻厚祭杀牛，不如西邻适时薄祭，后者实得福。","symbolism":"九五强调时机与诚意胜过铺张规模。","guidance":"重要行动选择合适窗口，重实效而非预算排场。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上六：濡其首，厉。","original_xiang":"濡其首厉，何可久也。","plain":"渡水时连头也浸湿，危险。","symbolism":"上六既济之极而忘记止步，成功后反生风险。","guidance":"达成目标后适时收束，不要无止境加码。","editorial_status":"初稿待人工校对"}],"火水未济":[{"line_index":0,"original_line":"初六：濡其尾，吝。","original_xiang":"濡其尾，亦不知极也。","plain":"渡水时尾巴沾湿，令人遗憾。","symbolism":"初六尚未完成准备便急进，能力与时机不相称。","guidance":"启动前核查条件和风险，先补足短板。","editorial_status":"初稿待人工校对"},{"line_index":1,"original_line":"九二：曳其轮，贞吉。","original_xiang":"九二贞吉，中以行正也。","plain":"拖住车轮，守正则吉。","symbolism":"九二刚中而能自我节制，以稳健方式前进。","guidance":"关键阶段适当减速，确保资源与方向一致。","editorial_status":"初稿待人工校对"},{"line_index":2,"original_line":"六三：未济，征凶，利涉大川。","original_xiang":"未济征凶，位不当也。","plain":"尚未渡成，贸然远征凶；但有利于渡过大河。","symbolism":"六三位不当，直冲不利，充分组织后方可跨越大险。","guidance":"区分盲目出发与有准备的突破，先制定可执行方案。","editorial_status":"初稿待人工校对"},{"line_index":3,"original_line":"九四：贞吉，悔亡，震用伐鬼方，三年有赏于大国。","original_xiang":"贞吉悔亡，志行也。","plain":"守正吉、悔消；奋力征讨多年，终获大国赏赐。","symbolism":"九四以长期坚定行动完成艰难任务。","guidance":"复杂转型需要持续投入和阶段性验证，勿求速胜。","editorial_status":"初稿待人工校对"},{"line_index":4,"original_line":"六五：贞吉，无悔，君子之光，有孚，吉。","original_xiang":"君子之光，其晖吉也。","plain":"守正吉，无悔；君子光明而诚信，吉。","symbolism":"六五以德与信用照亮未成之局，赢得支持。","guidance":"关键领导者公开原则、兑现承诺，带领团队走向完成。","editorial_status":"初稿待人工校对"},{"line_index":5,"original_line":"上九：有孚于饮酒，无咎，濡其首，有孚失是。","original_xiang":"饮酒濡首，亦不知节也。","plain":"诚信相聚饮酒无咎；若醉至头湿，便失去应有分寸。","symbolism":"上九临近完成而易纵乐失节，信任也须有界限。","guidance":"庆祝阶段仍要管好风险和责任，避免功亏一篑。","editorial_status":"初稿待人工校对"}]};

<script id="xinggui-xunkong-live-remain">
(function(){'use strict';
const stems='甲乙丙丁戊己庚辛壬癸',branches='子丑寅卯辰巳午未申酉戌亥';
const ganzhi=Array.from({length:60},(_,i)=>stems[i%10]+branches[i%12]);
const xun=['甲子旬','甲戌旬','甲申旬','甲午旬','甲辰旬','甲寅旬'];
const empty=['戌亥','申酉','午未','辰巳','寅卯','子丑'];
function mount(){
 const group=document.getElementById('xinggui-liuyao-date-controls');
 const pillar=document.getElementById('liuyao-day-pillar');
 const stem=document.getElementById('day-stem');
 if(!group||!pillar||!stem)return false;
 let panel=document.getElementById('xinggui-xunkong-live');
 if(!panel){panel=document.createElement('div');panel.id='xinggui-xunkong-live';panel.setAttribute('role','status');panel.setAttribute('aria-live','polite');group.insertAdjacentElement('afterend',panel)}
 function update(){
  const v=pillar.value,idx=ganzhi.indexOf(v);
  if(idx<0){panel.innerHTML='<b>日旬空：</b><strong>未计算</strong><span class="xk-secondary">请选择日柱后立即显示，无需先起卦</span>';return;}
  const index=Math.floor(idx/10);
  panel.innerHTML='<b>当前日柱：</b><strong>'+v+'</strong>　<b>日旬空：</b><strong>'+empty[index]+'</strong><span class="xk-secondary">'+xun[index]+' · 按所选日柱计算</span>';
 }
 if(!panel.dataset.bound){
  panel.dataset.bound='1';
  pillar.addEventListener('change',function(){
   if(pillar.value&&stem.value!==pillar.value[0]){
    stem.value=pillar.value[0];
    stem.dispatchEvent(new Event('change',{bubbles:true}));
   }
   update();
  });
  stem.addEventListener('change',update);
  document.getElementById('clear')?.addEventListener('click',function(){setTimeout(update,0)});
  document.getElementById('history')?.addEventListener('click',function(){setTimeout(update,0)});
  const observer=new MutationObserver(update);
  observer.observe(pillar,{attributes:true,attributeFilter:['value']});
  // 草稿恢复可能直接赋值，不触发 change；在草稿点击后延后更新。
 }
 update();return true;
}
function start(){if(mount())return;const observer=new MutationObserver(()=>{if(mount())observer.disconnect()});observer.observe(document.body,{subtree:true,childList:true});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script><script id="xinggui-day-pillar-stem-filter-remain">
(function(){'use strict';
function start(){
 const stem=document.getElementById('day-stem');
 const pillar=document.getElementById('liuyao-day-pillar');
 if(!stem||!pillar)return false;
 if(pillar.dataset.stemFilterReady)return true;
 pillar.dataset.stemFilterReady='1';
 // Cache the complete original 60 JiaZi options once. Do not alter their values.
 const all=Array.from(pillar.options).map(o=>({value:o.value,text:o.textContent}));
 function refresh(){
  const selected=pillar.value;
  const allowed=all.filter(o=>!o.value||!stem.value||o.value.startsWith(stem.value));
  pillar.replaceChildren(...allowed.map(o=>new Option(o.text,o.value)));
  const retained=allowed.some(o=>o.value===selected);
  pillar.value=retained?selected:'';
  if(!retained)pillar.dispatchEvent(new Event('change',{bubbles:true}));
 }
 function restoreAll(){
  const selected=pillar.value;
  pillar.replaceChildren(...all.map(o=>new Option(o.text,o.value)));
  pillar.value=selected;
 }
 stem.addEventListener('change',refresh);
 // Existing draft opener sets the day pillar and stem programmatically.
 // Temporarily restore all options before it runs, then filter after restore.
 const history=document.getElementById('history');
 if(history)history.addEventListener('click',function(e){
  if(e.target.closest('button')){restoreAll();setTimeout(refresh,0)}
 },true);
 refresh();return true;
}
function init(){if(start())return;const mo=new MutationObserver(()=>{if(start())mo.disconnect()});mo.observe(document.body,{childList:true,subtree:true});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<script id="xinggui-calendar-mode-script">
(function(){'use strict';
window.XingguiLiuyaoCalendarMode='auto';
function start(){
 const pillar=document.getElementById('liuyao-day-pillar');
 const month=document.getElementById('liuyao-month-branch');
 const stem=document.getElementById('day-stem');
 const group=document.getElementById('xinggui-liuyao-date-controls');
 if(!pillar||!month||!stem||!group)return false;
 const stemLabel=stem.closest('label');if(stemLabel)stemLabel.style.display='';
 let panel=document.getElementById('xinggui-calendar-mode');
 if(!panel){
  panel=document.createElement('section');panel.id='xinggui-calendar-mode';
  panel.innerHTML='<b>六爻日月依据</b><div class="mode-options"><label><input type="radio" name="xinggui-calendar-mode" value="auto" checked>自动历法（正常起卦）</label><label><input type="radio" name="xinggui-calendar-mode" value="manual">手动指定日月（研究／历史卦例）</label></div><div class="mode-note" id="xinggui-mode-note" role="status"></div>';
  group.before(panel);
 }
 const note=panel.querySelector('#xinggui-mode-note');
 function applyAuto(){
  const d=window.XingguiLiuyaoVerifiedCalendar;
  if(!d){note.textContent='正在等待服务器历法结果；取得后自动采用日柱、月建并计算旬空。';return;}
  stem.value=d.day[0];stem.dispatchEvent(new Event('change',{bubbles:true}));
  pillar.value=d.day;pillar.dispatchEvent(new Event('change',{bubbles:true}));
  month.value=d.month_branch;month.dispatchEvent(new Event('change',{bubbles:true}));
  note.textContent='自动采用：'+d.day+'日 · '+d.month_branch+'月；六神、旬空和月令按此计算。';
 }
 function render(){
  const mode=window.XingguiLiuyaoCalendarMode;
  panel.dataset.mode=mode;
  panel.querySelectorAll('input[type=radio]').forEach(r=>r.checked=r.value===mode);
  if(mode==='auto')applyAuto();
  else note.textContent='研究模式：先选日干筛选对应的6个日柱，再选日柱与月建；日旬空即时计算，不改写服务器历法参考。';
 }
 panel.addEventListener('change',function(e){
  if(e.target.name!=='xinggui-calendar-mode')return;
  window.XingguiLiuyaoCalendarMode=e.target.value;
  if(e.target.value==='manual'){
   pillar.value='';pillar.dispatchEvent(new Event('change',{bubbles:true}));
   month.value='';month.dispatchEvent(new Event('change',{bubbles:true}));
   stem.value='';stem.dispatchEvent(new Event('change',{bubbles:true}));
  }
  render();
 });
 window.addEventListener('xinggui:liuyao-calendar-ready',function(){if(window.XingguiLiuyaoCalendarMode==='auto')render()});
 window.addEventListener('xinggui:liuyao-draft-restored',function(e){
  const x=e.detail||{};
  // A restored draft with a manually specified pillar is a research session.
  if(pillar.value||month.value){window.XingguiLiuyaoCalendarMode='manual';render();}
 });
 pillar.addEventListener('change',function(){
  if(window.XingguiLiuyaoCalendarMode==='manual'&&pillar.value){
   stem.value=pillar.value[0];stem.dispatchEvent(new Event('change',{bubbles:true}));
  }
 });
 render();return true;
}
function init(){if(start())return;const mo=new MutationObserver(()=>{if(start())mo.disconnect()});mo.observe(document.body,{subtree:true,childList:true})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
