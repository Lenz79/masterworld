<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星轨智盘 · 奇门遁甲</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;padding:12px}.wrap{max-width:1050px;margin:auto}header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#1e293b;padding:12px;border-radius:10px}a{color:#38bdf8}h1{font-size:1.35rem;color:#f59e0b}h2{font-size:1rem;color:#fbbf24}.panel{background:#1e293b;border:1px solid #334155;padding:14px;border-radius:12px;margin-top:12px}.inputs{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:#93c5fd}input,select,textarea{background:#0f172a;color:white;border:1px solid #475569;border-radius:6px;padding:9px;max-width:100%}textarea{width:100%}button{border:0;background:#f59e0b;color:#111827;font-weight:bold;padding:10px 15px;border-radius:7px;cursor:pointer}button.secondary{background:#334155;color:#e2e8f0}.notice{color:#fbbf24;font-size:.83rem;line-height:1.7}.account{color:#34d399;font-weight:bold}.grid9{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.cell{min-height:145px;background:#101b30;border:1px solid #475569;padding:8px;border-radius:7px}.cell .top{display:flex;justify-content:space-between;color:#fbbf24;font-size:.82rem}.cell .mid{font-size:1.1rem;text-align:center;padding:12px 0;color:#7dd3fc}.cell .bottom{font-size:.8rem;color:#cbd5e1}.lines{display:flex;flex-direction:column;gap:8px}.line{display:grid;grid-template-columns:minmax(0,1fr) 115px minmax(0,1fr);gap:8px;align-items:center;background:#101b30;padding:10px;border-radius:7px}.yao{font-size:1.3rem;text-align:center;white-space:nowrap;letter-spacing:2px}.moving{color:#f59e0b}.small{font-size:.8rem;color:#94a3b8}.error{color:#f87171}@media(max-width:600px){.cell{min-height:125px;padding:5px}.cell .mid{font-size:.9rem}.line{grid-template-columns:1fr 80px 1fr;gap:3px;padding:7px}.yao{font-size:1rem;letter-spacing:0}}@media print{button,.notice{display:none}body{background:white;color:black}.panel,.cell,.line{color:black;background:white;border-color:#aaa}}</style></head><body><div class="wrap"><header><a href="index.html">← 返回主页</a><h1>☯️ 奇门遁甲 · 三式排盘工作台</h1><span id="account" class="account">验证登录中…</span></header><div class="panel"><div class="notice">当前为算法接入与交互测试版：拆补、置闰、阴盘的专业起局、置闰节气与阴盘流派规则尚未完成核验；本页不伪造自动起局结果。可手动指定阴阳遁及局数预览地盘九宫，不应据此作专业判断。</div><div class="inputs"><label>排盘方法<select id="method"><option value="拆补">拆补</option><option value="置闰">置闰</option><option value="阴盘">阴盘</option></select></label><label>起局时间<input type="datetime-local" id="when"></label><label>遁法<select id="dun"><option value="阳">阳遁</option><option value="阴">阴遁</option></select></label><label>局数<select id="ju"><option value="1">1局</option><option value="2">2局</option><option value="3">3局</option><option value="4">4局</option><option value="5">5局</option><option value="6">6局</option><option value="7">7局</option><option value="8">8局</option><option value="9">9局</option></select></label><button id="calc">手动布地盘</button><button class="secondary" onclick="window.print()">打印</button></div></div><div class="panel"><h2 id="resultTitle">九宫地盘预览</h2><div class="grid9" id="board"></div></div><div class="panel"><h2>本账号本机草稿</h2><button class="secondary" id="save">保存当前预览</button><div id="history" class="small"></div><p class="notice">草稿仅保存在本浏览器、按登录用户 ID 隔离；尚未写入 Supabase，也不属于正式云端排盘历史。</p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="xinggui_session.js"></script><script>
let signedInId=null;
async function initAccount(){try{await XingguiSession.ready;if(!await XingguiSession.verifyLogin()){location.replace('index.html');return false}const a=XingguiSession.account();if(!a?.id){location.replace('index.html');return false}signedInId=a.id;const p=a.profile;document.getElementById('account').textContent='👤 当前账号：'+(p?.name||p?.email||'已登录')+(p?.email?' ('+p.email+')':'');return true}catch(e){document.getElementById('account').textContent='登录验证失败：'+e.message;return false}}
function escapeText(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveLocal(kind,item){if(!signedInId)throw Error('未登录');const key='xinggui_'+kind+'_draft_'+signedInId;const old=JSON.parse(localStorage.getItem(key)||'[]');old.unshift({...item,savedAt:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(old.slice(0,40)))}
function historyLocal(kind){return JSON.parse(localStorage.getItem('xinggui_'+kind+'_draft_'+signedInId)||'[]')}
</script><script>
const palaces=[4,9,2,3,5,7,8,1,6],stems=['戊','己','庚','辛','壬','癸','丁','丙','乙'];let current=null;
function draw(){const method=document.getElementById('method').value,dun=document.getElementById('dun').value,ju=+document.getElementById('ju').value,when=document.getElementById('when').value;if(!when){alert('请先选择起局时间');return}const map={};for(let i=0;i<9;i++){const n=((ju-1+(dun==='阳'?i:-i)+900)%9)+1;map[n]=stems[i]}document.getElementById('board').innerHTML=palaces.map(n=>'<div class="cell"><div class="top"><span>'+n+'宫</span><span>地盘</span></div><div class="mid">'+map[n]+'</div><div class="bottom">天盘／八门／九星／八神：待校验</div></div>').join('');document.getElementById('resultTitle').textContent=method+' · '+dun+ju+'局 · 地盘三奇六仪预览';current={method,dun,ju,when,map};}
function history(){document.getElementById('history').innerHTML=historyLocal('qimen').slice(0,10).map(x=>'<div>'+escapeText(x.savedAt)+' · '+escapeText(x.method)+' · '+escapeText(x.dun)+escapeText(x.ju)+'局</div>').join('')||'暂无本机草稿'}
document.addEventListener('DOMContentLoaded',async()=>{if(!await initAccount())return;const d=new Date(),local=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);document.getElementById('when').value=local;document.getElementById('calc').onclick=draw;document.getElementById('save').onclick=()=>{if(!current){alert('请先布盘');return}saveLocal('qimen',current);history()};draw();history()});
</script></body></html>
